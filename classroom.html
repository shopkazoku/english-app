<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Classroom - Study Daily</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    body { font-family: 'Nunito', sans-serif; background: #f8fafc; overflow: hidden; }
    .custom-scroll::-webkit-scrollbar { width: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 8px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
    audio { width: 100%; height: 44px; outline: none; border-radius: 12px; }
    audio::-webkit-media-controls-panel { background-color: #f1f5f9; border-radius: 12px; }
    .tab-btn { transition: all 0.3s; }
    .tab-btn.active { background-color: #4f46e5; color: white; border-color: #4338ca; box-shadow: 0 4px 0 #3730a3; transform: translateY(-2px); }
  </style>
</head>
<body class="h-[100dvh] w-full flex flex-col bg-[url('https://www.transparenttextures.com/patterns/diagmonds-light.png')] relative overflow-hidden" id="mainBody">

  <!-- HEADER -->
  <header class="bg-white border-b-2 border-indigo-100 p-3 sm:p-4 flex justify-between items-center shadow-sm z-50 shrink-0">
    <div class="flex items-center space-x-3">
      <button onclick="window.location.href='dashboard.html'" class="w-10 h-10 bg-slate-100 hover:bg-slate-200 rounded-xl flex items-center justify-center text-slate-600 transition shadow-sm border border-slate-200"><i class="fa-solid fa-arrow-left"></i></button>
      <div class="flex flex-col">
        <h1 class="font-black text-lg sm:text-xl text-indigo-900 leading-tight">Smart Classroom</h1>
        <select id="courseSelect" onchange="switchLevel(this.value)" class="mt-0.5 bg-indigo-50 border border-indigo-200 text-indigo-700 font-bold px-2 py-0.5 rounded-lg focus:outline-none text-[10px] sm:text-xs uppercase">
            <option value="starter">STARTER CLASS</option>
            <option value="level_1">LEVEL 1 CLASS</option>
            <option value="level_2">LEVEL 2 CLASS</option>
            <option value="level_3">LEVEL 3 CLASS</option>
            <option value="level_4">LEVEL 4 CLASS</option>
            <option value="level_5">LEVEL 5 CLASS</option>
            <option value="level_6">LEVEL 6 CLASS</option>
        </select>      </div>
    </div>
    <div class="flex items-center bg-amber-50 px-3 py-2 rounded-full border border-amber-200 shadow-sm">
      <i class="fa-solid fa-coins text-amber-500 mr-2 text-lg animate-bounce"></i><span id="displayCoins" class="font-black text-amber-700 text-lg">...</span>
    </div>
  </header>

  <!-- LOADING OVERLAY -->
  <div id="loadingOverlay" class="absolute inset-0 z-[100] flex flex-col items-center justify-center bg-white mt-16 transition-opacity duration-500">
      <i class="fa-solid fa-cloud-arrow-down fa-bounce text-5xl text-indigo-500 mb-4"></i><p class="font-black text-slate-500 animate-pulse text-sm">Syncing Data...</p>
  </div>

  <!-- DICTIONARY SIDEBAR -->
  <button onclick="toggleDict()" class="fixed top-1/3 right-0 transform -translate-y-1/2 bg-indigo-600 text-white p-3 rounded-l-xl shadow-[-5px_0_15px_rgba(79,70,229,0.4)] z-[9999] hover:pr-5 transition-all"><i class="fa-solid fa-language text-xl"></i></button>
  <div id="dictSidebar" class="fixed top-20 right-0 h-[70vh] min-h-[400px] w-80 bg-white shadow-[-10px_10px_30px_rgba(0,0,0,0.3)] transform translate-x-full transition-transform duration-300 z-[9999] flex flex-col border-y-2 border-l-4 border-indigo-600 rounded-l-2xl overflow-hidden">
      <div class="bg-indigo-600 p-4 flex justify-between items-center text-white shrink-0">
          <div class="font-black flex items-center gap-2 text-lg"><i class="fa-solid fa-book-open"></i> Dictionary</div>
          <button onclick="toggleDict()" class="w-8 h-8 flex items-center justify-center bg-indigo-700 rounded-full hover:text-rose-300"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="p-3 bg-slate-50 border-b flex gap-2">
          <input type="text" id="dictInput" placeholder="Type a word..." class="w-full px-3 py-3 rounded-xl border-2 border-slate-200 font-bold" onkeypress="if(event.key === 'Enter') translateWord()">
          <button onclick="translateWord()" class="bg-indigo-600 text-white px-4 rounded-xl"><i class="fa-solid fa-magnifying-glass"></i></button>
      </div>
      <div class="p-4 flex-1 overflow-y-auto bg-slate-50" id="dictResult"><div class="flex flex-col items-center justify-center h-full text-slate-400 opacity-70"><p class="text-sm font-bold">Type to translate!</p></div></div>
  </div>

  <!-- DICTIONARY POPUP -->
  <div id="dictPopup" class="fixed hidden z-[9999] bg-white rounded-2xl shadow-xl border-2 border-indigo-100 p-4 w-64 opacity-0 translate-y-2 transition-all">
      <div class="flex justify-between items-start mb-2">
          <h4 id="dictPopupWord" class="font-black text-indigo-900 text-lg">Word</h4>
          <button onclick="playDictAudio()" class="text-indigo-400 bg-indigo-50 w-8 h-8 rounded-full flex items-center justify-center"><i class="fa-solid fa-volume-high"></i></button>
      </div>
      <p id="dictPopupMeaning" class="text-slate-600 font-bold text-sm">Translating...</p>
  </div>

  <main class="flex-1 w-full max-w-[95%] lg:max-w-7xl mx-auto p-2 sm:p-4 flex flex-col min-h-0 relative opacity-0 transition-opacity duration-500" id="mainContent">
    
    <!-- TABS -->
    <div class="flex gap-2 shrink-0">
        <button onclick="switchWorkspace('bookTab')" id="btn_bookTab" class="tab-btn active flex-1 bg-white border-2 border-slate-200 text-slate-600 font-black py-3 rounded-2xl uppercase text-sm"><i class="fa-solid fa-book-open mr-2"></i> E-Book</button>
        <button onclick="switchWorkspace('grammarTab')" id="btn_grammarTab" class="tab-btn flex-1 bg-white border-2 border-slate-200 text-slate-600 font-black py-3 rounded-2xl uppercase text-sm"><i class="fa-solid fa-spell-check mr-2"></i> Grammar</button>
        <button onclick="switchWorkspace('exerciseTab')" id="btn_exerciseTab" class="tab-btn flex-1 bg-white border-2 border-slate-200 text-slate-600 font-black py-3 rounded-2xl uppercase text-sm"><i class="fa-solid fa-pen-to-square mr-2 text-indigo-500"></i> SMART EXERCISE</button>
    </div>

    <!-- NỘI DUNG TABS -->
    <div class="flex-1 w-full relative min-h-0 mt-3 rounded-3xl overflow-hidden shadow-xl border-4 border-indigo-50 bg-white">
        
        <!-- E-BOOK -->
        <div id="bookTab" class="workspace-content absolute inset-0 w-full h-full bg-slate-100 overflow-hidden relative">
            <div class="absolute bottom-4 right-4 bg-slate-900/80 p-2 rounded-2xl flex gap-2 z-30 shadow-xl border border-slate-700">
                <button onclick="zoomPdf('out')" class="w-10 h-10 bg-slate-800 text-white rounded-xl"><i class="fa-solid fa-minus"></i></button>
                <button onclick="zoomPdf('fit')" class="px-4 h-10 bg-slate-800 text-white font-bold text-xs uppercase rounded-xl">FIT</button>
                <button onclick="zoomPdf('in')" class="w-10 h-10 bg-slate-800 text-white rounded-xl"><i class="fa-solid fa-plus"></i></button>
            </div>
            <iframe id="pdfViewer" src="" class="absolute top-0 left-0 w-full h-full border-none z-10" allowfullscreen="true"></iframe>
        </div>

        <!-- GRAMMAR -->
        <div id="grammarTab" class="workspace-content hidden absolute inset-0 w-full h-full bg-white overflow-y-auto custom-scroll p-6 sm:p-10 cursor-text">
            <div class="max-w-4xl mx-auto flex flex-col items-center text-center">
                <div class="bg-indigo-100 text-indigo-600 w-16 h-16 rounded-full flex items-center justify-center text-3xl mb-4"><i class="fa-solid fa-lightbulb"></i></div>
                <h2 id="gramTitle" class="text-2xl sm:text-4xl font-black text-slate-800 mb-6 border-b-2 border-slate-100 pb-4 w-full">Loading...</h2>
                <p id="gramExplanation" class="text-lg text-slate-600 font-bold mb-8 bg-slate-50 p-6 rounded-2xl border text-left w-full"></p>
                <div id="grammarExamples" class="w-full space-y-4 text-left"></div>
            </div>
        </div>

        <!-- SMART EXERCISE TAB -->
        <div id="exerciseTab" class="workspace-content hidden absolute inset-0 w-full h-full bg-slate-50 overflow-y-auto custom-scroll p-4 sm:p-8">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 w-full max-w-4xl mx-auto">
                <div class="flex items-center justify-between border-b pb-4 mb-6">
                    <h2 class="text-2xl font-extrabold text-indigo-700 flex items-center">
                        <i class="fa-solid fa-pen-to-square mr-3"></i> Smart Exercise
                    </h2>
                    <span class="text-sm text-indigo-500 font-black bg-indigo-50 border border-indigo-100 px-4 py-1.5 rounded-full uppercase">Practice</span>
                </div>

                <div id="question-container" class="space-y-6"></div>

                <div id="result-container" class="mt-8 hidden text-center p-6 rounded-2xl border-2 border-dashed border-indigo-300 transform transition-all scale-95">
                    <h3 id="result-text" class="text-3xl font-black text-indigo-700 mb-2"></h3>
                    <p class="text-gray-600 font-medium">Turn on your speaker to hear Teacher Emma's feedback!</p>
                </div>

                <button onclick="submitExercise()" class="mt-8 w-full py-4 bg-gradient-to-r from-indigo-600 to-purple-600 text-white rounded-xl font-bold text-lg shadow-lg hover:shadow-xl hover:-translate-y-1 transform transition flex justify-center items-center">
                    <i class="fa-solid fa-check-circle mr-2"></i> SUBMIT & GET SCORE
                </button>
            </div>
        </div>
    </div>

    <!-- AUDIO CONTROLS -->
    <div class="w-full bg-white rounded-3xl border-4 border-slate-100 p-3 flex flex-col lg:flex-row gap-4 shrink-0 mt-3 mb-1">
        <div class="flex-1 w-full flex flex-col sm:flex-row gap-3">
            <div class="flex gap-2 w-full sm:w-auto shrink-0">
                <select id="unitSelect" onchange="changeUnit()" class="bg-slate-100 border border-slate-300 font-bold px-2 py-2 rounded-xl w-full sm:w-28 text-sm uppercase"></select>
                <select id="trackSelect" onchange="changeTrack(this.value)" class="bg-slate-100 border border-slate-300 font-bold px-2 py-2 rounded-xl w-full sm:w-36 text-sm"></select>
            </div>
            <div class="flex-1 w-full"><audio id="audioPlayer" controls class="w-full"><source id="audioSource" src="" type="audio/mpeg"></audio></div>
        </div>
        <div class="w-full lg:w-auto flex gap-2 shrink-0">
            <button onclick="goToReading()" class="flex-1 bg-violet-600 text-white font-black px-4 py-3 rounded-xl shadow-[0_4px_0_#7c3aed] text-sm"><i class="fa-solid fa-microphone-lines mr-1 animate-pulse"></i> READING</button>
        </div>
    </div>
  </main>
  
  <script>
    // ==========================================
    // CẤU HÌNH HỆ THỐNG VÀ FIREBASE (CHỈ DÙNG CHO USER & COIN)
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyD8EXAmo1IlRCnQ_EFXorlKDrtrJmx8J1M",
      authDomain: "roundup-ai-academy.firebaseapp.com",
      projectId: "roundup-ai-academy",
      storageBucket: "roundup-ai-academy.firebasestorage.app",
      messagingSenderId: "723976989630",
      appId: "1:723976989630:web:45f3de91269e70f604e7ef"
    };
    
    const GITHUB_BASE_URL = "https://shopkazoku.github.io/roundup-audio";
    const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbwtm-mJCRvAiXcbLI_dWEnzDGbqw1sWeBQqISC614dsvuiGkzyx6j-z5RS6jNx0xaX27w/exec";
    
    const unitMapping = [
        { unit: 1, name: "Unit 1", startTrack: 1, endTrack: 6 },
        { unit: 2, name: "Unit 2", startTrack: 7, endTrack: 11 },
        { unit: 3, name: "Unit 3", startTrack: 12, endTrack: 17 }
    ];

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth(); 
    const db = firebase.database();
    
    let currentUser = null; 
    let currentlyViewingLevel = "starter"; 
    let currentPdfZoom = 'page-width'; 
    
    // BIẾN LƯU TRỮ DỮ LIỆU TỔNG TỪ GOOGLE SHEETS
    let masterSheetData = null; 
    let currentExerciseData = [];

    // ==========================================
    // KHỞI ĐỘNG HỆ THỐNG (ĐỒNG BỘ GOOGLE SHEETS TRƯỚC KHI VẼ GIAO DIỆN)
    // ==========================================
    auth.onAuthStateChanged((user) => {
      if (user) {
        currentUser = user;
        db.ref('users/' + user.uid).once('value')
        .then(async (snapshot) => {
          try {
              let data = snapshot.val() || { coins: 0, current_level: 'starter' };
              document.getElementById('displayCoins').innerText = data.coins || 0;
              currentlyViewingLevel = data.current_level || 'starter'; 
              document.getElementById('courseSelect').value = currentlyViewingLevel;
              
              // HÚT TOÀN BỘ DATA TỪ GOOGLE SHEETS 1 LẦN DUY NHẤT
              await syncGoogleSheetsData();
              
              buildClassroom(); 
          } catch(e) { console.error("Lỗi khởi tạo:", e); }
        })
        .finally(() => {
            setTimeout(() => { 
                document.getElementById('loadingOverlay').style.display = 'none'; 
                document.getElementById('mainContent').style.opacity = '1'; 
            }, 500);
        });
      } else { window.location.href = "index.html"; }
    });

    async function syncGoogleSheetsData() {
        try {
            let res = await fetch(SHEET_API_URL);
            masterSheetData = await res.json();
            console.log("Đã tải thành công Dữ liệu Hệ sinh thái:", masterSheetData);
        } catch(e) {
            console.error("Lỗi kết nối Google Sheets:", e);
            masterSheetData = { exercise: {}, grammar: {}, reading: {}, exam: {} };
        }
    }

    function switchLevel(levelText) {
        if(!levelText) return;
        currentlyViewingLevel = levelText.split(' ')[0].toLowerCase();
        buildClassroom();
    }

    function goToReading() { window.location.href = `reading.html?level=${currentlyViewingLevel}`; }
    
    function zoomPdf(action) {
        if (action === 'fit') currentPdfZoom = 'page-width';
        else { if (typeof currentPdfZoom !== 'number') currentPdfZoom = 100; action === 'in' ? currentPdfZoom += 25 : currentPdfZoom = Math.max(50, currentPdfZoom - 25); }
        document.getElementById('pdfViewer').src = `https://mozilla.github.io/pdf.js/web/viewer.html?file=${encodeURIComponent(GITHUB_BASE_URL+'/'+currentlyViewingLevel+'/student_book.pdf')}#zoom=${currentPdfZoom}`;
    }

    function switchWorkspace(tabId) {
        document.querySelectorAll('.workspace-content').forEach(el => el.classList.add('hidden'));
        document.querySelectorAll('.tab-btn').forEach(el => { el.classList.remove('active', 'bg-indigo-600', 'text-white'); el.classList.add('bg-white', 'text-slate-600'); });
        document.getElementById(tabId).classList.remove('hidden');
        document.getElementById('btn_' + tabId).classList.add('active'); 
        document.getElementById('btn_' + tabId).classList.remove('bg-white', 'text-slate-600');
    }

    function buildClassroom() {
        zoomPdf('fit');
        document.getElementById('unitSelect').innerHTML = unitMapping.map((u, i) => `<option value="${i}">${u.name}</option>`).join('');
        changeUnit(); 
    }

    function changeUnit() {
        let selectVal = document.getElementById('unitSelect').value || 0;
        let u = unitMapping[selectVal] || unitMapping[0]; 
        let trackHTML = '';
        for(let i = u.startTrack; i <= u.endTrack; i++) { 
            let t = i < 10 ? '0'+i : i; 
            trackHTML += `<option value="${GITHUB_BASE_URL}/${currentlyViewingLevel}/track_${t}.mp3">Track ${t}</option>`; 
        }
        document.getElementById('trackSelect').innerHTML = trackHTML;
        changeTrack(document.getElementById('trackSelect').value);
        
        // Điều phối vẽ giao diện từ Cache Data
        renderGrammarFromSheet();
        renderExerciseFromSheet(); 
    }
    
    function changeTrack(url) { 
        if(!url) return;
        document.getElementById('audioSource').src = url; 
        document.getElementById('audioPlayer').load(); 
    }

    // ==========================================
    // VẼ GIAO DIỆN TỪ GOOGLE SHEETS TRỰC TIẾP
    // ==========================================
    function renderGrammarFromSheet() {
        let currentLevel = currentlyViewingLevel.toLowerCase();
        let uIdx = parseInt(document.getElementById('unitSelect').value || 0) + 1;
        let unitKey = "unit_" + uIdx;
        
        const examArea = document.getElementById('grammarExamples'); 
        examArea.innerHTML = "";

        if (masterSheetData && masterSheetData.grammar && masterSheetData.grammar[currentLevel] && masterSheetData.grammar[currentLevel][unitKey]) {
            let gData = masterSheetData.grammar[currentLevel][unitKey];
            document.getElementById('gramTitle').innerText = gData.title || "Grammar Focus";
            document.getElementById('gramExplanation').innerText = gData.explanation || "";
            if(gData.ex1_en) {
                examArea.innerHTML += `<div class="bg-indigo-50/50 p-4 rounded-xl flex gap-4"><button onclick="readAloudDict('${gData.ex1_en.replace(/'/g, "\\'")}')" class="bg-indigo-500 text-white w-10 h-10 rounded-full shrink-0"><i class="fa-solid fa-volume-high"></i></button><div><p class="font-black text-slate-800">${gData.ex1_en}</p><p class="text-sm font-bold text-slate-500">${gData.ex1_vi}</p></div></div>`;
            }
        } else {
            document.getElementById('gramTitle').innerText = "Grammar Details"; 
            document.getElementById('gramExplanation').innerText = "No grammar rules added for this unit yet."; 
        }
    }

    function renderExerciseFromSheet() {
        const container = document.getElementById('question-container');
        const submitBtn = document.querySelector('button[onclick="submitExercise()"]'); 
        document.getElementById('result-container').classList.add('hidden');
        
        let currentLevel = currentlyViewingLevel.toLowerCase();
        let uIdx = parseInt(document.getElementById('unitSelect').value || 0) + 1;
        let unitKey = "unit_" + uIdx;

        if (masterSheetData && masterSheetData.exercise && masterSheetData.exercise[currentLevel] && masterSheetData.exercise[currentLevel][unitKey]) {
            currentExerciseData = masterSheetData.exercise[currentLevel][unitKey];
            if(submitBtn) submitBtn.classList.remove('hidden'); 
            
            container.innerHTML = '';
            currentExerciseData.forEach((item, index) => {
                let optionsHtml = '';
                item.options.forEach((opt, optIdx) => {
                    if(opt) { 
                        optionsHtml += `
                            <label class="flex items-center space-x-3 p-3 border-2 border-gray-100 rounded-xl cursor-pointer hover:bg-indigo-50 hover:border-indigo-300 transition group">
                                <input type="radio" name="q${index}" value="${optIdx + 1}" class="form-radio h-5 w-5 text-indigo-600">
                                <span class="text-gray-700 font-medium group-hover:text-indigo-700">${opt}</span>
                            </label>
                        `;
                    }
                });
                container.innerHTML += `
                    <div class="p-6 border border-slate-100 bg-slate-50/30 rounded-2xl shadow-sm hover:shadow-md transition">
                        <p class="font-bold text-lg mb-4 text-gray-800"><span class="text-indigo-600">Question ${index + 1}:</span> ${item.q}</p>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            ${optionsHtml}
                        </div>
                        <p id="exp-q${index}" class="mt-4 hidden text-sm font-semibold bg-rose-50 text-rose-600 p-3 rounded-lg border border-rose-100"></p>
                    </div>
                `;
            });
        } else {
            currentExerciseData = [];
            if(submitBtn) submitBtn.classList.add('hidden'); 
            container.innerHTML = `
                <div class="bg-slate-50 p-8 rounded-2xl text-center border-2 border-dashed border-slate-200">
                    <i class="fa-solid fa-folder-open text-slate-300 text-5xl mb-3"></i>
                    <p class="text-slate-600 font-black text-lg">No exercises available.</p>
                    <p class="text-slate-400 text-sm mt-1">Exercises for ${currentLevel.toUpperCase()} - Unit ${uIdx} will be updated soon.</p>
                </div>`;
        }
    }

    function submitExercise() {
        let correctCount = 0;
        
        currentExerciseData.forEach((item, index) => {
            const selected = document.querySelector(`input[name="q${index}"]:checked`);
            const expEl = document.getElementById(`exp-q${index}`);
            
            if (selected && parseInt(selected.value) === item.ans) {
                correctCount++;
                expEl.classList.add('hidden'); 
            } else {
                expEl.innerHTML = `<i class="fa-solid fa-circle-xmark mr-1"></i> Incorrect! ${item.exp}`;
                expEl.classList.remove('hidden');
            }
        });

        const total = currentExerciseData.length;
        const score = total > 0 ? (correctCount / total) * 20 : 0;
        let resultText = ""; let feedbackLevel = 1;
        
        if (score >= 18) { feedbackLevel = 3; resultText = `Score: ${score}/20 - Excellent! +100 Coins`; }
        else if (score >= 10) { feedbackLevel = 2; resultText = `Score: ${score}/20 - Good effort! +50 Coins`; }
        else { feedbackLevel = 1; resultText = `Score: ${score}/20 - Keep trying!`; }

        const resBox = document.getElementById('result-container');
        resBox.querySelector('#result-text').innerHTML = resultText;
        resBox.classList.remove('hidden');
        resBox.classList.add('scale-100', 'bg-indigo-50');

        speakTeacherVoice(feedbackLevel, score);
    }

    // ==========================================
    // XỬ LÝ VOICE VÀ TỪ ĐIỂN
    // ==========================================
    function getFemaleVoice() {
        let voices = window.speechSynthesis.getVoices();
        return voices.find(v => v.lang.startsWith('en') && (v.name.includes('Zira') || v.name.includes('Samantha') || v.name.includes('Victoria') || v.name.includes('Google US English'))) || voices.find(v => v.lang.startsWith('en'));
    }

    if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = function() { window.speechSynthesis.getVoices(); };
    }

    function speakTeacherVoice(level, score) {
        let speech = new SpeechSynthesisUtterance();
        speech.lang = 'en-US'; speech.pitch = 1.3; speech.rate = 1.0;
        let femaleVoice = getFemaleVoice();
        if (femaleVoice) speech.voice = femaleVoice;
        
        if (level === 3) speech.text = `Excellent job! You got ${score} out of 20. Keep it up!`;
        else if (level === 2) speech.text = `Good effort! You got ${score} out of 20. Let's review a little bit.`;
        else speech.text = `Don't give up! You got ${score} out of 20. Let's check the mistakes and try again.`;
        window.speechSynthesis.speak(speech);
    }

    function toggleDict() { document.getElementById('dictSidebar').classList.toggle('translate-x-full'); }
    
    async function translateWord(word = null) {
        const txt = word || document.getElementById('dictInput').value.trim(); if (!txt) return;
        document.getElementById('dictInput').value = txt; document.getElementById('dictSidebar').classList.remove('translate-x-full');
        document.getElementById('dictResult').innerHTML = '<div class="text-center text-indigo-500 mt-10"><i class="fa-solid fa-spinner fa-spin text-4xl"></i></div>';
        try {
            let res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(txt)}&langpair=en|vi`); let data = await res.json();
            document.getElementById('dictResult').innerHTML = `<div class="bg-white rounded-2xl p-5 shadow-sm text-center"><h3 class="text-2xl font-black text-indigo-900 mb-2">${txt}</h3><p class="text-emerald-600 font-black text-xl mb-4">${data.responseData.translatedText}</p><button onclick="readAloudDict('${txt.replace(/'/g, "\\'")}')" class="bg-indigo-100 text-indigo-600 w-14 h-14 rounded-full mx-auto"><i class="fa-solid fa-volume-high text-2xl"></i></button></div>`;
        } catch(e) {}
    }

    function readAloudDict(text) { 
        if ('speechSynthesis' in window) { 
            window.speechSynthesis.cancel(); 
            let u = new SpeechSynthesisUtterance(text); u.lang='en-US'; 
            let femaleVoice = getFemaleVoice();
            if (femaleVoice) u.voice = femaleVoice;
            window.speechSynthesis.speak(u); 
        } 
    }

    const dictPopup = document.getElementById('dictPopup');
    document.getElementById('grammarTab').addEventListener('mouseup', async (e) => {
        let txt = window.getSelection().toString().trim();
        if (txt.length > 0 && txt.length < 40) {
            document.getElementById('dictPopupWord').innerText = txt; document.getElementById('dictPopupMeaning').innerText = "Translating...";
            let x = e.clientX; let y = e.clientY + 20;
            if(x + 260 > window.innerWidth) x = window.innerWidth - 270; if(y + 100 > window.innerHeight) y = e.clientY - 120; 
            dictPopup.style.left = `${x}px`; dictPopup.style.top = `${y}px`; dictPopup.classList.remove('hidden');
            setTimeout(() => { dictPopup.classList.remove('opacity-0', 'translate-y-2'); }, 10);
            try { let res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(txt)}&langpair=en|vi`); let data = await res.json(); document.getElementById('dictPopupMeaning').innerText = data.responseData.translatedText || "Not found."; } catch(err) {}
        }
    });
    
    document.addEventListener('mousedown', (e) => { 
        if (!dictPopup.contains(e.target)) { dictPopup.classList.add('opacity-0', 'translate-y-2'); setTimeout(() => { dictPopup.classList.add('hidden'); }, 200); } 
    });

    document.addEventListener('mouseup', function() {
        let selectedText = window.getSelection().toString().trim();
        if (selectedText.length > 0 && selectedText.length <= 25) {
            let wordAudio = new SpeechSynthesisUtterance(selectedText); wordAudio.lang = 'en-US';
            let femaleVoice = getFemaleVoice();
            if (femaleVoice) wordAudio.voice = femaleVoice;
            window.speechSynthesis.speak(wordAudio);
        }
    });
  </script>
</body>
</html>
