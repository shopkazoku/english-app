<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Classroom - Round-Up AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    body { font-family: 'Nunito', sans-serif; background: #f8fafc; overflow: hidden; }
    .custom-scroll::-webkit-scrollbar { width: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 8px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
    
    audio { width: 100%; height: 44px; outline: none; border-radius: 12px; }
    audio::-webkit-media-controls-panel { background-color: #f1f5f9; border-radius: 12px; }
    audio::-webkit-media-controls-play-button, audio::-webkit-media-controls-mute-button { background-color: #e2e8f0; border-radius: 50%; }

    .tab-btn { transition: all 0.3s; }
    .tab-btn.active { background-color: #4f46e5; color: white; border-color: #4338ca; box-shadow: 0 4px 0 #3730a3; transform: translateY(-2px); }
  </style>
</head>
<body class="h-[100dvh] w-full flex flex-col bg-[url('https://www.transparenttextures.com/patterns/diagmonds-light.png')] relative overflow-hidden" id="mainBody">

  <!-- TOPBAR -->
  <header class="bg-white border-b-2 border-indigo-100 p-3 sm:p-4 flex justify-between items-center shadow-sm z-50 shrink-0">
    <div class="flex items-center space-x-3">
      <button onclick="window.location.href='dashboard.html'" class="w-10 h-10 bg-slate-100 hover:bg-slate-200 rounded-xl flex items-center justify-center text-slate-600 transition shadow-sm border border-slate-200">
        <i class="fa-solid fa-arrow-left"></i>
      </button>
      <div class="flex flex-col">
        <h1 class="font-black text-lg sm:text-xl text-indigo-900 leading-tight">Smart Classroom</h1>
        <select id="courseSelect" onchange="switchLevel(this.value)" class="mt-0.5 bg-indigo-50 border border-indigo-200 text-indigo-700 font-bold px-2 py-0.5 rounded-lg focus:outline-none focus:border-indigo-500 text-[10px] sm:text-xs uppercase tracking-wider cursor-pointer shadow-inner">
            <option>Loading...</option>
        </select>
      </div>
    </div>
    
    <div class="flex items-center bg-amber-50 px-3 sm:px-4 py-2 rounded-full border border-amber-200 shadow-sm">
      <i class="fa-solid fa-coins text-amber-500 mr-1 sm:mr-2 text-lg animate-bounce"></i>
      <span id="displayCoins" class="font-black text-amber-700 text-lg sm:text-xl">...</span>
    </div>
  </header>

  <!-- LOADING OVERLAY -->
  <div id="loadingOverlay" class="absolute inset-0 z-[100] flex flex-col items-center justify-center bg-white mt-16 transition-opacity duration-500">
      <i id="loadingIcon" class="fa-solid fa-cloud-arrow-down fa-bounce text-5xl text-indigo-500 mb-4"></i>
      <p id="loadingText" class="font-black text-slate-500 animate-pulse uppercase tracking-widest text-sm mb-4">Syncing Curriculum Data...</p>
      <button id="loadingBackBtn" onclick="window.location.href='dashboard.html'" class="hidden bg-slate-200 hover:bg-slate-300 text-slate-600 font-bold px-6 py-2 rounded-xl transition">
          <i class="fa-solid fa-arrow-left mr-2"></i> Go Back
      </button>
  </div>

  <!-- MAIN WORKSPACE (R&D RESPONSIVE FIX) -->
  <main class="flex-1 w-full max-w-[95%] lg:max-w-7xl mx-auto p-2 sm:p-4 flex flex-col min-h-0 relative opacity-0 transition-opacity duration-500" id="mainContent">
    
    <!-- HỆ THỐNG TABS SƯ PHẠM -->
    <div class="flex gap-2 shrink-0">
        <button onclick="switchWorkspace('bookTab')" id="btn_bookTab" class="tab-btn active flex-1 bg-white border-2 border-slate-200 text-slate-600 font-black py-3 rounded-2xl flex items-center justify-center uppercase tracking-widest text-sm shadow-sm">
            <i class="fa-solid fa-book-open mr-2"></i> E-Book
        </button>
        <button onclick="switchWorkspace('grammarTab')" id="btn_grammarTab" class="tab-btn flex-1 bg-white border-2 border-slate-200 text-slate-600 font-black py-3 rounded-2xl flex items-center justify-center uppercase tracking-widest text-sm shadow-sm">
            <i class="fa-solid fa-spell-check mr-2"></i> Grammar
        </button>
    </div>

    <!-- KHU VỰC HIỂN THỊ CHÍNH (Đã fix Flex-1 để tự động bù trừ không gian) -->
    <div class="flex-1 w-full relative min-h-0 mt-3 rounded-3xl overflow-hidden shadow-xl border-4 border-indigo-50 bg-white">
        
        <!-- WORKSPACE 1: E-BOOK PDF (Đã tối ưu cảm ứng Mobile) -->
        <!-- Thêm style overscroll để hỗ trợ vuốt mượt mà trên iPhone/Android -->
        <div id="bookTab" class="workspace-content absolute inset-0 w-full h-full bg-slate-100 overflow-auto" style="-webkit-overflow-scrolling: touch;">
            <div class="absolute top-0 left-0 bg-indigo-600 text-white text-[10px] font-black px-3 py-1 rounded-br-2xl shadow-sm z-10 flex items-center pointer-events-none">
                <i class="fa-solid fa-file-pdf mr-1"></i> E-Book Viewer
            </div>
            <!-- Chuyển sang dùng iframe để Mobile dễ tương tác Zoom hơn -->
            <iframe id="pdfViewer" src="" class="w-full h-full border-none" allowfullscreen="true" scrolling="auto"></iframe>
        </div>

        <!-- WORKSPACE 2: GRAMMAR -->
        <div id="grammarTab" class="workspace-content hidden absolute inset-0 w-full h-full bg-white overflow-y-auto custom-scroll p-6 sm:p-10">
            <div class="max-w-4xl mx-auto flex flex-col items-center text-center">
                <div class="bg-indigo-100 text-indigo-600 w-16 h-16 rounded-full flex items-center justify-center text-3xl mb-4 shadow-inner border-2 border-white ring-4 ring-indigo-50">
                    <i class="fa-solid fa-lightbulb"></i>
                </div>
                
                <h2 id="gramTitle" class="text-2xl sm:text-4xl font-black text-slate-800 mb-6 border-b-2 border-slate-100 pb-4 w-full">Loading Grammar...</h2>
                <p id="gramExplanation" class="text-lg text-slate-600 font-bold leading-relaxed mb-8 bg-slate-50 p-6 rounded-2xl border border-slate-200 text-left w-full"></p>
                
                <div id="grammarExamples" class="w-full space-y-4 text-left">
                    <!-- Sẽ được Gen bằng JS -->
                </div>
            </div>
        </div>

    </div>

    <!-- KHU VỰC ĐIỀU KHIỂN DƯỚI CÙNG (Audio - Cố định an toàn không bị cắt) -->
    <div class="w-full bg-white rounded-3xl border-4 border-slate-100 shadow-[0_-5px_20px_rgba(0,0,0,0.05)] p-3 sm:p-4 flex flex-col lg:flex-row items-center gap-4 shrink-0 mt-3 mb-1">
        
        <div class="flex items-center justify-center w-12 h-12 bg-indigo-50 text-indigo-500 rounded-full shrink-0 shadow-inner hidden lg:flex">
            <i class="fa-solid fa-headphones text-xl"></i>
        </div>
        
        <div class="flex-1 w-full flex flex-col sm:flex-row items-start sm:items-center gap-3">
            <div class="flex gap-2 w-full sm:w-auto shrink-0">
                <div class="flex flex-col flex-1 sm:w-28">
                    <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1 ml-1">Select Unit</label>
                    <select id="unitSelect" onchange="changeUnit()" class="bg-slate-100 border border-slate-300 text-slate-700 font-bold px-2 py-2 rounded-xl focus:outline-none focus:border-indigo-500 w-full shadow-inner cursor-pointer text-sm">
                        <!-- Gen bằng JS -->
                    </select>
                </div>
                <div class="flex flex-col flex-1 sm:w-36">
                    <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1 ml-1">Select Track</label>
                    <select id="trackSelect" onchange="changeTrack(this.value)" class="bg-slate-100 border border-slate-300 text-slate-700 font-bold px-2 py-2 rounded-xl focus:outline-none focus:border-indigo-500 w-full shadow-inner cursor-pointer text-sm">
                        <!-- Gen bằng JS -->
                    </select>
                </div>
            </div>
            
            <div class="flex-1 w-full mt-2 sm:mt-0">
                <audio id="audioPlayer" controls controlsList="nodownload" class="w-full" onplay="markAudioListened()">
                    <source id="audioSource" src="" type="audio/mpeg">
                </audio>
            </div>
        </div>

        <div class="w-full lg:w-auto flex gap-2 shrink-0 mt-2 lg:mt-0">
            <button onclick="window.location.href='reading.html'" class="flex-1 lg:w-auto bg-violet-600 hover:bg-violet-500 text-white font-black px-4 py-3 rounded-xl shadow-[0_4px_0_#7c3aed] active:translate-y-[4px] active:shadow-[0_0px_0_#7c3aed] transition-all flex items-center justify-center whitespace-nowrap text-sm">
                <i class="fa-solid fa-microphone-lines mr-1 animate-pulse"></i> READING
            </button>
            
            <button id="btnComplete" onclick="completeLesson()" class="flex-1 lg:w-auto bg-slate-300 text-slate-500 cursor-not-allowed font-black px-4 py-3 rounded-xl shadow-[0_4px_0_#cbd5e1] transition-all flex items-center justify-center whitespace-nowrap text-sm relative group">
                <i class="fa-solid fa-lock mr-1" id="claimIcon"></i> <span id="claimText">LOCKED</span>
                <div class="absolute -top-10 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white text-[10px] py-1 px-2 rounded opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap pointer-events-none z-50">
                    Listen & View Grammar to Unlock
                </div>
            </button>
        </div>
    </div>
  </main>

  <footer class="w-full text-center py-2 shrink-0 z-40 bg-transparent border-t border-slate-200 mt-2">
      <p class="text-[11px] font-bold text-slate-400 uppercase tracking-widest">&copy; 2026 Son Nguyen. All rights reserved.</p>
  </footer>

  <script>
    // ==========================================
    // BOSS DÁN FIREBASE CONFIG VÀO ĐÂY BẮT BUỘC
    // ==========================================
    const firebaseConfig = {
  apiKey: "AIzaSyD8EXAmo1IlRCnQ_EFXorlKDrtrJmx8J1M",
  authDomain: "roundup-ai-academy.firebaseapp.com",
  projectId: "roundup-ai-academy",
  storageBucket: "roundup-ai-academy.firebasestorage.app",
  messagingSenderId: "723976989630",
  appId: "1:723976989630:web:45f3de91269e70f604e7ef"
};

    const GITHUB_BASE_URL = "https://shopkazoku.github.io/roundup-audio";
    const LEVEL_HIERARCHY = ['starter', 'level_1', 'level_2', 'level_3', 'level_4', 'level_5', 'level_6'];
    const unitMapping = [
        { unit: 1, name: "Unit 1", startTrack: 1, endTrack: 6 },
        { unit: 2, name: "Unit 2", startTrack: 7, endTrack: 11 },
        { unit: 3, name: "Unit 3", startTrack: 12, endTrack: 17 },
        { unit: 4, name: "Unit 4", startTrack: 18, endTrack: 23 },
        { unit: 5, name: "Unit 5", startTrack: 24, endTrack: 29 },
        { unit: 6, name: "Unit 6", startTrack: 30, endTrack: 35 },
        { unit: 7, name: "Unit 7", startTrack: 36, endTrack: 41 },
        { unit: 8, name: "Unit 8", startTrack: 42, endTrack: 47 },
        { unit: 9, name: "Unit 9", startTrack: 48, endTrack: 52 },
        { unit: 10, name: "Unit 10", startTrack: 53, endTrack: 58 },
        { unit: 11, name: "Unit 11", startTrack: 59, endTrack: 64 },
        { unit: 12, name: "Unit 12", startTrack: 65, endTrack: 70 },
        { unit: 13, name: "Unit 13", startTrack: 71, endTrack: 76 },
        { unit: 14, name: "Unit 14", startTrack: 77, endTrack: 81 },
        { unit: 15, name: "Unit 15", startTrack: 82, endTrack: 88 }
    ];

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    let currentUser = null;
    let userCoins = 0;
    let userMaxLevel = "starter"; 
    let currentlyViewingLevel = "starter"; 

    // BIẾN HỆ THỐNG SMART UNLOCK
    let hasListenedAudio = false;
    let hasViewedGrammar = false;
    let hasClaimed = false;

    // RƠ-LE AN TOÀN
    const safetyTimer = setTimeout(() => {
        document.getElementById('loadingIcon').classList.replace('fa-cloud-arrow-down', 'fa-triangle-exclamation');
        document.getElementById('loadingIcon').classList.replace('text-indigo-500', 'text-rose-500');
        document.getElementById('loadingText').innerText = "Network Error! Please try again.";
        document.getElementById('loadingText').classList.replace('text-slate-500', 'text-rose-500');
        document.getElementById('loadingBackBtn').classList.remove('hidden');
    }, 7000);

    auth.onAuthStateChanged((user) => {
      if (user) {
        currentUser = user;
        db.ref('users/' + user.uid).once('value').then((snapshot) => {
          clearTimeout(safetyTimer);
          const data = snapshot.val();
          if (data) {
            userCoins = data.coins || 0;
            userMaxLevel = data.current_level || 'starter'; 
            currentlyViewingLevel = userMaxLevel; 
            
            document.getElementById('displayCoins').innerText = userCoins;
            buildCourseDropdown(); 
            buildClassroom(currentlyViewingLevel); 
            
            setTimeout(() => {
                document.getElementById('loadingOverlay').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('loadingOverlay').style.display = 'none';
                    document.getElementById('mainContent').style.opacity = '1';
                }, 500);
            }, 500);
          }
        }).catch((error) => {
            document.getElementById('loadingText').innerText = "Database Connection Failed!";
            document.getElementById('loadingBackBtn').classList.remove('hidden');
        });
      } else { window.location.href = "index.html"; }
    });

    function switchWorkspace(tabId) {
        document.querySelectorAll('.workspace-content').forEach(el => el.classList.add('hidden'));
        document.querySelectorAll('.tab-btn').forEach(el => {
            el.classList.remove('active', 'bg-indigo-600', 'text-white', 'border-indigo-700');
            el.classList.add('bg-white', 'text-slate-600', 'border-slate-200');
            el.style.boxShadow = 'none';
        });

        document.getElementById(tabId).classList.remove('hidden');
        
        const btn = document.getElementById('btn_' + tabId);
        btn.classList.add('active');
        btn.classList.remove('bg-white', 'text-slate-600', 'border-slate-200');

        if(tabId === 'grammarTab') {
            hasViewedGrammar = true;
            checkClaimUnlock();
        }
    }

    function markAudioListened() {
        hasListenedAudio = true;
        checkClaimUnlock();
    }

    function checkClaimUnlock() {
        if (hasClaimed) return;
        const btn = document.getElementById('btnComplete');
        
        if (hasListenedAudio && hasViewedGrammar) {
            btn.classList.remove('bg-slate-300', 'text-slate-500', 'cursor-not-allowed', 'shadow-[0_4px_0_#cbd5e1]');
            btn.classList.add('bg-emerald-500', 'hover:bg-emerald-400', 'text-white', 'shadow-[0_4px_0_#059669]', 'active:translate-y-[4px]', 'active:shadow-[0_0px_0_#059669]', 'cursor-pointer');
            document.getElementById('claimIcon').classList.replace('fa-lock', 'fa-check-circle');
            document.getElementById('claimText').innerText = "CLAIM +50";
        }
    }

    function buildCourseDropdown() {
        const select = document.getElementById('courseSelect');
        select.innerHTML = '';
        let maxIndex = LEVEL_HIERARCHY.indexOf(userMaxLevel);
        if (maxIndex === -1) maxIndex = 0; 
        for (let i = 0; i <= maxIndex; i++) {
            let lvl = LEVEL_HIERARCHY[i];
            let opt = document.createElement('option');
            opt.value = lvl; opt.innerText = lvl.replace('_', ' ').toUpperCase() + ' CLASS';
            if (lvl === currentlyViewingLevel) opt.selected = true;
            select.appendChild(opt);
        }
    }

    function switchLevel(newLevel) {
        currentlyViewingLevel = newLevel;
        document.getElementById('loadingOverlay').style.display = 'flex';
        document.getElementById('loadingOverlay').style.opacity = '1';
        document.getElementById('mainContent').style.opacity = '0';
        buildClassroom(currentlyViewingLevel);
        
        setTimeout(() => {
            document.getElementById('loadingOverlay').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('loadingOverlay').style.display = 'none';
                document.getElementById('mainContent').style.opacity = '1';
            }, 500);
        }, 1000);
    }

    function buildClassroom(levelToLoad) {
        // HACK UI TỪ R&D: Ép trình duyệt fit sách vừa khung ngang bằng tham số #view=FitH
        const pdfUrl = `${GITHUB_BASE_URL}/${levelToLoad}/student_book.pdf#view=FitH&toolbar=0`;
        document.getElementById('pdfViewer').data = pdfUrl;
        document.getElementById('pdfFallback').href = pdfUrl;

        const urlParams = new URLSearchParams(window.location.search);
        const targetUnit = urlParams.get('unit');

        const unitSelect = document.getElementById('unitSelect');
        unitSelect.innerHTML = '';
        unitMapping.forEach((item, index) => {
            let opt = document.createElement('option');
            opt.value = index; opt.innerText = item.name;
            if (targetUnit && index === (parseInt(targetUnit) - 1)) opt.selected = true;
            unitSelect.appendChild(opt);
        });

        changeUnit(); 
    }
    
    function changeUnit() {
        updateTrackList();
        fetchGrammarData();
        
        hasListenedAudio = false;
        hasViewedGrammar = false;
        hasClaimed = false;
        
        const btn = document.getElementById('btnComplete');
        btn.className = "flex-1 lg:w-auto bg-slate-300 text-slate-500 cursor-not-allowed font-black px-4 py-3 rounded-xl shadow-[0_4px_0_#cbd5e1] transition-all flex items-center justify-center whitespace-nowrap text-sm relative group";
        document.getElementById('claimIcon').className = "fa-solid fa-lock mr-1";
        document.getElementById('claimText').innerText = "LOCKED";
    }

    function updateTrackList() {
        const unitIndex = document.getElementById('unitSelect').value;
        const selectedUnit = unitMapping[unitIndex];
        const trackSelect = document.getElementById('trackSelect');
        trackSelect.innerHTML = '';
        for(let i = selectedUnit.startTrack; i <= selectedUnit.endTrack; i++) {
            let trackNum = i < 10 ? '0' + i : i.toString();
            let opt = document.createElement('option');
            opt.value = `${GITHUB_BASE_URL}/${currentlyViewingLevel}/track_${trackNum}.mp3`;
            opt.innerText = `Track ${trackNum}`;
            trackSelect.appendChild(opt);
        }
        changeTrack(trackSelect.value);
    }

    function changeTrack(trackUrl) {
        const audioEl = document.getElementById('audioPlayer');
        document.getElementById('audioSource').src = trackUrl;
        audioEl.load();
    }

    function fetchGrammarData() {
        const unitIndex = parseInt(document.getElementById('unitSelect').value) + 1;
        const targetUnit = "unit_" + unitIndex;

        db.ref('grammar/' + currentlyViewingLevel + '/' + targetUnit).once('value').then(snap => {
            const data = snap.val();
            const examArea = document.getElementById('grammarExamples');
            examArea.innerHTML = "";

            if(data) {
                document.getElementById('gramTitle').innerText = data.title;
                document.getElementById('gramExplanation').innerText = data.explanation;

                const genExampleHTML = (en, vi) => {
                    if(!en) return "";
                    const cleanEn = en.replace(/'/g, "\\'"); 
                    return `
                    <div class="bg-indigo-50/50 p-4 rounded-xl border border-indigo-100 flex items-start gap-4 hover:bg-indigo-50 transition">
                        <button onclick="readGrammarAloud('${cleanEn}')" class="bg-indigo-500 hover:bg-indigo-400 text-white w-10 h-10 rounded-full flex items-center justify-center shrink-0 shadow-md transition transform active:scale-95 mt-1" title="Nghe câu này">
                            <i class="fa-solid fa-volume-high"></i>
                        </button>
                        <div>
                            <p class="font-black text-lg text-slate-800">${en}</p>
                            <p class="text-sm font-bold text-slate-500 italic mt-1">${vi}</p>
                        </div>
                    </div>`;
                };

                if(data.ex1_en) examArea.innerHTML += genExampleHTML(data.ex1_en, data.ex1_vi);
                if(data.ex2_en) examArea.innerHTML += genExampleHTML(data.ex2_en, data.ex2_vi);
            } else {
                document.getElementById('gramTitle').innerText = "Grammar Note";
                document.getElementById('gramExplanation').innerText = "Hiện tại chưa có ghi chú ngữ pháp cho Unit này. Vui lòng quay lại sau nhé!";
            }
        });
    }

    function readGrammarAloud(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        }
    }

    function completeLesson() {
        if (hasClaimed || !hasListenedAudio || !hasViewedGrammar) return;
        
        userCoins += 50;
        db.ref('users/' + currentUser.uid).update({ coins: userCoins }).then(() => {
            document.getElementById('displayCoins').innerText = userCoins;
            confetti({ particleCount: 100, spread: 70, origin: { y: 0.8 }, colors: ['#10b981', '#fbbf24'] });
            
            const btn = document.getElementById('btnComplete');
            btn.innerHTML = "<i class='fa-solid fa-check mr-1'></i> CLAIMED!";
            btn.classList.replace('bg-emerald-500', 'bg-slate-300');
            btn.classList.replace('hover:bg-emerald-400', 'hover:bg-slate-300');
            btn.classList.replace('text-white', 'text-slate-500');
            btn.classList.replace('shadow-[0_4px_0_#059669]', 'shadow-[0_4px_0_#cbd5e1]');
            btn.classList.remove('cursor-pointer');
            btn.classList.add('pointer-events-none');
            hasClaimed = true;
        });
    }
  </script>
</body>
</html>
