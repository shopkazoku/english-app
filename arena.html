<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Arena v3.2 - Round-Up AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900;1000&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    body { font-family: 'Nunito', sans-serif; background-color: #0f172a; overflow: hidden; }
    
    /* ANIMATION NÉM GẠCH & DÉP */
    @keyframes flyRight {
      0% { left: 25%; top: 40%; transform: rotate(0deg) scale(1); opacity: 1; }
      50% { top: 20%; transform: rotate(360deg) scale(1.5); }
      100% { left: 70%; top: 45%; transform: rotate(720deg) scale(1); opacity: 0; }
    }
    @keyframes flyLeft {
      0% { left: 70%; top: 40%; transform: rotate(0deg) scale(1); opacity: 1; }
      50% { top: 20%; transform: rotate(-360deg) scale(1.5); }
      100% { left: 25%; top: 45%; transform: rotate(-720deg) scale(1); opacity: 0; }
    }
    .throw-right { animation: flyRight 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; }
    .throw-left { animation: flyLeft 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; }

    /* ANIMATION BỊ THƯƠNG */
    .recoil { animation: recoilAnim 0.5s ease-out; }
    @keyframes recoilAnim { 
      0%, 100% { transform: translateX(0) rotate(0); }
      20% { transform: translateX(20px) rotate(15deg); }
      40% { transform: translateX(-15px) rotate(-10deg); }
      60% { transform: translateX(10px) rotate(5deg); }
    }
    .recoil-left { animation: recoilLeftAnim 0.5s ease-out; }
    @keyframes recoilLeftAnim { 
      0%, 100% { transform: translateX(0) rotate(0); }
      20% { transform: translateX(-20px) rotate(-15deg); }
      40% { transform: translateX(15px) rotate(10deg); }
      60% { transform: translateX(-10px) rotate(-5deg); }
    }
    
    .bruised { filter: drop-shadow(0 0 15px purple) sepia(0.6) hue-rotate(-30deg) saturate(1.5) contrast(1.2); }

    .surrender-flag { position: absolute; font-size: 5rem; top: -50px; right: -20px; animation: waveFlag 1s infinite alternate ease-in-out; z-index: 60; }
    @keyframes waveFlag { 0% { transform: rotate(-20deg); } 100% { transform: rotate(30deg); } }

    .damage-text { position: absolute; font-size: 4rem; font-weight: 900; color: #ef4444; text-shadow: 0 5px 0 #991b1b, 0 0 15px #fff; pointer-events: none; opacity: 0; z-index: 50; }
    .dmg-anim { animation: floatDmg 1s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    @keyframes floatDmg { 0% { opacity: 1; transform: translateY(0) scale(0.5) rotate(-10deg); } 20% { transform: translateY(-30px) scale(1.5) rotate(10deg); } 100% { opacity: 0; transform: translateY(-100px) scale(1) rotate(0); } }

    .timer-warning { animation: pulseRed 0.3s infinite alternate; }
    @keyframes pulseRed { from { background-color: #ef4444; box-shadow: 0 0 10px #ef4444; } to { background-color: #b91c1c; box-shadow: 0 0 30px #ef4444; } }
  </style>
</head>
<body class="h-screen w-full flex flex-col hidden bg-[url('https://www.transparenttextures.com/patterns/dark-matter.png')] bg-slate-900" id="mainBody">

  <!-- OVERLAY BẮT ĐẦU -->
  <div id="startOverlay" class="fixed inset-0 bg-black/90 z-[200] flex flex-col items-center justify-center">
    <h1 class="text-5xl sm:text-7xl font-black text-white mb-4 uppercase tracking-widest text-center">Are you ready?</h1>
    <p class="text-amber-400 font-bold mb-8 text-xl">Answer fast. Throw bricks. Survive.</p>
    <button onclick="startBattleEngine()" class="bg-rose-600 hover:bg-rose-500 text-white font-black text-3xl px-16 py-6 rounded-3xl shadow-[0_10px_0_#9f1239] active:shadow-[0_0px_0_#9f1239] active:translate-y-[10px] transition-all border-4 border-rose-300">
      FIGHT!
    </button>
  </div>

  <!-- BGM & SFX -->
  <audio id="bgmAudio" src="https://cdn.pixabay.com/download/audio/2022/01/18/audio_d0a13f69d2.mp3?filename=epic-battle-music-113645.mp3" loop></audio>
  <audio id="sfxThrow" src="https://assets.mixkit.co/active_storage/sfx/2679/2679-preview.mp3"></audio>
  <audio id="sfxHit" src="https://assets.mixkit.co/active_storage/sfx/2144/2144-preview.mp3"></audio>

  <!-- TOPBAR -->
  <header class="bg-slate-900/90 backdrop-blur-md border-b-2 border-slate-700 p-2 sm:p-3 flex justify-between items-center z-50 shrink-0">
    <div class="flex items-center space-x-3">
      <button onclick="window.location.href='dashboard.html'" class="w-10 h-10 bg-slate-800 hover:bg-slate-700 rounded-xl flex justify-center items-center text-slate-300 transition border border-slate-600 shadow-lg">
        <i class="fa-solid fa-arrow-left"></i>
      </button>
      <div>
        <h1 class="font-black text-xl text-white tracking-wide uppercase leading-tight">Street Fight</h1>
        <p class="text-[10px] font-bold text-rose-400 uppercase tracking-widest">Brick vs Sandal</p>
      </div>
    </div>
    
    <!-- Timer Bar (15s) -->
    <div class="flex-1 max-w-lg mx-4 sm:mx-8 hidden md:flex flex-col items-center">
      <div class="flex justify-between w-full text-white font-black text-xs mb-1 px-1">
        <span class="animate-pulse"><i class="fa-solid fa-clock text-amber-400 mr-1"></i> Time Left</span>
        <span id="timerText" class="text-sm text-amber-400">15s</span>
      </div>
      <div class="w-full bg-slate-800 h-4 rounded-full border border-slate-600 overflow-hidden shadow-inner">
        <div id="timerBar" class="bg-amber-400 h-full rounded-full transition-all duration-1000 ease-linear" style="width: 100%"></div>
      </div>
    </div>

    <div class="flex items-center bg-slate-800 px-4 py-1.5 rounded-full border border-slate-600 shadow-inner">
      <i class="fa-solid fa-coins text-amber-400 mr-2 text-lg"></i>
      <span id="displayCoins" class="font-black text-amber-500 text-xl">...</span>
    </div>
  </header>

  <!-- BATTLEFIELD -->
  <main class="flex-1 w-full relative flex flex-col justify-between pb-4 overflow-hidden">
    
    <!-- KHU VỰC CHIẾN ĐẤU (Tối ưu flex-1 để co giãn) -->
    <div class="flex-1 min-h-[30vh] flex items-center justify-between px-4 sm:px-20 lg:px-40 relative">
      
      <!-- PLAYER SIDE -->
      <div class="flex flex-col items-center z-10 w-1/3 relative">
        <div class="bg-slate-800/90 p-2 sm:p-3 rounded-xl border-2 border-slate-600 mb-2 sm:mb-4 w-full max-w-[200px] shadow-xl">
          <p class="text-white font-black text-center mb-1 sm:mb-2 text-sm sm:text-lg uppercase">YOU</p>
          <div class="w-full bg-slate-900 rounded-full h-3 sm:h-4 border border-slate-700 overflow-hidden">
            <div id="playerHpBar" class="bg-emerald-500 h-full rounded-full transition-all duration-300" style="width: 100%"></div>
          </div>
        </div>
        <div id="playerBox" class="w-28 h-28 sm:w-48 sm:h-48 lg:w-56 lg:h-56 flex items-center justify-center relative">
          <img id="playerImg" src="https://api.dicebear.com/7.x/avataaars/svg?seed=Student1&backgroundColor=transparent&mouth=default" class="w-[120%] h-[120%] object-contain drop-shadow-[0_10px_20px_rgba(0,0,0,0.5)] transition-all duration-300">
          <div id="playerDmg" class="damage-text top-10"></div>
          <div id="playerFlag" class="surrender-flag hidden">🏳️</div>
        </div>
      </div>

      <!-- TIMER CHO MOBILE -->
      <div class="absolute left-1/2 top-4 transform -translate-x-1/2 z-0 md:hidden flex flex-col items-center">
        <div class="w-16 h-16 rounded-full bg-slate-800 border-4 border-slate-600 flex items-center justify-center shadow-2xl">
          <span id="timerTextMobile" class="text-2xl font-black text-amber-400">15</span>
        </div>
      </div>

      <!-- COM SIDE -->
      <div class="flex flex-col items-center z-10 w-1/3 relative">
        <div class="bg-slate-800/90 p-2 sm:p-3 rounded-xl border-2 border-slate-600 mb-2 sm:mb-4 w-full max-w-[200px] shadow-xl">
          <p class="text-rose-400 font-black text-center mb-1 sm:mb-2 text-sm sm:text-lg uppercase" id="monsterName">COM</p>
          <div class="w-full bg-slate-900 rounded-full h-3 sm:h-4 border border-slate-700 overflow-hidden">
            <div id="monsterHpBar" class="bg-rose-500 h-full rounded-full transition-all duration-300 shadow-[0_0_15px_rgba(244,63,94,0.8)]" style="width: 100%"></div>
          </div>
        </div>
        <div id="monsterBox" class="w-28 h-28 sm:w-48 sm:h-48 lg:w-56 lg:h-56 flex items-center justify-center relative">
          <img id="monsterImg" src="https://api.dicebear.com/7.x/avataaars/svg?seed=BossDark&backgroundColor=transparent&skinColor=f87171&mouth=default&accessories=eyepatch" class="w-[120%] h-[120%] object-contain drop-shadow-[0_10px_20px_rgba(244,63,94,0.5)] transition-all duration-300 scale-x-[-1]">
          <div id="monsterDmg" class="damage-text top-10"></div>
          <div id="monsterFlag" class="surrender-flag hidden">🏳️</div>
        </div>
      </div>

    </div>

    <!-- BẢNG ĐIỀU KHIỂN & CÂU HỎI (Đã ép nhỏ lại để vừa màn hình) -->
    <div class="w-full max-w-4xl mx-auto px-4 relative z-20 shrink-0">
      <div class="bg-slate-800/95 backdrop-blur-md rounded-3xl border-4 border-slate-600 shadow-[0_-10px_40px_rgba(0,0,0,0.6)] p-4 sm:p-6 text-center">
        
        <div class="bg-slate-900 rounded-xl p-3 sm:p-4 mb-3 sm:mb-4 border border-slate-700 shadow-inner">
          <h2 id="questionText" class="text-lg sm:text-2xl font-black text-white leading-tight">Question will appear here...</h2>
        </div>

        <div id="answersGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-2 sm:gap-4">
          <!-- Các nút đáp án sẽ được sinh ở đây -->
        </div>
      </div>
    </div>
  </main>

  <!-- KẾT QUẢ TRẬN ĐẤU -->
  <div id="resultModal" class="fixed inset-0 bg-slate-900/95 z-[300] hidden flex-col items-center justify-center backdrop-blur-sm">
    <div id="resultIcon" class="text-[100px] sm:text-[140px] mb-4 drop-shadow-2xl animate-bounce">👑</div>
    <h1 id="resultTitle" class="text-5xl sm:text-7xl font-black text-white uppercase tracking-widest mb-6 text-transparent bg-clip-text bg-gradient-to-r from-amber-300 to-amber-500 text-center">YOU WIN</h1>
    
    <div id="rewardBox" class="bg-slate-800 border-2 border-amber-400/50 p-5 rounded-2xl mb-6 flex items-center space-x-4 shadow-[0_0_30px_rgba(251,191,36,0.3)]">
      <div class="text-4xl">💰</div>
      <div class="text-left">
        <p class="text-xs font-bold text-amber-200 uppercase tracking-wider">Loot Earned</p>
        <p class="text-3xl font-black text-amber-400">+100 Coins</p>
      </div>
    </div>

    <button onclick="window.location.href='dashboard.html'" class="bg-indigo-600 hover:bg-indigo-500 text-white font-black text-xl px-10 py-4 rounded-2xl shadow-[0_6px_0_#4f46e5] active:shadow-[0_0px_0_#4f46e5] active:translate-y-[6px] transition-all border-2 border-indigo-400">
      RETURN TO BASE
    </button>
  </div>

  <script>
    const arenaQuestions = [
      { q: "What is the opposite of 'Hot'?", options: ["Cold", "Warm", "Boiling", "Sun"], answer: "Cold" },
      { q: "Which animal says 'Meow'?", options: ["Dog", "Cat", "Bird", "Cow"], answer: "Cat" },
      { q: "10 + 5 = ?", options: ["12", "15", "18", "20"], answer: "15" },
      { q: "Choose the correct spelling:", options: ["Apple", "Aple", "Appel", "Aplle"], answer: "Apple" }
    ];

    // ==========================================
    // BOSS DÁN ĐOẠN FIREBASE CONFIG VÀO ĐÂY
    // ==========================================
    const firebaseConfig = {
  apiKey: "AIzaSyD8EXAmo1IlRCnQ_EFXorlKDrtrJmx8J1M",
  authDomain: "roundup-ai-academy.firebaseapp.com",
  projectId: "roundup-ai-academy",
  storageBucket: "roundup-ai-academy.firebasestorage.app",
  messagingSenderId: "723976989630",
  appId: "1:723976989630:web:45f3de91269e70f604e7ef"
};

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    let currentUser = null;
    let userCoins = 0;
    
    const MAX_HP = 100;
    let playerHp = MAX_HP;
    let monsterHp = MAX_HP;
    let currentQIndex = 0;
    let isLocked = false;
    let currentQuestions = [];
    let timeLeft = 15;
    let timerInterval;

    auth.onAuthStateChanged((user) => {
      if (user) {
        currentUser = user;
        document.getElementById('mainBody').classList.remove('hidden');
        db.ref('users/' + user.uid).once('value').then((snapshot) => {
          const data = snapshot.val();
          if (data) {
            userCoins = data.coins || 0;
            document.getElementById('displayCoins').innerText = userCoins;
          }
        });
      } else { window.location.href = "login.html"; }
    });

    function startBattleEngine() {
      document.getElementById('startOverlay').style.display = 'none';
      const bgm = document.getElementById('bgmAudio');
      bgm.volume = 0.4; 
      bgm.play().catch(e => console.log("Trình duyệt chặn Audio"));
      
      currentQuestions = [...arenaQuestions].sort(() => 0.5 - Math.random()).slice(0, 4);
      updateHpBars();
      loadQuestion();
    }

    function startTimer() {
      clearInterval(timerInterval);
      timeLeft = 15;
      updateTimerUI();
      
      timerInterval = setInterval(() => {
        timeLeft--;
        updateTimerUI();
        if(timeLeft <= 0) {
          clearInterval(timerInterval);
          handleCombat(false, null, true); 
        }
      }, 1000);
    }

    function updateTimerUI() {
      document.getElementById('timerText').innerText = `${timeLeft}s`;
      document.getElementById('timerTextMobile').innerText = timeLeft;
      const bar = document.getElementById('timerBar');
      bar.style.width = `${(timeLeft / 15) * 100}%`;
      
      if(timeLeft <= 5) {
        bar.classList.add('timer-warning');
        document.getElementById('timerTextMobile').classList.add('text-rose-500');
        document.getElementById('timerText').classList.add('text-rose-500');
      } else {
        bar.classList.remove('timer-warning');
        document.getElementById('timerTextMobile').classList.remove('text-rose-500');
        document.getElementById('timerText').classList.remove('text-rose-500');
      }
    }

    function loadQuestion() {
      if (currentQIndex >= currentQuestions.length || monsterHp <= 0 || playerHp <= 0) return;

      isLocked = false;
      const qData = currentQuestions[currentQIndex];
      document.getElementById('questionText').innerText = qData.q;
      
      const grid = document.getElementById('answersGrid');
      grid.innerHTML = "";
      const shuffledOptions = [...qData.options].sort(() => Math.random() - 0.5);

      shuffledOptions.forEach(opt => {
        const btn = document.createElement('button');
        // ÉP NHỎ KÍCH THƯỚC NÚT ĐỂ VỪA MÀN HÌNH (py-3 sm:py-4)
        btn.className = "w-full py-3 sm:py-4 px-4 bg-slate-700 hover:bg-slate-600 rounded-xl border-b-[6px] border-slate-900 text-lg sm:text-xl font-black text-white active:border-b-0 active:translate-y-1.5 transition-all outline-none";
        btn.innerText = opt;
        btn.onclick = () => {
          clearInterval(timerInterval); 
          if (opt === qData.answer) handleCombat(true, btn, false);
          else handleCombat(false, btn, false);
        };
        grid.appendChild(btn);
      });

      startTimer();
    }

    function throwProjectile(isPlayer) {
      document.getElementById('sfxThrow').play();
      const item = document.createElement('div');
      item.innerText = isPlayer ? '🧱' : '🩴'; 
      item.className = `absolute text-5xl sm:text-6xl z-[100] drop-shadow-2xl ${isPlayer ? 'throw-right' : 'throw-left'}`;
      document.body.appendChild(item);
      setTimeout(() => item.remove(), 500);
    }

    function handleCombat(isCorrect, btnEl, isTimeout = false) {
      if (isLocked) return;
      isLocked = true;

      const pBox = document.getElementById('playerBox');
      const mBox = document.getElementById('monsterBox');
      const pImg = document.getElementById('playerImg');
      const mImg = document.getElementById('monsterImg');

      if (isCorrect) {
        if(btnEl) { btnEl.style.background = "#10b981"; btnEl.style.borderColor = "#047857"; }
        
        pImg.src = pImg.src.replace('mouth=default', 'mouth=smile').replace('mouth=scream', 'mouth=smile');
        throwProjectile(true); 
        
        setTimeout(() => {
          document.getElementById('sfxHit').play();
          
          mBox.classList.add('recoil');
          mImg.src = mImg.src.replace('mouth=default', 'mouth=scream').replace('mouth=smile', 'mouth=scream');
          
          showDamage('monsterDmg', "-35");
          monsterHp -= 35;
          updateHpBars();
          checkBatteredState(); 
          
          setTimeout(() => {
            mBox.classList.remove('recoil');
            resetEmotions();
            checkEndGame();
          }, 500);
        }, 500); 

      } else {
        if(btnEl) { btnEl.style.background = "#f43f5e"; btnEl.style.borderColor = "#be123c"; }
        if(isTimeout) { document.getElementById('questionText').innerText = "TIME OUT!"; }
        
        mImg.src = mImg.src.replace('mouth=default', 'mouth=smile').replace('mouth=scream', 'mouth=smile');
        throwProjectile(false); 
        
        setTimeout(() => {
          document.getElementById('sfxHit').play();
          
          pBox.classList.add('recoil-left');
          pImg.src = pImg.src.replace('mouth=default', 'mouth=scream').replace('mouth=smile', 'mouth=scream');
          
          showDamage('playerDmg', "-30");
          playerHp -= 30;
          updateHpBars();
          checkBatteredState();
          
          document.getElementById('mainBody').style.boxShadow = "inset 0 0 100px rgba(244,63,94,0.6)";
          
          setTimeout(() => {
            pBox.classList.remove('recoil-left');
            document.getElementById('mainBody').style.boxShadow = "none";
            resetEmotions();
            checkEndGame();
          }, 500);
        }, 500); 
      }
    }

    function checkBatteredState() {
      if(playerHp <= 50) document.getElementById('playerImg').classList.add('bruised');
      if(monsterHp <= 50) document.getElementById('monsterImg').classList.add('bruised');
    }

    function resetEmotions() {
      if (playerHp > 0) document.getElementById('playerImg').src = document.getElementById('playerImg').src.replace('mouth=smile', 'mouth=default').replace('mouth=scream', 'mouth=default');
      if (monsterHp > 0) document.getElementById('monsterImg').src = document.getElementById('monsterImg').src.replace('mouth=smile', 'mouth=default').replace('mouth=scream', 'mouth=default');
    }

    function showDamage(elementId, text) {
      const el = document.getElementById(elementId);
      el.innerText = text;
      el.classList.remove('dmg-anim');
      void el.offsetWidth; 
      el.classList.add('dmg-anim');
    }

    function updateHpBars() {
      if(playerHp < 0) playerHp = 0;
      if(monsterHp < 0) monsterHp = 0;
      document.getElementById('playerHpBar').style.width = `${playerHp}%`;
      document.getElementById('monsterHpBar').style.width = `${monsterHp}%`;
      if(playerHp <= 30) document.getElementById('playerHpBar').classList.replace('bg-emerald-500', 'bg-rose-600');
    }

    function checkEndGame() {
      if (monsterHp <= 0 || playerHp <= 0 || currentQIndex >= currentQuestions.length - 1) {
        clearInterval(timerInterval);
        document.getElementById('bgmAudio').pause();
        
        if (monsterHp <= 0) {
            document.getElementById('monsterFlag').classList.remove('hidden');
            document.getElementById('monsterImg').src = document.getElementById('monsterImg').src.replace('mouth=default', 'mouth=scream');
        } else if (playerHp <= 0) {
            document.getElementById('playerFlag').classList.remove('hidden');
            document.getElementById('playerImg').src = document.getElementById('playerImg').src.replace('mouth=default', 'mouth=scream');
        }

        setTimeout(() => {
            const modal = document.getElementById('resultModal');
            const icon = document.getElementById('resultIcon');
            const title = document.getElementById('resultTitle');
            const rewardBox = document.getElementById('rewardBox');

            if (monsterHp <= 0 || playerHp > monsterHp) {
                icon.innerHTML = '👑';
                icon.classList.add('animate-bounce');
                icon.classList.remove('animate-pulse');
                title.innerText = 'YOU WIN';
                title.className = "text-5xl sm:text-7xl font-black uppercase tracking-widest mb-6 text-transparent bg-clip-text bg-gradient-to-r from-amber-300 to-amber-500 text-center";
                rewardBox.classList.remove('hidden');
                
                const end = Date.now() + 3000;
                (function frame() {
                  confetti({ particleCount: 6, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#fbbf24', '#f59e0b', '#d97706'] });
                  confetti({ particleCount: 6, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#fbbf24', '#f59e0b', '#d97706'] });
                  if (Date.now() < end) requestAnimationFrame(frame);
                }());

                db.ref('users/' + currentUser.uid).update({ coins: userCoins + 100 });
            } else {
                icon.innerHTML = '💔';
                icon.classList.remove('animate-bounce');
                icon.classList.add('animate-pulse');
                title.innerText = 'YOU LOSE';
                title.className = "text-5xl sm:text-7xl font-black uppercase tracking-widest mb-6 text-rose-500 text-center";
                rewardBox.classList.add('hidden');
            }

            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }, 1500); 
      } else {
        currentQIndex++;
        loadQuestion();
      }
    }
  </script>
</body>
</html>
