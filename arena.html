<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Arena - Study Daily</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    body { font-family: 'Nunito', sans-serif; background: #f8fafc; overflow: hidden; }
    .custom-scroll::-webkit-scrollbar { width: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 8px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
    .keyboard-key { transition: all 0.1s; }
    .keyboard-key:active { transform: scale(0.95); }
    .keyboard-key:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  </style>
</head>
<body class="h-[100dvh] w-full flex flex-col bg-[url('https://www.transparenttextures.com/patterns/diagmonds-light.png')] relative overflow-hidden" id="mainBody">

  <!-- HEADER -->
  <header class="bg-white border-b-2 border-indigo-100 p-3 sm:p-4 flex justify-between items-center shadow-sm z-50 shrink-0">
    <div class="flex items-center space-x-3">
      <button onclick="window.location.href='dashboard.html'" class="w-10 h-10 bg-slate-100 hover:bg-slate-200 rounded-xl flex items-center justify-center text-slate-600 transition shadow-sm border border-slate-200" title="Back to Dashboard">
          <i class="fa-solid fa-arrow-left"></i>
      </button>
      <div class="flex flex-col">
        <h1 class="font-black text-lg sm:text-xl text-indigo-900 leading-tight">Game Arena</h1>
        <span class="mt-0.5 text-amber-500 font-bold text-[10px] sm:text-xs uppercase"><i class="fa-solid fa-gamepad mr-1"></i> Play & Learn</span>
      </div>
    </div>
    <div class="flex items-center bg-amber-50 px-4 py-2 rounded-xl border border-amber-200 shadow-sm relative overflow-hidden group cursor-pointer" onclick="alert('Hãy làm bài tập để kiếm thêm Vàng nhé!')">
        <div class="absolute inset-0 bg-amber-200 opacity-0 group-hover:opacity-20 transition"></div>
        <i class="fa-solid fa-coins text-amber-500 mr-2 text-lg fa-spin-hover"></i>
        <span id="displayCoins" class="font-black text-amber-700 text-lg transition-all duration-300">...</span>
    </div>
  </header>

  <!-- LOADING OVERLAY -->
  <div id="loadingOverlay" class="absolute inset-0 z-[100] flex flex-col items-center justify-center bg-white transition-opacity duration-500">
      <i class="fa-solid fa-ghost fa-bounce text-5xl text-violet-500 mb-4"></i>
      <p class="font-black text-slate-500 animate-pulse text-sm">Loading Arena...</p>
  </div>

  <main class="flex-1 w-full max-w-5xl mx-auto p-4 sm:p-8 overflow-y-auto custom-scroll opacity-0 transition-opacity duration-500" id="mainContent">
      <div class="text-center mb-10">
          <h2 class="text-3xl sm:text-4xl font-black text-slate-800 tracking-tight">Choose Your Challenge</h2>
          <p class="text-slate-500 font-bold mt-2">Spend your coins to play and master vocabulary!</p>
      </div>

      <!-- DANH SÁCH GAME TRONG ARENA -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
          
          <!-- THẺ GAME: HANGMAN -->
          <div class="bg-white rounded-3xl p-6 shadow-lg border-2 border-slate-100 hover:border-violet-300 hover:shadow-xl transition transform hover:-translate-y-1 relative overflow-hidden">
              <div class="absolute -right-4 -top-4 w-24 h-24 bg-violet-100 rounded-full z-0 opacity-50"></div>
              <div class="relative z-10 flex flex-col h-full">
                  <div class="w-16 h-16 bg-violet-100 text-violet-600 rounded-2xl flex items-center justify-center text-3xl mb-4 shadow-sm border border-violet-200">
                      <i class="fa-solid fa-user-secret"></i>
                  </div>
                  <h3 class="text-2xl font-black text-slate-800 mb-2">Hangman</h3>
                  <p class="text-slate-500 font-medium mb-6 flex-1 text-sm">Save the character by guessing the correct word letter by letter!</p>
                  
                  <div class="flex items-center justify-between mt-auto">
                      <span class="bg-amber-100 text-amber-700 font-black px-3 py-1.5 rounded-lg text-sm border border-amber-200">
                          <i class="fa-solid fa-coins mr-1"></i><span id="hangmanCost">--</span>
                      </span>
                      <button onclick="requestPlayGame('hangman')" class="bg-violet-600 hover:bg-violet-700 text-white font-black px-6 py-2 rounded-xl shadow-md transition">PLAY</button>
                  </div>
              </div>
          </div>

          <!-- THẺ GAME SẮP RA MẮT (MEMORY) -->
          <div class="bg-slate-50 rounded-3xl p-6 border-2 border-dashed border-slate-200 relative overflow-hidden opacity-70">
              <div class="relative z-10 flex flex-col h-full items-center justify-center text-center">
                  <div class="w-16 h-16 bg-slate-200 text-slate-400 rounded-2xl flex items-center justify-center text-3xl mb-4">
                      <i class="fa-solid fa-clone"></i>
                  </div>
                  <h3 class="text-xl font-black text-slate-600 mb-2">Memory Match</h3>
                  <span class="bg-slate-200 text-slate-500 font-black px-3 py-1 rounded-lg text-xs uppercase tracking-wider">Coming Soon</span>
              </div>
          </div>
          
      </div>
  </main>

  <!-- ============================================== -->
  <!-- MODAL GIAO DIỆN GAME HANGMAN -->
  <!-- ============================================== -->
  <div id="gameModal" class="fixed inset-0 z-[9999] bg-slate-900/80 backdrop-blur-sm hidden flex-col items-center justify-center p-4">
      <div class="bg-white rounded-3xl shadow-2xl w-full max-w-3xl overflow-hidden transform transition-all scale-100 flex flex-col max-h-[90vh]">
          <!-- Header Game -->
          <div class="bg-violet-600 p-4 flex justify-between items-center text-white shrink-0">
              <h3 class="font-black text-xl flex items-center"><i class="fa-solid fa-user-secret mr-2"></i> Hangman Rescue</h3>
              <button onclick="closeGameModal()" class="w-8 h-8 flex items-center justify-center bg-violet-700 rounded-full hover:bg-rose-500 transition"><i class="fa-solid fa-xmark"></i></button>
          </div>
          
          <!-- Khu vực chơi -->
          <div class="p-6 flex-1 overflow-y-auto custom-scroll flex flex-col items-center">
              
              <!-- Khu vực vẽ người treo cổ (Dùng icon/emoji hoặc text cho nhẹ) -->
              <div class="w-full flex justify-center mb-6">
                  <div class="w-40 h-40 bg-slate-50 border-4 border-slate-200 rounded-2xl flex items-center justify-center text-5xl relative">
                      <!-- Khung treo -->
                      <div class="absolute left-6 bottom-4 w-24 h-2 bg-slate-400 rounded"></div>
                      <div class="absolute left-10 bottom-4 w-2 h-28 bg-slate-400 rounded"></div>
                      <div class="absolute left-10 top-4 w-16 h-2 bg-slate-400 rounded"></div>
                      <div class="absolute left-24 top-4 w-2 h-6 bg-rose-400 rounded"></div>
                      
                      <!-- Các bộ phận cơ thể sẽ hiện ra dựa vào số lỗi -->
                      <div id="hm-head" class="absolute left-21 top-10 text-3xl hidden">😟</div>
                      <div id="hm-body" class="absolute left-24 top-16 w-1 h-8 bg-slate-800 hidden"></div>
                      <div id="hm-arm-l" class="absolute left-20 top-18 w-5 h-1 bg-slate-800 -rotate-45 hidden"></div>
                      <div id="hm-arm-r" class="absolute left-24 top-18 w-5 h-1 bg-slate-800 rotate-45 hidden"></div>
                      <div id="hm-leg-l" class="absolute left-21 top-24 w-1 h-6 bg-slate-800 rotate-12 hidden"></div>
                      <div id="hm-leg-r" class="absolute left-25 top-24 w-1 h-6 bg-slate-800 -rotate-12 hidden"></div>
                  </div>
              </div>

              <!-- Trạng thái mạng sống -->
              <div class="mb-8 font-black text-rose-500 tracking-wider">
                  MISTAKES: <span id="mistakesCount">0</span> / 6
              </div>

              <!-- Hiển thị Từ vựng (Các ô gạch ngang) -->
              <div id="wordDisplay" class="flex flex-wrap justify-center gap-2 mb-10 min-h-[50px]">
                  <!-- JS tạo các ô chữ vào đây -->
              </div>

              <!-- Bàn phím ảo A-Z -->
              <div id="keyboard" class="flex flex-wrap justify-center gap-2 max-w-xl w-full">
                  <!-- JS tạo bàn phím vào đây -->
              </div>

              <!-- Khu vực kết quả (Thắng/Thua) -->
              <div id="gameResult" class="hidden flex-col items-center mt-6 w-full animate-bounce">
                  <h4 id="resultMessage" class="text-3xl font-black mb-4"></h4>
                  <p id="correctWordWas" class="text-slate-500 font-bold mb-6 hidden">The word was: <span id="theWord" class="text-violet-600 font-black"></span></p>
                  <button onclick="closeGameModal()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-black px-8 py-3 rounded-xl transition">Back to Arena</button>
              </div>

          </div>
      </div>
  </div>

  <script>
    // ==========================================
    // CẤU HÌNH HỆ THỐNG VÀ FIREBASE
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyD8EXAmo1IlRCnQ_EFXorlKDrtrJmx8J1M",
      authDomain: "roundup-ai-academy.firebaseapp.com",
      projectId: "roundup-ai-academy",
      storageBucket: "roundup-ai-academy.firebasestorage.app",
      messagingSenderId: "723976989630",
      appId: "1:723976989630:web:45f3de91269e70f604e7ef"
    };
    
    const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbwtm-mJCRvAiXcbLI_dWEnzDGbqw1sWeBQqISC614dsvuiGkzyx6j-z5RS6jNx0xaX27w/exec";

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth(); 
    const db = firebase.database();
    
    let currentUser = null;
    let currentCoins = 0;
    let arenaData = null; // Chứa data Game từ Sheet

    // Các biến cho Game Hangman
    let hm_currentWord = "";
    let hm_guessedLetters = [];
    let hm_mistakes = 0;
    const hm_maxMistakes = 6;

    // ==========================================
    // KHỞI ĐỘNG HỆ THỐNG
    // ==========================================
    auth.onAuthStateChanged((user) => {
      if (user) {
        currentUser = user;
        db.ref('users/' + user.uid).on('value', async (snapshot) => {
            let data = snapshot.val() || { coins: 0 };
            updateCoinDisplay(data.coins);
            
            // Chỉ gọi API Sheet 1 lần khi load trang
            if (!arenaData) {
                await loadArenaData();
                setTimeout(() => { 
                    document.getElementById('loadingOverlay').style.display = 'none'; 
                    document.getElementById('mainContent').style.opacity = '1'; 
                }, 500);
            }
        });
      } else { window.location.href = "index.html"; }
    });

    function updateCoinDisplay(newCoins) {
        currentCoins = newCoins;
        const coinEl = document.getElementById('displayCoins');
        coinEl.innerText = newCoins;
        coinEl.classList.add('scale-125', 'text-rose-500');
        setTimeout(() => coinEl.classList.remove('scale-125', 'text-rose-500'), 300);
    }

    async function loadArenaData() {
        try {
            let res = await fetch(SHEET_API_URL);
            let masterData = await res.json();
            
            if (masterData && masterData.game) {
                arenaData = masterData.game;
                
                // Cập nhật giá tiền lên các thẻ Game
                if (arenaData['hangman']) {
                    document.getElementById('hangmanCost').innerText = arenaData['hangman'].cost;
                }
            }
        } catch (e) { console.error("Lỗi tải Arena:", e); }
    }

    // ==========================================
    // LOGIC TRỪ TIỀN (VÉ VÀO CỬA)
    // ==========================================
    function requestPlayGame(gameType) {
        if (!arenaData || !arenaData[gameType]) {
            alert("Dữ liệu game chưa sẵn sàng hoặc Boss chưa nhập data vào Cột C của Google Sheet!");
            return;
        }

        let cost = parseInt(arenaData[gameType].cost) || 0;
        let dataString = arenaData[gameType].gameData;

        if (!dataString) {
            alert("Chưa có từ vựng nào trong kho dữ liệu Google Sheet!");
            return;
        }

        // KIỂM TRA VÍ TIỀN
        if (currentCoins < cost) {
            alert(`Ối! Bạn cần ${cost} Xu để chơi trò này. Hãy vào Smart Exercise cày thêm bài tập nhé!`);
            return;
        }

        // ĐỦ TIỀN -> TRỪ XU BẰNG FIREBASE VÀ MỞ GAME
        let newBalance = currentCoins - cost;
        db.ref('users/' + currentUser.uid).update({ coins: newBalance })
          .then(() => {
              // Bắt đầu game tương ứng
              if (gameType === 'hangman') {
                  startHangman(dataString);
              }
          })
          .catch(e => { alert("Lỗi kết nối ví. Vui lòng thử lại!"); });
    }

    // ==========================================
    // LOGIC GAME HANGMAN (NGƯỜI TREO CỔ)
    // ==========================================
    function startHangman(dataString) {
        // Tách chuỗi từ vựng thành mảng (loại bỏ khoảng trắng)
        let wordsArray = dataString.split(',').map(w => w.trim().toUpperCase()).filter(w => w.length > 0);
        
        // Random 1 từ vựng
        hm_currentWord = wordsArray[Math.floor(Math.random() * wordsArray.length)];
        hm_guessedLetters = [];
        hm_mistakes = 0;

        // Reset Giao diện
        document.getElementById('mistakesCount').innerText = hm_mistakes;
        document.getElementById('gameResult').classList.add('hidden');
        document.getElementById('keyboard').classList.remove('hidden');
        document.getElementById('correctWordWas').classList.add('hidden');
        
        // Ẩn tất cả các bộ phận của hình nộm
        ['head', 'body', 'arm-l', 'arm-r', 'leg-l', 'leg-r'].forEach(part => {
            document.getElementById(`hm-${part}`).classList.add('hidden');
        });

        drawWord();
        drawKeyboard();
        
        // Mở Modal
        document.getElementById('gameModal').classList.remove('hidden');
        document.getElementById('gameModal').classList.add('flex');
    }

    function drawWord() {
        const wordContainer = document.getElementById('wordDisplay');
        wordContainer.innerHTML = '';
        
        for (let char of hm_currentWord) {
            if (char === ' ') {
                wordContainer.innerHTML += `<div class="w-8"></div>`; // Khoảng trắng giữa các từ (nếu có)
            } else {
                let isGuessed = hm_guessedLetters.includes(char);
                let text = isGuessed ? char : '';
                let border = isGuessed ? 'border-violet-500 bg-violet-50 text-violet-700' : 'border-slate-300 bg-white text-transparent';
                
                wordContainer.innerHTML += `<div class="w-10 h-12 flex items-center justify-center text-2xl font-black border-b-4 ${border} rounded-t-sm shadow-sm">${text}</div>`;
            }
        }
    }

    function drawKeyboard() {
        const keyboard = document.getElementById('keyboard');
        keyboard.innerHTML = '';
        const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
        
        alphabet.forEach(letter => {
            let isGuessed = hm_guessedLetters.includes(letter);
            keyboard.innerHTML += `
                <button onclick="handleGuess('${letter}')" id="key-${letter}" 
                        class="keyboard-key w-10 h-12 font-black text-lg rounded-lg shadow-sm border-b-4 
                        ${isGuessed ? 'bg-slate-200 text-slate-400 border-slate-300' : 'bg-white text-slate-700 border-slate-200 hover:bg-violet-100 hover:text-violet-700 hover:border-violet-300'}" 
                        ${isGuessed ? 'disabled' : ''}>
                    ${letter}
                </button>
            `;
        });
    }

    function handleGuess(letter) {
        if (hm_guessedLetters.includes(letter) || hm_mistakes >= hm_maxMistakes) return;
        
        hm_guessedLetters.push(letter);
        
        // Vô hiệu hóa nút vừa bấm
        let keyBtn = document.getElementById(`key-${letter}`);
        if(keyBtn) {
            keyBtn.disabled = true;
            keyBtn.className = "keyboard-key w-10 h-12 font-black text-lg rounded-lg shadow-sm border-b-4 bg-slate-200 text-slate-400 border-slate-300";
        }

        if (hm_currentWord.includes(letter)) {
            // Đoán đúng
            drawWord();
            checkWin();
        } else {
            // Đoán sai
            hm_mistakes++;
            document.getElementById('mistakesCount').innerText = hm_mistakes;
            updateHangmanDrawing();
            checkLoss();
        }
    }

    function updateHangmanDrawing() {
        const parts = ['head', 'body', 'arm-l', 'arm-r', 'leg-l', 'leg-r'];
        if (hm_mistakes > 0 && hm_mistakes <= parts.length) {
            document.getElementById(`hm-${parts[hm_mistakes - 1]}`).classList.remove('hidden');
        }
    }

    function checkWin() {
        // Kiểm tra xem tất cả các chữ cái trong từ (không tính khoảng trắng) đã được đoán chưa
        let charsToGuess = hm_currentWord.split('').filter(c => c !== ' ');
        let isWin = charsToGuess.every(c => hm_guessedLetters.includes(c));
        
        if (isWin) {
            endGame(true);
        }
    }

    function checkLoss() {
        if (hm_mistakes >= hm_maxMistakes) {
            endGame(false);
        }
    }

    function endGame(isWin) {
        document.getElementById('keyboard').classList.add('hidden');
        document.getElementById('gameResult').classList.remove('hidden');
        
        if (isWin) {
            document.getElementById('resultMessage').innerText = "YOU SAVED HIM!";
            document.getElementById('resultMessage').className = "text-4xl font-black mb-4 text-emerald-500";
            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
        } else {
            document.getElementById('resultMessage').innerText = "GAME OVER!";
            document.getElementById('resultMessage').className = "text-4xl font-black mb-4 text-rose-500";
            
            document.getElementById('theWord').innerText = hm_currentWord;
            document.getElementById('correctWordWas').classList.remove('hidden');
        }
    }

    function closeGameModal() {
        document.getElementById('gameModal').classList.add('hidden');
        document.getElementById('gameModal').classList.remove('flex');
    }
  </script>
</body>
</html>
