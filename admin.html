<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACP - Round-Up AI V4.1</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    body { font-family: 'Nunito', sans-serif; background: #0f172a; color: #f1f5f9; }
    .custom-scroll::-webkit-scrollbar { width: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: #1e293b; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #475569; border-radius: 8px; }
    .tab-btn.active { background-color: #6366f1; color: white; border-color: #818cf8; }
    .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
  </style>
</head>
<body class="h-screen w-full flex flex-col relative overflow-hidden">

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="fixed top-5 right-5 transform translate-x-[150%] transition-transform duration-300 z-[999] px-6 py-4 rounded-xl shadow-2xl flex items-center gap-4 border-2">
      <i id="toastIcon" class="fa-solid text-3xl"></i>
      <div>
          <h4 class="font-black text-lg" id="toastTitle">Notification</h4>
          <p class="text-sm font-bold opacity-90" id="toastMsg">Message here</p>
      </div>
  </div>

  <!-- SECURITY GATEWAY -->
  <div id="securityGate" class="fixed inset-0 z-[200] bg-slate-900 flex flex-col items-center justify-center p-4 transition-all duration-300">
      <div class="glass-panel rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl border-t-4 border-t-indigo-500">
          <i class="fa-solid fa-shield-halved text-6xl text-indigo-500 mb-6 drop-shadow-[0_0_15px_rgba(99,102,241,0.5)]"></i>
          <h2 class="font-black text-2xl text-white mb-2">Restricted Area</h2>
          <input type="password" id="pinInput" placeholder="Enter 6-digit PIN" class="w-full bg-slate-800 border-2 border-slate-600 text-center text-white font-black text-2xl tracking-[0.5em] px-4 py-3 rounded-xl focus:outline-none focus:border-indigo-500 mb-4 mt-6 transition-all">
          <button onclick="verifyPin()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-black text-lg py-3 rounded-xl shadow-[0_4px_0_#4f46e5] transition-all uppercase tracking-widest active:translate-y-[4px] active:shadow-[0_0px_0_#4f46e5]">Access ACP</button>
      </div>
  </div>

  <!-- MAIN ADMIN PANEL -->
  <div id="adminPanel" class="hidden h-full flex-col opacity-0 transition-opacity duration-500">
      <header class="glass-panel p-4 flex justify-between items-center shadow-md z-50 shrink-0">
          <div class="flex items-center space-x-3">
              <i class="fa-solid fa-server text-indigo-400 text-2xl"></i>
              <div>
                  <h1 class="font-black text-xl text-white tracking-widest uppercase">Round-Up AI</h1>
                  <p class="text-[10px] font-bold text-emerald-400 uppercase tracking-widest">Admin Control Panel v4.1</p>
              </div>
          </div>
          <button onclick="window.location.reload()" class="bg-rose-500/20 text-rose-400 border border-rose-500 hover:bg-rose-500 hover:text-white font-bold px-4 py-2 rounded-lg transition text-xs uppercase tracking-wider">
              Lock System
          </button>
      </header>

      <main class="flex-1 overflow-hidden flex flex-col md:flex-row p-4 gap-4">
          <!-- SIDEBAR -->
          <aside class="w-full md:w-64 glass-panel rounded-2xl p-4 shrink-0 flex flex-col gap-2">
              <p class="text-xs font-black text-slate-400 uppercase tracking-widest mb-2 pl-2">System Modules</p>
              <button onclick="switchTab('examTab')" id="btn_examTab" class="tab-btn w-full text-left font-bold px-4 py-3 rounded-xl border border-transparent text-slate-400 hover:bg-slate-800 transition-all flex items-center">
                  <i class="fa-solid fa-file-signature w-6 text-center mr-2"></i> Exam Manager
              </button>
              <button onclick="switchTab('readingTab')" id="btn_readingTab" class="tab-btn active bg-indigo-600 text-white w-full text-left font-bold px-4 py-3 rounded-xl border border-indigo-400 transition-all flex items-center">
                  <i class="fa-solid fa-book-open-reader w-6 text-center mr-2"></i> Reading Manager
              </button>
              <button onclick="switchTab('auditTab'); runSystemAudit();" id="btn_auditTab" class="tab-btn w-full text-left font-bold px-4 py-3 rounded-xl border border-transparent text-slate-400 hover:bg-slate-800 transition-all flex items-center mt-4 bg-slate-800/50">
                  <i class="fa-solid fa-radar-border w-6 text-center mr-2 text-amber-400"></i> Content Audit
              </button>
          </aside>

          <!-- MODULES -->
          <section class="flex-1 glass-panel rounded-2xl p-6 overflow-y-auto custom-scroll relative">
              
              <!-- 1. EXAM MANAGER (Giữ nguyên logic cũ) -->
              <div id="examTab" class="tab-content hidden">
                  <h2 class="font-black text-2xl text-white mb-2">Exam / Assessment Data</h2>
                  <div class="flex gap-2 mb-6">
                      <input type="text" id="examId" placeholder="e.g., level_6_unit_1" class="flex-1 bg-slate-800 border border-slate-600 text-white font-bold px-4 py-3 rounded-xl focus:outline-none focus:border-indigo-500">
                      <button onclick="loadExamQuestions()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-black px-6 py-3 rounded-xl transition-all">LOAD</button>
                  </div>
                  <!-- Khu vực nhập câu hỏi bị làm gọn để tập trung vào Reading & Audit -->
                  <div class="bg-slate-800/50 border border-slate-700 rounded-xl p-4 mb-4">
                      <p class="text-slate-400 italic text-sm">Giao diện quản lý Exam tương tự bản V3.0...</p>
                  </div>
              </div>

              <!-- 2. READING MANAGER -->
              <div id="readingTab" class="tab-content block">
                  <h2 class="font-black text-2xl text-white mb-2">Reading Curriculum Manager</h2>
                  
                  <div class="flex flex-col sm:flex-row gap-4 mb-6 border-b border-slate-700 pb-6">
                      <div class="flex gap-2 items-end">
                          <div>
                              <label class="block text-xs font-black text-indigo-400 uppercase tracking-widest mb-1">Target Level</label>
                              <select id="readingLevel" class="w-32 bg-slate-800 border border-slate-600 text-white font-bold px-4 py-3 rounded-xl focus:outline-none focus:border-indigo-500">
                                  <option value="starter">Starter</option><option value="level_1">Level 1</option>
                                  <option value="level_2">Level 2</option><option value="level_3">Level 3</option>
                                  <option value="level_4">Level 4</option><option value="level_5">Level 5</option>
                                  <option value="level_6" selected>Level 6</option>
                              </select>
                          </div>
                          <div>
                              <label class="block text-xs font-black text-indigo-400 uppercase tracking-widest mb-1">Unit</label>
                              <select id="readingUnit" class="w-32 bg-slate-800 border border-slate-600 text-white font-bold px-4 py-3 rounded-xl focus:outline-none focus:border-indigo-500">
                                  <!-- Khởi tạo bằng JS -->
                              </select>
                          </div>
                          <button onclick="loadReadingData()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-black px-6 py-3 rounded-xl transition-all h-[50px]">LOAD</button>
                      </div>
                  </div>

                  <div class="space-y-4">
                      <textarea id="readingText" rows="10" placeholder="Paste English reading paragraph here..." class="w-full bg-slate-800 border border-slate-600 text-white font-bold px-4 py-4 rounded-xl focus:outline-none focus:border-indigo-500 text-lg leading-relaxed"></textarea>
                      <button onclick="saveReadingData()" class="bg-violet-600 hover:bg-violet-500 text-white font-black px-8 py-4 rounded-xl shadow-[0_4px_0_#6d28d9] active:translate-y-[4px] active:shadow-[0_0px_0_#6d28d9] transition-all w-full flex justify-center items-center">
                          <i class="fa-solid fa-cloud-arrow-up mr-3 text-xl"></i> SAVE READING TO CLOUD
                      </button>
                  </div>
              </div>

              <!-- 3. SYSTEM AUDIT TABS (TÍNH NĂNG MỚI) -->
              <div id="auditTab" class="tab-content hidden">
                  <div class="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
                      <div>
                          <h2 class="font-black text-2xl text-white">Database Content Audit</h2>
                          <p class="text-sm font-bold text-slate-400">Scanner identifies missing content across all levels.</p>
                      </div>
                      <button onclick="runSystemAudit()" class="bg-amber-500 hover:bg-amber-400 text-slate-900 font-black px-6 py-2 rounded-xl transition-all flex items-center shadow-lg">
                          <i class="fa-solid fa-rotate-right mr-2"></i> RESCAN
                      </button>
                  </div>
                  
                  <div id="auditResults" class="space-y-4">
                      <!-- Render by JS -->
                  </div>
              </div>

          </section>
      </main>
  </div>

  <script>
    // ==========================================
    // BOSS DÁN ĐOẠN FIREBASE CONFIG VÀO ĐÂY BẮT BUỘC
    // ==========================================
   const firebaseConfig = {
        apiKey: "AIzaSyD8EXAmo1IlRCnQ_EFXorlKDrtrJmx8J1M",
        authDomain: "roundup-ai-academy.firebaseapp.com",
        projectId: "roundup-ai-academy",
        storageBucket: "roundup-ai-academy.firebasestorage.app",
        messagingSenderId: "723976989630",
        appId: "1:723976989630:web:45f3de91269e70f604e7ef"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const ADMIN_PIN = "108491"; // Mã PIN truy cập ACP

    // Render Unit Options
    const unitSelect = document.getElementById('readingUnit');
    for(let i=1; i<=15; i++) {
        let opt = document.createElement('option');
        opt.value = "unit_" + i; opt.innerText = "Unit " + i;
        unitSelect.appendChild(opt);
    }

    // LOGIN & TAB SWITCH LOGIC
    function verifyPin() {
        if(document.getElementById('pinInput').value === ADMIN_PIN) {
            document.getElementById('securityGate').classList.add('hidden');
            const adminPanel = document.getElementById('adminPanel');
            adminPanel.classList.remove('hidden'); adminPanel.classList.add('flex');
            setTimeout(() => { adminPanel.style.opacity = '1'; }, 50);
        } else { alert("Sai mã PIN!"); }
    }

    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => { el.classList.add('hidden'); el.classList.remove('block'); });
        document.querySelectorAll('.tab-btn').forEach(el => { el.classList.remove('active', 'bg-indigo-600', 'text-white', 'border-indigo-400'); el.classList.add('text-slate-400', 'border-transparent'); });
        document.getElementById(tabId).classList.remove('hidden'); document.getElementById(tabId).classList.add('block');
        const btn = document.getElementById('btn_' + tabId);
        btn.classList.add('active', 'bg-indigo-600', 'text-white', 'border-indigo-400'); btn.classList.remove('text-slate-400', 'border-transparent');
    }

    // TOAST NOTIFICATION LOGIC
    function showToast(title, msg, type) {
        const toast = document.getElementById('toast');
        const icon = document.getElementById('toastIcon');
        
        // Reset classes
        toast.className = "fixed top-5 right-5 transform transition-transform duration-300 z-[999] px-6 py-4 rounded-xl shadow-2xl flex items-center gap-4 border-2";
        
        if(type === 'success') {
            toast.classList.add('bg-emerald-50', 'border-emerald-200', 'text-emerald-700');
            icon.className = "fa-solid fa-circle-check text-3xl text-emerald-500";
        } else {
            toast.classList.add('bg-rose-50', 'border-rose-200', 'text-rose-700');
            icon.className = "fa-solid fa-circle-exclamation text-3xl text-rose-500";
        }

        document.getElementById('toastTitle').innerText = title;
        document.getElementById('toastMsg').innerText = msg;

        // Slide in
        toast.classList.remove('translate-x-[150%]');
        
        // Hide after 3 seconds
        setTimeout(() => {
            toast.classList.add('translate-x-[150%]');
        }, 3000);
    }

    // READING CRUD LOGIC
    function loadReadingData() {
        const level = document.getElementById('readingLevel').value;
        const unit = document.getElementById('readingUnit').value;
        
        document.getElementById('readingText').value = "Đang tải dữ liệu...";
        db.ref('readings/' + level + '/' + unit).once('value').then(snap => {
            const data = snap.val();
            if(data && data.text) {
                document.getElementById('readingText').value = data.text;
                showToast("Đã tải dữ liệu", `${level.toUpperCase()} - ${unit.toUpperCase()}`, "success");
            } else {
                document.getElementById('readingText').value = "";
                showToast("Chưa có dữ liệu", `Vui lòng thêm mới nội dung cho ${unit.toUpperCase()}`, "error");
            }
        });
    }

    function saveReadingData() {
        const level = document.getElementById('readingLevel').value;
        const unit = document.getElementById('readingUnit').value;
        const textContent = document.getElementById('readingText').value.trim();

        if(!textContent) { 
            showToast("Lỗi nhập liệu", "Nội dung bài đọc không được để trống!", "error");
            return; 
        }

        db.ref('readings/' + level + '/' + unit).set({
            text: textContent,
            updated_at: Date.now()
        }).then(() => {
            showToast("Lưu Thành Công!", `Dữ liệu ${level.toUpperCase()} - ${unit.toUpperCase()} đã được cập nhật lên Cloud.`, "success");
        }).catch(err => {
            showToast("Lỗi Hệ Thống", err.message, "error");
        });
    }

    // SYSTEM AUDIT LOGIC
    function runSystemAudit() {
        const resultsDiv = document.getElementById('auditResults');
        resultsDiv.innerHTML = '<div class="text-center py-10"><i class="fa-solid fa-radar-border fa-spin text-5xl text-indigo-500 mb-4"></i><p class="text-indigo-400 font-bold uppercase tracking-widest">Scanning Database...</p></div>';
        
        Promise.all([
            db.ref('readings').once('value'),
            db.ref('exams').once('value')
        ]).then((snapshots) => {
            const readingsDB = snapshots[0].val() || {};
            const examsDB = snapshots[1].val() || {};
            
            const levels = ['starter', 'level_1', 'level_2', 'level_3', 'level_4', 'level_5', 'level_6'];
            let htmlContent = '';
            let isPerfect = true;
            
            levels.forEach(lvl => {
                let missingReads = [];
                let missingExams = [];
                
                for(let i=1; i<=15; i++) {
                    const unitKey = 'unit_' + i;
                    const examKey = lvl + '_unit_' + i;
                    
                    if(!readingsDB[lvl] || !readingsDB[lvl][unitKey] || !readingsDB[lvl][unitKey].text) {
                        missingReads.push(i);
                    }
                    if(!examsDB[examKey]) {
                        missingExams.push(i);
                    }
                }
                
                if(missingReads.length > 0 || missingExams.length > 0) {
                    isPerfect = false;
                    htmlContent += `
                    <div class="bg-slate-800/80 p-5 rounded-2xl border border-slate-700 shadow-md">
                        <h4 class="font-black text-lg text-indigo-400 uppercase tracking-widest mb-3 flex items-center">
                            <i class="fa-solid fa-layer-group mr-2"></i> ${lvl.replace('_', ' ')}
                        </h4>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div class="bg-slate-900/50 p-4 rounded-xl border border-slate-700/50">
                                <p class="text-[10px] font-black text-rose-400 uppercase tracking-widest mb-2"><i class="fa-solid fa-book-open-reader mr-1"></i> Missing Reading Units</p>
                                <p class="text-slate-300 font-bold text-sm leading-relaxed">${missingReads.length > 0 ? missingReads.map(u => `<span class="inline-block bg-rose-500/20 text-rose-300 px-2 py-1 rounded mb-1 mr-1">Unit ${u}</span>`).join('') : '<span class="text-emerald-400"><i class="fa-solid fa-check mr-1"></i> Completed 15/15</span>'}</p>
                            </div>
                            <div class="bg-slate-900/50 p-4 rounded-xl border border-slate-700/50">
                                <p class="text-[10px] font-black text-amber-400 uppercase tracking-widest mb-2"><i class="fa-solid fa-file-signature mr-1"></i> Missing Exam Units</p>
                                <p class="text-slate-300 font-bold text-sm leading-relaxed">${missingExams.length > 0 ? missingExams.map(u => `<span class="inline-block bg-amber-500/20 text-amber-300 px-2 py-1 rounded mb-1 mr-1">Unit ${u}</span>`).join('') : '<span class="text-emerald-400"><i class="fa-solid fa-check mr-1"></i> Completed 15/15</span>'}</p>
                            </div>
                        </div>
                    </div>`;
                }
            });
            
            if(isPerfect) {
                resultsDiv.innerHTML = '<div class="bg-emerald-500/10 border-2 border-emerald-500/50 text-emerald-400 rounded-3xl p-10 text-center shadow-lg"><i class="fa-solid fa-circle-check text-6xl mb-4"></i><h3 class="font-black text-2xl uppercase tracking-widest">SYSTEM OPTIMIZED</h3><p class="font-bold">All Reading and Exam data is 100% complete.</p></div>';
            } else {
                resultsDiv.innerHTML = htmlContent;
            }
        });
    }
  </script>
</body>
</html>
