<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome - Study Daily</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
  
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    body { font-family: 'Nunito', sans-serif; background: #f8fafc; }
    .fade-in { animation: fadeIn 0.4s ease-in-out forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    /* Hiệu ứng đĩa than xoay */
    .spin-slow { animation: spin 4s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body class="min-h-[100dvh] flex items-center justify-center bg-[url('https://www.transparenttextures.com/patterns/diagmonds-light.png')] p-4">

  <!-- MUSIC PLAYER NỔI -->
  <div class="fixed bottom-6 right-6 z-50">
      <button id="musicToggleBtn" onclick="toggleMusic()" class="w-14 h-14 bg-white/90 backdrop-blur-sm text-indigo-500 rounded-full shadow-2xl border-2 border-indigo-100 flex items-center justify-center text-xl hover:scale-110 hover:text-indigo-700 transition relative">
          <i id="musicIcon" class="fa-solid fa-music"></i>
          <span id="musicOffSlash" class="absolute inset-0 flex items-center justify-center text-rose-500 text-3xl font-light transform -rotate-45 hidden">\</span>
      </button>
      <audio id="bgMusic" loop>
          <source src="https://cdn.pixabay.com/audio/2022/05/27/audio_1808fbf07a.mp3" type="audio/mpeg">
      </audio>
  </div>

  <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl overflow-hidden border border-slate-100 flex flex-col relative">
      <div class="bg-indigo-600 p-8 text-center relative overflow-hidden">
          <div class="absolute -top-10 -right-10 w-32 h-32 bg-indigo-500 rounded-full opacity-50 blur-xl"></div>
          <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-indigo-700 rounded-full opacity-50 blur-xl"></div>
          <div class="relative z-10 text-white">
              <i class="fa-solid fa-graduation-cap text-5xl mb-4 animate-bounce"></i>
              <h1 class="text-3xl font-black tracking-tight">Study Daily</h1>
              <p class="font-bold text-indigo-200 mt-2">Your Personalized Learning Hub</p>
          </div>
      </div>

      <div class="p-8">
          <div class="flex bg-slate-100 p-1 rounded-xl mb-8">
              <button id="btnShowLogin" onclick="switchTab('login')" class="flex-1 py-2 rounded-lg font-black text-sm transition bg-white text-indigo-600 shadow-sm">LOGIN</button>
              <button id="btnShowRegister" onclick="switchTab('register')" class="flex-1 py-2 rounded-lg font-black text-sm transition text-slate-400 hover:text-slate-600">REGISTER</button>
          </div>

          <div id="authError" class="hidden mb-4 p-3 bg-rose-50 border border-rose-200 text-rose-600 text-sm font-bold rounded-xl text-center fade-in"></div>

          <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5 fade-in">
              <div>
                  <label class="block text-slate-500 font-bold text-sm mb-2">Email Address</label>
                  <div class="relative">
                      <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400"><i class="fa-solid fa-envelope"></i></div>
                      <input type="email" id="loginEmail" required class="w-full pl-11 pr-4 py-3 bg-slate-50 border-2 border-slate-100 rounded-xl focus:bg-white focus:border-indigo-500 focus:outline-none font-bold text-slate-700 transition">
                  </div>
              </div>
              <div>
                  <label class="block text-slate-500 font-bold text-sm mb-2">Password</label>
                  <div class="relative">
                      <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400"><i class="fa-solid fa-lock"></i></div>
                      <input type="password" id="loginPassword" required class="w-full pl-11 pr-4 py-3 bg-slate-50 border-2 border-slate-100 rounded-xl focus:bg-white focus:border-indigo-500 focus:outline-none font-bold text-slate-700 transition">
                  </div>
              </div>
              <button type="submit" id="btnLoginSubmit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-black py-4 rounded-xl shadow-lg hover:-translate-y-1 transition transform flex items-center justify-center gap-2 mt-4">
                  ENTER CLASSROOM <i class="fa-solid fa-arrow-right"></i>
              </button>
          </form>

          <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-5 hidden fade-in">
              <div>
                  <label class="block text-slate-500 font-bold text-sm mb-2">Email Address</label>
                  <div class="relative">
                      <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400"><i class="fa-solid fa-envelope"></i></div>
                      <input type="email" id="regEmail" required class="w-full pl-11 pr-4 py-3 bg-slate-50 border-2 border-slate-100 rounded-xl focus:bg-white focus:border-indigo-500 focus:outline-none font-bold text-slate-700 transition">
                  </div>
              </div>
              <div>
                  <label class="block text-slate-500 font-bold text-sm mb-2">Password (Min 6 chars)</label>
                  <div class="relative">
                      <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400"><i class="fa-solid fa-lock"></i></div>
                      <input type="password" id="regPassword" required minlength="6" class="w-full pl-11 pr-4 py-3 bg-slate-50 border-2 border-slate-100 rounded-xl focus:bg-white focus:border-indigo-500 focus:outline-none font-bold text-slate-700 transition">
                  </div>
              </div>
              <button type="submit" id="btnRegSubmit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-black py-4 rounded-xl shadow-lg hover:-translate-y-1 transition transform flex items-center justify-center gap-2 mt-4">
                  CREATE ACCOUNT <i class="fa-solid fa-user-plus"></i>
              </button>
          </form>
      </div>
  </div>

  <script>
    // NHẠC NỀN LOFI 
    const bgMusic = document.getElementById('bgMusic');
    const musicIcon = document.getElementById('musicIcon');
    const musicOffSlash = document.getElementById('musicOffSlash');
    let hasInteracted = false;
    let isMusicPlaying = false;

    // Tự động phát nhạc khi người dùng tương tác lần đầu (gõ phím hoặc click)
    function attemptPlayMusic() {
        if (!hasInteracted) {
            bgMusic.volume = 0.5;
            let playPromise = bgMusic.play();
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    hasInteracted = true;
                    isMusicPlaying = true;
                    musicIcon.classList.add('spin-slow');
                    musicIcon.classList.replace('fa-music', 'fa-compact-disc');
                    musicOffSlash.classList.add('hidden');
                }).catch(error => { console.log("Trình duyệt chặn Autoplay."); });
            }
        }
    }
    
    document.addEventListener('keydown', attemptPlayMusic, { once: true });
    document.addEventListener('click', attemptPlayMusic, { once: true });

    function toggleMusic() {
        if (isMusicPlaying) {
            bgMusic.pause();
            isMusicPlaying = false;
            musicIcon.classList.remove('spin-slow');
            musicIcon.classList.replace('fa-compact-disc', 'fa-music');
            musicOffSlash.classList.remove('hidden');
        } else {
            bgMusic.play();
            isMusicPlaying = true;
            musicIcon.classList.add('spin-slow');
            musicIcon.classList.replace('fa-music', 'fa-compact-disc');
            musicOffSlash.classList.add('hidden');
            hasInteracted = true;
        }
    }

    const firebaseConfig = {
      apiKey: "AIzaSyD8EXAmo1IlRCnQ_EFXorlKDrtrJmx8J1M",
      authDomain: "roundup-ai-academy.firebaseapp.com",
      projectId: "roundup-ai-academy",
      storageBucket: "roundup-ai-academy.firebasestorage.app",
      messagingSenderId: "723976989630",
      appId: "1:723976989630:web:45f3de91269e70f604e7ef"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    auth.onAuthStateChanged((user) => { if (user) { window.location.href = "dashboard.html"; } });

    function switchTab(tab) {
        const errEl = document.getElementById('authError'); errEl.classList.add('hidden'); errEl.innerText = "";
        if (tab === 'login') {
            document.getElementById('loginForm').classList.remove('hidden'); document.getElementById('registerForm').classList.add('hidden');
            document.getElementById('btnShowLogin').className = "flex-1 py-2 rounded-lg font-black text-sm transition bg-white text-indigo-600 shadow-sm";
            document.getElementById('btnShowRegister').className = "flex-1 py-2 rounded-lg font-black text-sm transition text-slate-400 hover:text-slate-600";
        } else {
            document.getElementById('loginForm').classList.add('hidden'); document.getElementById('registerForm').classList.remove('hidden');
            document.getElementById('btnShowRegister').className = "flex-1 py-2 rounded-lg font-black text-sm transition bg-white text-indigo-600 shadow-sm";
            document.getElementById('btnShowLogin').className = "flex-1 py-2 rounded-lg font-black text-sm transition text-slate-400 hover:text-slate-600";
        }
    }

    function showError(message) {
        const errEl = document.getElementById('authError'); errEl.innerText = message; errEl.classList.remove('hidden');
    }

    function setLoading(btnId, isLoading, originalText) {
        const btn = document.getElementById(btnId);
        if (isLoading) { btn.disabled = true; btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Processing...`; btn.classList.add('opacity-70', 'cursor-not-allowed'); } 
        else { btn.disabled = false; btn.innerHTML = originalText; btn.classList.remove('opacity-70', 'cursor-not-allowed'); }
    }

    // Avatar mặc định khởi tạo
    const defaultAvatarUrl = "https://api.dicebear.com/7.x/adventurer/svg?seed=Felix";

    function handleRegister(e) {
        e.preventDefault();
        const email = document.getElementById('regEmail').value.trim();
        const password = document.getElementById('regPassword').value;
        const originalText = `CREATE ACCOUNT <i class="fa-solid fa-user-plus"></i>`;
        setLoading('btnRegSubmit', true, originalText);

        auth.createUserWithEmailAndPassword(email, password)
            .then((userCredential) => {
                const uid = userCredential.user.uid;
                return db.ref('users/' + uid).set({
                    email: email,
                    coins: 0,
                    current_level: 'starter',
                    avatar: defaultAvatarUrl,
                    created_at: firebase.database.ServerValue.TIMESTAMP
                });
            }).catch((error) => { showError(error.message); setLoading('btnRegSubmit', false, originalText); });
    }

    function handleLogin(e) {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;
        const originalText = `ENTER CLASSROOM <i class="fa-solid fa-arrow-right"></i>`;
        setLoading('btnLoginSubmit', true, originalText);

        auth.signInWithEmailAndPassword(email, password).catch((error) => {
            let msg = error.message;
            if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') { msg = "Invalid email or password. Please try again."; }
            showError(msg); setLoading('btnLoginSubmit', false, originalText);
        });
    }
  </script>
</body>
</html>
