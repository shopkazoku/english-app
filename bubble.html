<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bubble Hunter - Round-Up AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900;1000&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    body { font-family: 'Nunito', sans-serif; background-color: #0f172a; overflow: hidden; user-select: none; }
    
    /* KHU VỰC CHƠI GAME TỐI ƯU HIỂN THỊ */
    #gameArea { position: relative; width: 100%; height: 100%; overflow: hidden; background: linear-gradient(to top, #1e293b, #0f172a); border-radius: 1.5rem; box-shadow: inset 0 0 50px rgba(0,0,0,0.5); border: 4px solid #475569; cursor: crosshair; }
    
    /* VẬT LÝ QUẢ BÓNG */
    .bubble { position: absolute; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem;
      box-shadow: inset -10px -10px 20px rgba(0,0,0,0.2), inset 10px 10px 20px rgba(255,255,255,0.6), 0 5px 15px rgba(0,0,0,0.3);
      animation: floatUp linear forwards;
    }
    
    .b-blue { background: radial-gradient(circle at 30% 30%, #60a5fa, #2563eb); }
    .b-pink { background: radial-gradient(circle at 30% 30%, #f472b6, #db2777); }
    .b-green { background: radial-gradient(circle at 30% 30%, #34d399, #059669); }
    .b-gold { background: radial-gradient(circle at 30% 30%, #fef08a, #d97706); box-shadow: 0 0 20px #fbbf24, inset -10px -10px 20px rgba(0,0,0,0.2), inset 10px 10px 20px rgba(255,255,255,0.8); }
    .b-bomb { background: radial-gradient(circle at 30% 30%, #64748b, #0f172a); border: 2px solid #ef4444; box-shadow: 0 0 15px #ef4444; }

    @keyframes floatUp {
      0% { transform: translateY(100vh) scale(0.8); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-150px) scale(1.2); opacity: 0; }
    }

    /* VẬT LÝ BOOMERANG */
    .boomerang { position: absolute; font-size: 2.5rem; z-index: 30; pointer-events: none; transition: all 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94); animation: spin 0.2s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    /* HIỆU ỨNG NỔ & CHỮ */
    .pop-particle { position: absolute; border-radius: 50%; background-color: white; pointer-events: none; animation: popOut 0.4s ease-out forwards; z-index: 25; }
    @keyframes popOut { 0% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; } 100% { transform: translate(-50%, -50%) scale(3); opacity: 0; } }

    /* RUNG MÀN HÌNH */
    .shake { animation: shakeAnim 0.4s cubic-bezier(.36,.07,.19,.97) both; }
    @keyframes shakeAnim { 10%, 90% { transform: translate3d(-4px, 0, 0); } 20%, 80% { transform: translate3d(6px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-10px, 0, 0); } 40%, 60% { transform: translate3d(10px, 0, 0); } }
  </style>
</head>
<body class="h-screen w-full flex flex-col hidden bg-[url('https://www.transparenttextures.com/patterns/dark-matter.png')] bg-slate-900" id="mainBody">

  <!-- OVERLAY BẮT ĐẦU -->
  <div id="startOverlay" class="fixed inset-0 bg-black/90 z-[200] flex flex-col items-center justify-center p-4">
    <div class="text-7xl mb-4 animate-bounce">🪃</div>
    <h1 class="text-5xl sm:text-7xl font-black text-white mb-2 uppercase tracking-widest text-center">Bubble Hunter</h1>
    <p class="text-pink-400 font-bold mb-2 text-lg sm:text-xl text-center max-w-lg">Shoot bubbles to reach 30 pts. <br><span class="text-rose-500">WARNING: Hitting a bomb resets your score to 0!</span></p>
    <p class="text-slate-400 font-bold mb-8 text-sm uppercase tracking-wider"><i class="fa-solid fa-ticket text-amber-500 mr-1"></i> Entry: 20 Coins</p>
    
    <button onclick="startGame()" class="bg-pink-600 hover:bg-pink-500 text-white font-black text-2xl px-12 py-4 rounded-3xl shadow-[0_8px_0_#be185d] active:shadow-[0_0px_0_#be185d] active:translate-y-[8px] transition-all border-4 border-pink-300 uppercase tracking-widest">
      PLAY NOW
    </button>
  </div>

  <!-- BGM & SFX -->
  <audio id="bgmAudio" src="https://cdn.pixabay.com/download/audio/2021/08/04/audio_12b0c7443c.mp3" loop></audio>
  <audio id="sfxThrow" src="https://assets.mixkit.co/active_storage/sfx/2679/2679-preview.mp3"></audio>
  <audio id="sfxPop" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"></audio>
  <audio id="sfxGold" src="https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3"></audio>
  <audio id="sfxBomb" src="https://assets.mixkit.co/active_storage/sfx/2737/2737-preview.mp3"></audio>

  <!-- TOPBAR (Làm mỏng lại để tăng diện tích chơi) -->
  <header class="bg-slate-900/90 backdrop-blur-md border-b-2 border-slate-700 p-2 sm:p-3 flex justify-between items-center z-50 shrink-0">
    <div class="flex items-center space-x-3">
      <button onclick="window.location.href='home.html'" class="w-10 h-10 bg-slate-800 hover:bg-slate-700 rounded-xl flex justify-center items-center text-slate-300 transition border border-slate-600 shadow-lg">
        <i class="fa-solid fa-arrow-left"></i>
      </button>
      <div>
        <h1 class="font-black text-lg sm:text-xl text-white tracking-wide uppercase leading-none">Bubble Hunter</h1>
      </div>
    </div>
    
    <div class="flex items-center space-x-2 sm:space-x-4">
      <div class="bg-slate-800 px-3 py-1 rounded-xl border-2 border-slate-600 shadow-inner flex flex-col items-center min-w-[70px]">
        <span class="text-[9px] font-bold text-slate-400 uppercase">Score</span>
        <span id="scoreDisplay" class="font-black text-emerald-400 text-lg leading-none">0</span>
      </div>
      <div id="timerBox" class="bg-slate-800 px-3 py-1 rounded-xl border-2 border-slate-600 shadow-inner flex flex-col items-center min-w-[70px] transition-colors duration-300">
        <span class="text-[9px] font-bold text-slate-400 uppercase">Time</span>
        <span id="timerDisplay" class="font-black text-amber-400 text-lg leading-none">30s</span>
      </div>
    </div>
  </header>

  <!-- SÂN CHƠI GAME (Đã thêm flex-1 để tự co giãn lấp đầy màn hình) -->
  <main class="flex-1 w-full p-2 sm:p-4 flex items-center justify-center relative overflow-hidden">
    <div id="gameArea" onclick="shootBoomerang(event)">
      
      <!-- BẢNG THEO DÕI MỤC TIÊU BÊN TRONG GAME (Góc trên trái) -->
      <div class="absolute top-4 left-4 bg-slate-900/80 px-4 py-2 rounded-xl border-2 border-slate-700 z-20 shadow-lg pointer-events-none">
        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Target Remaining</p>
        <p id="targetDisplay" class="text-3xl font-black text-rose-500 animate-pulse">30</p>
      </div>

      <!-- NHÂN VẬT BẮN (Avatar ở góc dưới giữa) -->
      <div class="absolute bottom-[-10px] left-1/2 transform -translate-x-1/2 z-20 pointer-events-none flex flex-col items-center">
        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Hunter&backgroundColor=transparent&accessories=round" class="w-24 h-24 sm:w-32 sm:h-32 drop-shadow-[0_10px_10px_rgba(0,0,0,0.8)]">
      </div>

      <!-- Khu vực chứa Bóng (Sinh ra bằng JS) -->
      <div id="bubblesContainer" class="absolute inset-0 pointer-events-none"></div>

    </div>
    
    <!-- Text bay lên khi ăn điểm -->
    <div id="floatingText" class="absolute pointer-events-none font-black text-4xl opacity-0 z-50" style="text-shadow: 0 4px 0 rgba(0,0,0,0.8), 0 0 15px rgba(255,255,255,0.5);"></div>
  </main>

  <!-- KẾT QUẢ TRẬN ĐẤU (Fix lỗi tràn viền bằng max-h-[90vh] và overflow-y-auto) -->
  <div id="resultModal" class="fixed inset-0 bg-slate-900/95 z-[300] hidden flex-col items-center justify-center backdrop-blur-sm p-4 text-center">
    <div class="bg-slate-800 border-4 border-slate-600 rounded-3xl p-6 sm:p-8 max-w-sm w-full shadow-2xl relative max-h-[90vh] overflow-y-auto custom-scroll">
        
        <div id="resultIcon" class="text-[80px] sm:text-[100px] mb-2 drop-shadow-2xl">🏆</div>
        <h1 id="resultTitle" class="text-4xl sm:text-5xl font-black text-white uppercase tracking-widest mb-2 text-transparent bg-clip-text bg-gradient-to-r from-pink-300 to-pink-500">TIME'S UP!</h1>
        <p id="resultDesc" class="text-slate-400 font-bold text-sm mb-6">Let's check your hunting skills...</p>
        
        <div class="bg-slate-900 border border-slate-700 rounded-2xl p-4 mb-6 shadow-inner">
          <div class="flex justify-between items-center mb-3">
            <span class="font-bold text-slate-400 text-sm">Final Score:</span>
            <span id="finalScore" class="font-black text-3xl text-white">0</span>
          </div>
          <div class="flex justify-between items-center">
            <span class="font-bold text-slate-400 text-sm">Goal:</span>
            <span class="font-black text-lg text-slate-500">30 Pts</span>
          </div>
        </div>
        
        <div id="rewardBox" class="bg-slate-900 border-2 border-slate-700 p-4 rounded-2xl flex items-center justify-center space-x-3 mb-6">
          <i class="fa-solid fa-coins text-3xl text-amber-500"></i>
          <div class="text-left">
            <p class="text-[10px] font-bold text-amber-600 uppercase tracking-wider" id="rewardLabel">Reward</p>
            <p class="text-2xl font-black text-amber-500" id="rewardAmount">+0 Coins</p>
          </div>
        </div>

        <button onclick="window.location.href='home.html'" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-black text-lg px-6 py-4 rounded-xl shadow-[0_5px_0_#2563eb] active:shadow-[0_0px_0_#2563eb] active:translate-y-[5px] transition-all border-2 border-blue-400 uppercase tracking-widest">
          RETURN TO HUB
        </button>
    </div>
  </div>

  <script>
    // ==========================================
    // BOSS DÁN ĐOẠN FIREBASE CONFIG VÀO ĐÂY
    // ==========================================
    const firebaseConfig = {
  apiKey: "AIzaSyD8EXAmo1IlRCnQ_EFXorlKDrtrJmx8J1M",
  authDomain: "roundup-ai-academy.firebaseapp.com",
  projectId: "roundup-ai-academy",
  storageBucket: "roundup-ai-academy.firebasestorage.app",
  messagingSenderId: "723976989630",
  appId: "1:723976989630:web:45f3de91269e70f604e7ef"
};

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    let currentUser = null;
    let userCoins = 0;

    let score = 0;
    let timeLeft = 30; 
    const TARGET_SCORE = 30; 
    const ENTRY_FEE = 20;
    const WIN_REWARD = 50;
    
    let gameInterval;
    let timerInterval;
    let gameActive = false;

    const bubbleTypes = [
      { class: "b-blue", points: 1, content: "", weight: 40 },
      { class: "b-green", points: 1, content: "", weight: 30 },
      { class: "b-pink", points: 1, content: "", weight: 20 },
      { class: "b-gold", points: 5, content: "⭐", weight: 5 }, 
      { class: "b-bomb", points: "RESET", content: "💣", weight: 15 } // Cơ chế Bom mới
    ];

    auth.onAuthStateChanged((user) => {
      if (user) {
        currentUser = user;
        document.getElementById('mainBody').classList.remove('hidden');
        db.ref('users/' + user.uid).once('value').then((snapshot) => {
          const data = snapshot.val();
          if (data) { userCoins = data.coins || 0; }
        });
      } else { window.location.href = "login.html"; }
    });

    function startGame() {
      if (userCoins < ENTRY_FEE) { alert("Bạn không đủ Coin để mua vé! (Cần 20 Coins)"); return; }
      
      userCoins -= ENTRY_FEE;
      db.ref('users/' + currentUser.uid).update({ coins: userCoins });
      
      document.getElementById('startOverlay').style.display = 'none';
      const bgm = document.getElementById('bgmAudio');
      bgm.volume = 0.4; bgm.play().catch(e => {});

      score = 0;
      timeLeft = 30;
      gameActive = true;
      updateUI();
      
      gameInterval = setInterval(spawnBubble, 500); 
      timerInterval = setInterval(updateTimer, 1000);
    }

    function updateTimer() {
      timeLeft--;
      document.getElementById('timerDisplay').innerText = timeLeft + "s";
      
      if (timeLeft <= 10) {
        document.getElementById('timerBox').classList.replace('border-slate-600', 'border-rose-500');
        document.getElementById('timerDisplay').classList.replace('text-amber-400', 'text-rose-500');
      }
      if (timeLeft <= 0) endGame();
    }

    // UPDATE UI LIÊN TỤC (Điểm số & Target)
    function updateUI() {
        document.getElementById('scoreDisplay').innerText = score;
        
        const targetRemaining = Math.max(0, TARGET_SCORE - score);
        const targetEl = document.getElementById('targetDisplay');
        targetEl.innerText = targetRemaining;
        
        // Đổi màu xanh lá khi đạt đủ điểm
        if (targetRemaining === 0) {
            targetEl.classList.replace('text-rose-500', 'text-emerald-500');
            targetEl.classList.remove('animate-pulse');
        } else {
            targetEl.classList.replace('text-emerald-500', 'text-rose-500');
            targetEl.classList.add('animate-pulse');
        }
    }

    function spawnBubble() {
      if (!gameActive) return;
      const container = document.getElementById('bubblesContainer');
      const bubble = document.createElement('div');
      
      const type = getRandomBubbleType();
      const size = Math.floor(Math.random() * 40) + 40;
      const leftPos = Math.floor(Math.random() * 85) + 5; 
      const duration = (Math.random() * 2.5) + 2.5;

      bubble.className = `bubble ${type.class} pointer-events-auto cursor-crosshair`;
      bubble.style.width = `${size}px`; bubble.style.height = `${size}px`;
      bubble.style.left = `${leftPos}%`;
      bubble.style.animationDuration = `${duration}s`;
      bubble.innerHTML = type.content;

      // Xử lý khi đập bóng
      bubble.onmousedown = (e) => {
          e.stopPropagation(); // Ngăn sự kiện click lọt xuống gameArea
          shootBoomerang(e, bubble, type);
      };

      container.appendChild(bubble);
      setTimeout(() => { if (bubble && bubble.parentNode) bubble.remove(); }, duration * 1000);
    }

    function getRandomBubbleType() {
      const totalWeight = bubbleTypes.reduce((sum, item) => sum + item.weight, 0);
      let randomNum = Math.random() * totalWeight;
      for (let type of bubbleTypes) {
        if (randomNum < type.weight) return type;
        randomNum -= type.weight;
      }
      return bubbleTypes[0];
    }

    // LOGIC BẮN BOOMERANG TỪ NHÂN VẬT ĐẾN TỌA ĐỘ CLICK
    function shootBoomerang(e, targetBubble = null, typeData = null) {
        if (!gameActive) return;

        const area = document.getElementById('gameArea');
        const areaRect = area.getBoundingClientRect();
        
        // Tọa độ Avatar (Góc dưới giữa)
        const startX = areaRect.width / 2;
        const startY = areaRect.height - 50; 
        
        // Tọa độ Đích (Nơi chuột click)
        const targetX = e.clientX - areaRect.left;
        const targetY = e.clientY - areaRect.top;

        // Sinh Boomerang
        document.getElementById('sfxThrow').currentTime = 0;
        document.getElementById('sfxThrow').play();
        
        const boomerang = document.createElement('div');
        boomerang.className = 'boomerang';
        boomerang.innerText = '🪃';
        boomerang.style.left = `${startX}px`;
        boomerang.style.top = `${startY}px`;
        area.appendChild(boomerang);

        // Kích hoạt bay tới đích (delay 10ms để CSS nhận transition)
        setTimeout(() => {
            boomerang.style.left = `${targetX - 20}px`; // Trừ hao tâm của emoji
            boomerang.style.top = `${targetY - 20}px`;
        }, 10);

        // Khi Boomerang chạm đích (Sau 0.2s theo CSS transition)
        setTimeout(() => {
            boomerang.remove();
            // Nếu có mục tiêu bóng tại đó, tiến hành phá hủy
            if (targetBubble && targetBubble.parentNode) {
                processHit(targetX, targetY, targetBubble, typeData);
            }
        }, 200);
    }

    // XỬ LÝ KHI BÓNG BỊ PHÁ HỦY
    function processHit(x, y, bubbleEl, typeData) {
        bubbleEl.remove();

        if (typeData.points === "RESET") {
            // ĐẠP TRÚNG BOM ➔ VỀ 0
            score = 0;
            document.getElementById('sfxBomb').play();
            showFloatingText(x, y, "RESET!", "#f87171");
            
            const main = document.getElementById('mainBody');
            main.classList.add('shake');
            main.style.boxShadow = "inset 0 0 150px rgba(244,63,94,0.8)";
            setTimeout(() => { main.classList.remove('shake'); main.style.boxShadow = "none"; }, 400);
        } else {
            // ĂN ĐIỂM
            score += typeData.points;
            typeData.points === 5 ? document.getElementById('sfxGold').play() : document.getElementById('sfxPop').play();
            createPopEffect(x, y, typeData.points === 5 ? '#fbbf24' : '#10b981'); // Nổ màu xanh hoặc vàng
            showFloatingText(x, y, `+${typeData.points}`, typeData.points === 5 ? '#fef08a' : '#34d399');
        }
        
        updateUI();
    }

    function createPopEffect(x, y, color) {
      const area = document.getElementById('gameArea');
      const particle = document.createElement('div');
      particle.className = 'pop-particle';
      particle.style.width = '50px'; particle.style.height = '50px';
      particle.style.left = `${x}px`; particle.style.top = `${y}px`;
      particle.style.backgroundColor = color;
      area.appendChild(particle);
      setTimeout(() => particle.remove(), 400);
    }

    function showFloatingText(x, y, text, color) {
      const floatEl = document.getElementById('floatingText');
      floatEl.style.animation = 'none'; floatEl.offsetHeight; 
      floatEl.innerText = text; floatEl.style.color = color;
      floatEl.style.left = `${x - 20}px`; floatEl.style.top = `${y - 30}px`;
      floatEl.style.animation = 'floatUp 0.8s ease-out forwards';
    }

    function endGame() {
      gameActive = false;
      clearInterval(gameInterval); clearInterval(timerInterval);
      document.getElementById('bgmAudio').pause();

      const modal = document.getElementById('resultModal');
      const icon = document.getElementById('resultIcon');
      const title = document.getElementById('resultTitle');
      const desc = document.getElementById('resultDesc');
      const rewardAmount = document.getElementById('rewardAmount');
      const rewardBox = document.getElementById('rewardBox');
      
      document.getElementById('finalScore').innerText = score;

      if (score >= TARGET_SCORE) {
        document.getElementById('sfxGold').play();
        icon.innerText = '🏆'; icon.classList.add('animate-bounce');
        title.innerText = 'VICTORY!';
        title.className = "text-4xl sm:text-6xl font-black uppercase tracking-widest mb-2 text-transparent bg-clip-text bg-gradient-to-r from-emerald-300 to-emerald-500";
        desc.innerText = "You are a master hunter!";
        
        rewardAmount.innerText = `+${WIN_REWARD} Coins`;
        rewardAmount.className = "text-2xl font-black text-emerald-400";
        rewardBox.className = "bg-slate-900 border-2 border-emerald-500/50 p-4 rounded-2xl flex items-center justify-center space-x-3 shadow-[0_0_30px_rgba(16,185,129,0.3)]";
        
        db.ref('users/' + currentUser.uid).update({ coins: userCoins + WIN_REWARD });
        confetti({ particleCount: 200, spread: 100, origin: { y: 0.5 }, colors: ['#f472b6', '#34d399', '#fbbf24'] });
      } else {
        document.getElementById('sfxBomb').play();
        icon.innerText = '😭'; icon.classList.remove('animate-bounce');
        title.innerText = 'GAME OVER';
        title.className = "text-4xl sm:text-6xl font-black uppercase tracking-widest mb-2 text-rose-500";
        desc.innerText = "You missed the target. Try again!";
        
        rewardAmount.innerText = "0 Coins";
        rewardAmount.className = "text-2xl font-black text-slate-500";
        rewardBox.className = "bg-slate-900 border-2 border-slate-700 p-4 rounded-2xl flex items-center justify-center space-x-3";
      }

      modal.classList.remove('hidden'); modal.classList.add('flex');
    }
  </script>
</body>
</html>
