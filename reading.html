<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reading - Study Daily</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
  
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    body { font-family: 'Nunito', sans-serif; background: #f8fafc; }
    .custom-scroll::-webkit-scrollbar { width: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 8px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
    audio { width: 100%; height: 44px; outline: none; border-radius: 12px; }
    audio::-webkit-media-controls-panel { background-color: #f1f5f9; }
  </style>
</head>
<body class="h-[100dvh] w-full flex flex-col bg-[url('https://www.transparenttextures.com/patterns/diagmonds-light.png')] relative" id="mainBody">

  <!-- HEADER -->
  <header class="bg-white border-b-2 border-indigo-100 p-3 sm:p-4 flex justify-between items-center shadow-sm z-50 shrink-0">
    <div class="flex items-center space-x-3">
      <button onclick="window.location.href='classroom.html'" class="w-10 h-10 bg-slate-100 hover:bg-slate-200 rounded-xl flex items-center justify-center text-slate-600 transition shadow-sm border border-slate-200" title="Back to Classroom">
          <i class="fa-solid fa-arrow-left"></i>
      </button>
      <div class="flex flex-col">
        <h1 class="font-black text-lg sm:text-xl text-indigo-900 leading-tight">Reading Practice</h1>
        <span id="levelDisplay" class="mt-0.5 text-indigo-500 font-bold text-[10px] sm:text-xs uppercase">Loading...</span>
      </div>
    </div>
    <div class="flex gap-2">
        <select id="unitSelect" onchange="loadReadingData()" class="bg-indigo-50 border border-indigo-200 text-indigo-700 font-black px-4 py-2 rounded-xl focus:outline-none text-sm cursor-pointer shadow-sm">
            <!-- Sẽ được fill bằng JavaScript -->
        </select>
        <div class="hidden sm:flex items-center bg-amber-50 px-4 py-2 rounded-xl border border-amber-200 shadow-sm">
            <i class="fa-solid fa-coins text-amber-500 mr-2 text-lg"></i><span id="displayCoins" class="font-black text-amber-700">...</span>
        </div>
    </div>
  </header>

  <!-- LOADING OVERLAY -->
  <div id="loadingOverlay" class="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-white transition-opacity duration-500">
      <i class="fa-solid fa-book-open-reader fa-bounce text-5xl text-indigo-500 mb-4"></i>
      <p class="font-black text-slate-500 animate-pulse text-sm">Syncing Reading Materials...</p>
  </div>

  <!-- DICTIONARY POPUP -->
  <div id="dictPopup" class="fixed hidden z-[9999] bg-white rounded-2xl shadow-xl border-2 border-indigo-100 p-4 w-64 opacity-0 translate-y-2 transition-all">
      <div class="flex justify-between items-start mb-2">
          <h4 id="dictPopupWord" class="font-black text-indigo-900 text-lg">Word</h4>
      </div>
      <p id="dictPopupMeaning" class="text-slate-600 font-bold text-sm">Translating...</p>
  </div>

  <!-- NỘI DUNG BÀI ĐỌC -->
  <main class="flex-1 w-full max-w-4xl mx-auto p-4 sm:p-8 overflow-y-auto custom-scroll flex flex-col relative opacity-0 transition-opacity duration-500" id="mainContent">
      <div class="bg-white rounded-3xl shadow-xl border border-slate-100 p-6 sm:p-10 mb-20 flex-1 relative">
          <!-- Audio Player (Chỉ hiện khi có link Audio) -->
          <div id="audioContainer" class="hidden w-full bg-slate-50 p-3 rounded-2xl border border-slate-200 mb-8 shadow-sm">
              <audio id="readingAudio" controls class="w-full">
                  <source id="audioSource" src="" type="audio/mpeg">
              </audio>
          </div>

          <div class="text-center mb-10">
              <span id="unitBadge" class="inline-block bg-indigo-100 text-indigo-700 font-black px-4 py-1.5 rounded-full text-sm uppercase mb-4 tracking-wider">Unit X</span>
              <h2 id="readingTitle" class="text-3xl sm:text-4xl font-extrabold text-slate-800 leading-tight">Loading Title...</h2>
          </div>

          <div id="readingContent" class="text-lg sm:text-xl text-slate-700 leading-relaxed font-medium space-y-6 text-justify cursor-text">
              <!-- Nội dung bài đọc sẽ được nhúng vào đây -->
          </div>
      </div>
  </main>

  <script>
    // ==========================================
    // CẤU HÌNH HỆ THỐNG
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyD8EXAmo1IlRCnQ_EFXorlKDrtrJmx8J1M",
      authDomain: "roundup-ai-academy.firebaseapp.com",
      projectId: "roundup-ai-academy",
      storageBucket: "roundup-ai-academy.firebasestorage.app",
      messagingSenderId: "723976989630",
      appId: "1:723976989630:web:45f3de91269e70f604e7ef"
    };
    
    const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbwtm-mJCRvAiXcbLI_dWEnzDGbqw1sWeBQqISC614dsvuiGkzyx6j-z5RS6jNx0xaX27w/exec";
    
    const unitMapping = [
        { unit: 1, name: "Unit 1" }, { unit: 2, name: "Unit 2" }, { unit: 3, name: "Unit 3" },
        { unit: 4, name: "Unit 4" }, { unit: 5, name: "Unit 5" }, { unit: 6, name: "Unit 6" }
    ];

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth(); 
    const db = firebase.database();
    
    let currentlyViewingLevel = "starter"; 
    let masterSheetData = null; 

    // Bắt tham số Level từ URL nếu có (VD: reading.html?level=level_1)
    const urlParams = new URLSearchParams(window.location.search);
    if(urlParams.has('level')) {
        currentlyViewingLevel = urlParams.get('level');
    }

    // ==========================================
    // KHỞI ĐỘNG HỆ THỐNG
    // ==========================================
    auth.onAuthStateChanged((user) => {
      if (user) {
        db.ref('users/' + user.uid).once('value').then(async (snapshot) => {
            let data = snapshot.val() || { coins: 0, current_level: 'starter' };
            document.getElementById('displayCoins').innerText = data.coins || 0;
            
            // Ưu tiên level từ URL (từ trang Classroom truyền sang), nếu không có thì lấy level gốc của user
            if(!urlParams.has('level')) currentlyViewingLevel = data.current_level || 'starter';
            document.getElementById('levelDisplay').innerText = currentlyViewingLevel.replace('_', ' ') + " CLASS";

            buildUnitSelector();
            await syncGoogleSheetsData();
            loadReadingData();

            setTimeout(() => { 
                document.getElementById('loadingOverlay').style.display = 'none'; 
                document.getElementById('mainContent').style.opacity = '1'; 
            }, 500);
        });
      } else { window.location.href = "index.html"; }
    });

    function buildUnitSelector() {
        document.getElementById('unitSelect').innerHTML = unitMapping.map((u, i) => `<option value="${i + 1}">${u.name}</option>`).join('');
    }

    async function syncGoogleSheetsData() {
        try {
            let res = await fetch(SHEET_API_URL);
            masterSheetData = await res.json();
        } catch(e) {
            console.error("Lỗi kết nối Google Sheets:", e);
        }
    }

    // ==========================================
    // RÁP NỘI DUNG VÀO GIAO DIỆN
    // ==========================================
    function loadReadingData() {
        let currentLevel = currentlyViewingLevel.toLowerCase();
        let uIdx = document.getElementById('unitSelect').value;
        let unitKey = "unit_" + uIdx;
        
        document.getElementById('unitBadge').innerText = "Unit " + uIdx;
        const titleEl = document.getElementById('readingTitle');
        const contentEl = document.getElementById('readingContent');
        const audioContainer = document.getElementById('audioContainer');
        const audioSource = document.getElementById('audioSource');
        const audioPlayer = document.getElementById('readingAudio');

        if (masterSheetData && masterSheetData.reading && masterSheetData.reading[currentLevel] && masterSheetData.reading[currentLevel][unitKey]) {
            let rData = masterSheetData.reading[currentLevel][unitKey];
            
            titleEl.innerText = rData.title || "Reading Practice";
            // Chuyển ký tự xuống dòng (\n) thành thẻ <br> trong HTML để chia đoạn
            let formattedContent = (rData.content || "").replace(/\n/g, '<br><br>');
            contentEl.innerHTML = formattedContent;

            // Xử lý Audio
            if(rData.audio && rData.audio.trim() !== "") {
                audioSource.src = rData.audio;
                audioPlayer.load();
                audioContainer.classList.remove('hidden');
            } else {
                audioContainer.classList.add('hidden');
                audioPlayer.pause();
            }
        } else {
            titleEl.innerText = "Coming Soon";
            contentEl.innerHTML = `
                <div class="text-center py-10">
                    <i class="fa-solid fa-file-circle-xmark text-6xl text-slate-300 mb-4"></i>
                    <p class="text-slate-500">Reading materials for this unit are being prepared.</p>
                </div>
            `;
            audioContainer.classList.add('hidden');
            audioPlayer.pause();
        }
    }

    // ==========================================
    // VOICE EMMA VÀ TỪ ĐIỂN SMART DICTIONARY
    // ==========================================
    function getFemaleVoice() {
        let voices = window.speechSynthesis.getVoices();
        return voices.find(v => v.lang.startsWith('en') && (v.name.includes('Zira') || v.name.includes('Samantha') || v.name.includes('Victoria') || v.name.includes('Google US English'))) || voices.find(v => v.lang.startsWith('en'));
    }

    if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = function() { window.speechSynthesis.getVoices(); };
    }

    const dictPopup = document.getElementById('dictPopup');
    
    // Bắt sự kiện bôi đen trong vùng bài đọc
    document.getElementById('readingContent').addEventListener('mouseup', async (e) => {
        let txt = window.getSelection().toString().trim();
        
        if (txt.length > 0 && txt.length < 40) {
            // 1. Voice Emma đọc ngay lập tức
            if ('speechSynthesis' in window) { 
                window.speechSynthesis.cancel(); 
                let wordAudio = new SpeechSynthesisUtterance(txt); 
                wordAudio.lang = 'en-US'; 
                let femaleVoice = getFemaleVoice();
                if (femaleVoice) wordAudio.voice = femaleVoice;
                window.speechSynthesis.speak(wordAudio); 
            }

            // 2. Hiện Popup dịch nghĩa tiếng Việt
            document.getElementById('dictPopupWord').innerText = txt; 
            document.getElementById('dictPopupMeaning').innerText = "Translating...";
            
            let x = e.clientX; let y = e.clientY + 20;
            if(x + 260 > window.innerWidth) x = window.innerWidth - 270; 
            if(y + 100 > window.innerHeight) y = e.clientY - 120; 
            
            dictPopup.style.left = `${x}px`; dictPopup.style.top = `${y}px`; 
            dictPopup.classList.remove('hidden');
            setTimeout(() => { dictPopup.classList.remove('opacity-0', 'translate-y-2'); }, 10);
            
            try { 
                let res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(txt)}&langpair=en|vi`); 
                let data = await res.json(); 
                document.getElementById('dictPopupMeaning').innerText = data.responseData.translatedText || "Not found."; 
            } catch(err) {
                document.getElementById('dictPopupMeaning').innerText = "Error translating.";
            }
        }
    });
    
    // Ẩn Popup khi click ra ngoài
    document.addEventListener('mousedown', (e) => { 
        if (!dictPopup.contains(e.target)) { 
            dictPopup.classList.add('opacity-0', 'translate-y-2'); 
            setTimeout(() => { dictPopup.classList.add('hidden'); }, 200); 
        } 
    });
  </script>
</body>
</html>
