<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Round-Up AI Academy</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
  
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

  <style>
    body { font-family: 'Nunito', sans-serif; }
    .glass-panel { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
  </style>
</head>
<body class="h-screen flex items-center justify-center bg-slate-50 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] p-4">

  <div class="glass-panel w-full max-w-md rounded-3xl shadow-2xl border-4 border-emerald-100 p-8 flex flex-col items-center space-y-6 relative overflow-hidden">
    
    <!-- Decorative Elements -->
    <div class="absolute -top-10 -right-10 w-32 h-32 bg-emerald-200 rounded-full blur-3xl opacity-50"></div>
    <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-indigo-200 rounded-full blur-3xl opacity-50"></div>

    <!-- Logo -->
    <div class="w-20 h-20 bg-gradient-to-br from-emerald-400 to-teal-500 rounded-2xl flex items-center justify-center text-white text-4xl shadow-lg shadow-emerald-200 border-4 border-white z-10">
      <i class="fa-solid fa-graduation-cap"></i>
    </div>
    
    <div class="text-center z-10">
      <h1 class="font-black text-2xl text-emerald-900 tracking-tight">ROUND-UP AI</h1>
      <p class="text-sm font-bold text-teal-600" id="formTitle">System Sign In</p>
    </div>

    <!-- Auth Form -->
    <div class="w-full space-y-4 z-10">
      <div>
        <label class="text-xs font-bold text-slate-500 uppercase tracking-wider block mb-1">Student Email</label>
        <div class="relative">
          <i class="fa-solid fa-envelope absolute left-4 top-3.5 text-slate-400"></i>
          <input type="email" id="emailInput" class="w-full bg-white border-2 border-slate-200 rounded-xl py-3 pl-10 pr-4 text-sm font-bold text-slate-700 outline-none focus:border-emerald-500 transition shadow-sm" placeholder="anna@roundup.com">
        </div>
      </div>
      <div>
        <label class="text-xs font-bold text-slate-500 uppercase tracking-wider block mb-1">Password</label>
        <div class="relative">
          <i class="fa-solid fa-lock absolute left-4 top-3.5 text-slate-400"></i>
          <input type="password" id="passwordInput" class="w-full bg-white border-2 border-slate-200 rounded-xl py-3 pl-10 pr-4 text-sm font-bold text-slate-700 outline-none focus:border-emerald-500 transition shadow-sm" placeholder="••••••••">
        </div>
      </div>
      
      <p id="errorMessage" class="text-xs font-bold text-rose-500 text-center hidden">Invalid email or password!</p>

      <button onclick="handleAuth()" id="authButton" class="w-full py-3.5 rounded-xl bg-emerald-500 text-white font-black text-lg shadow-lg shadow-emerald-500/30 hover:bg-emerald-400 hover:scale-105 active:scale-95 transition-all">
        <i class="fa-solid fa-right-to-bracket mr-2"></i> START LEARNING
      </button>
    </div>

    <!-- Toggle Login / Register -->
    <div class="text-center z-10">
      <p class="text-xs font-bold text-slate-500">
        <span id="toggleText">Don't have an account?</span> 
        <button onclick="toggleMode()" class="text-indigo-600 hover:text-indigo-800 underline transition ml-1" id="toggleBtn">Create new account</button>
      </p>
    </div>

  </div>

  <script>
    // ==========================================
    // BOSS PASTE FIREBASE CONFIG HERE
    // ==========================================
    const firebaseConfig = {
  apiKey: "AIzaSyD8EXAmo1IlRCnQ_EFXorlKDrtrJmx8J1M",
  authDomain: "roundup-ai-academy.firebaseapp.com",
  projectId: "roundup-ai-academy",
  storageBucket: "roundup-ai-academy.firebasestorage.app",
  messagingSenderId: "723976989630",
  appId: "1:723976989630:web:45f3de91269e70f604e7ef"
};

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    let isLoginMode = true;

    function toggleMode() {
      isLoginMode = !isLoginMode;
      document.getElementById('formTitle').innerText = isLoginMode ? "System Sign In" : "Create New Account";
      document.getElementById('authButton').innerHTML = isLoginMode ? '<i class="fa-solid fa-right-to-bracket mr-2"></i> START LEARNING' : '<i class="fa-solid fa-user-plus mr-2"></i> REGISTER NOW';
      document.getElementById('authButton').className = isLoginMode 
        ? "w-full py-3.5 rounded-xl bg-emerald-500 text-white font-black text-lg shadow-lg shadow-emerald-500/30 hover:bg-emerald-400 hover:scale-105 active:scale-95 transition-all"
        : "w-full py-3.5 rounded-xl bg-indigo-500 text-white font-black text-lg shadow-lg shadow-indigo-500/30 hover:bg-indigo-400 hover:scale-105 active:scale-95 transition-all";
      
      document.getElementById('toggleText').innerText = isLoginMode ? "Don't have an account?" : "Already have an account?";
      document.getElementById('toggleBtn').innerText = isLoginMode ? "Create new account" : "Sign in now";
      document.getElementById('errorMessage').classList.add('hidden');
    }

    function handleAuth() {
      const email = document.getElementById('emailInput').value.trim();
      const password = document.getElementById('passwordInput').value.trim();
      const errorMsg = document.getElementById('errorMessage');
      
      if (!email || !password) {
        errorMsg.innerText = "Please enter both Email and Password!";
        errorMsg.classList.remove('hidden');
        return;
      }

      const btn = document.getElementById('authButton');
      const originalText = btn.innerHTML;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processing...';

      if (isLoginMode) {
        // SIGN IN
        firebase.auth().signInWithEmailAndPassword(email, password)
          .then((userCredential) => {
            window.location.href = "dashboard.html"; // Trở về sảnh chính chuẩn xác
          })
          .catch((error) => {
            btn.innerHTML = originalText;
            errorMsg.innerText = "⚠️ Login failed. Please check your credentials!";
            errorMsg.classList.remove('hidden');
            console.error(error.message);
          });
      } else {
        // REGISTER
        firebase.auth().createUserWithEmailAndPassword(email, password)
          .then((userCredential) => {
            alert("✅ Registration successful! Entering the academy...");
            window.location.href = "dashboard.html";
          })
          .catch((error) => {
            btn.innerHTML = originalText;
            errorMsg.innerText = "⚠️ Error: " + error.message;
            errorMsg.classList.remove('hidden');
          });
      }
    }
  </script>
</body>
</html>
