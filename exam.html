<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exam Center - Study Daily</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    body { font-family: 'Nunito', sans-serif; background: #f8fafc; }
    .custom-scroll::-webkit-scrollbar { width: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 8px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
    
    .option-label { transition: all 0.2s ease; cursor: pointer; }
    .option-input:checked + .option-content { background-color: #e0e7ff; border-color: #6366f1; color: #4338ca; font-weight: 900; }
    .option-input:checked + .option-content .custom-radio { background-color: #6366f1; border-color: #6366f1; }
  </style>
</head>
<body class="h-[100dvh] w-full flex flex-col bg-[url('https://www.transparenttextures.com/patterns/diagmonds-light.png')] relative" id="mainBody">

  <header class="bg-white border-b-2 border-emerald-100 p-3 sm:p-4 flex justify-between items-center shadow-sm z-50 shrink-0">
    <div class="flex items-center space-x-3">
      <button onclick="window.location.href='dashboard.html'" class="w-10 h-10 bg-slate-100 hover:bg-slate-200 rounded-xl flex items-center justify-center text-slate-600 transition shadow-sm border border-slate-200">
          <i class="fa-solid fa-arrow-left"></i>
      </button>
      <div class="flex flex-col">
        <h1 class="font-black text-lg sm:text-xl text-emerald-700 leading-tight">Exam Center</h1>
        <span id="examTypeDisplay" class="mt-0.5 text-emerald-500 font-bold text-[10px] sm:text-xs uppercase">Loading...</span>
      </div>
    </div>
    <div class="flex items-center bg-amber-50 px-4 py-2 rounded-xl border border-amber-200 shadow-sm">
        <i class="fa-solid fa-coins text-amber-500 mr-2 text-lg"></i><span id="displayCoins" class="font-black text-amber-700">...</span>
    </div>
  </header>

  <div id="loadingOverlay" class="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-white transition-opacity duration-500">
      <i class="fa-solid fa-file-signature fa-bounce text-5xl text-emerald-500 mb-4"></i>
      <p class="font-black text-slate-500 animate-pulse text-sm">Generating Exam...</p>
  </div>

  <main class="flex-1 w-full max-w-4xl mx-auto p-4 sm:p-8 overflow-y-auto custom-scroll flex flex-col relative opacity-0 transition-opacity duration-500" id="mainContent">
      <div id="examContainer" class="bg-white rounded-3xl shadow-xl border border-slate-100 p-6 sm:p-10 mb-20">
          
          <div class="text-center mb-10 border-b-2 border-slate-100 pb-8">
              <span id="badgeDisplay" class="inline-block bg-emerald-100 text-emerald-700 font-black px-4 py-1.5 rounded-full text-sm uppercase mb-4 tracking-wider">Exam</span>
              <h2 id="examTitle" class="text-3xl sm:text-4xl font-extrabold text-slate-800 leading-tight">Ready?</h2>
              <p class="text-sm font-bold text-slate-500 mt-3" id="examSubtitle">Choose the best answer for each question.</p>
          </div>

          <div id="questionsArea" class="space-y-8">
              <!-- JS generates questions here -->
          </div>

          <div class="mt-12 flex justify-center">
              <button id="btnSubmitExam" onclick="submitExam()" class="bg-emerald-500 hover:bg-emerald-600 text-white font-black px-12 py-4 rounded-2xl shadow-lg hover:-translate-y-1 transition transform flex items-center justify-center gap-2 text-xl w-full max-w-md hidden">
                  SUBMIT EXAM <i class="fa-solid fa-check-double"></i>
              </button>
          </div>
      </div>
  </main>

  <!-- RESULT MODAL -->
  <div id="resultModal" class="fixed inset-0 z-[9999] bg-slate-900/80 backdrop-blur-sm hidden flex-col items-center justify-center p-4">
      <div class="bg-white rounded-3xl shadow-2xl w-full max-w-lg overflow-hidden transform transition-all scale-100 text-center flex flex-col">
          
          <div id="resultHeader" class="p-8 pb-4">
              <!-- Render by JS -->
          </div>

          <div class="px-8 pb-8 flex flex-col items-center">
              <div class="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl p-6 mb-6">
                  <p class="text-slate-500 font-bold uppercase tracking-widest text-sm mb-1">Your Score</p>
                  <p class="text-5xl font-black text-slate-800"><span id="scoreAchieved">0</span> <span class="text-2xl text-slate-400">/ <span id="scoreTotal">0</span></span></p>
                  <p id="percentageDisplay" class="font-bold text-lg mt-2"></p>
              </div>

              <div id="rewardBox" class="w-full mb-6">
                  <!-- Render by JS -->
              </div>

              <button onclick="window.location.href='dashboard.html'" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-black py-4 rounded-xl shadow-lg transition">
                  BACK TO DASHBOARD
              </button>
          </div>
      </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD8EXAmo1IlRCnQ_EFXorlKDrtrJmx8J1M",
      authDomain: "roundup-ai-academy.firebaseapp.com",
      projectId: "roundup-ai-academy",
      storageBucket: "roundup-ai-academy.firebasestorage.app",
      messagingSenderId: "723976989630",
      appId: "1:723976989630:web:45f3de91269e70f604e7ef"
    };
    
    const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbwtm-mJCRvAiXcbLI_dWEnzDGbqw1sWeBQqISC614dsvuiGkzyx6j-z5RS6jNx0xaX27w/exec";

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth(); 
    const db = firebase.database();
    
    let currentUser = null;
    let currentCoins = 0;
    let examData = [];
    
    // Parse URL
    const urlParams = new URLSearchParams(window.location.search);
    const targetLevel = urlParams.get('level') || 'general'; // vd: level_1, level_4
    const examType = urlParams.get('type') || 'exam';       // entry hoặc exam

    auth.onAuthStateChanged(async (user) => {
      if (user) {
        currentUser = user;
        try {
            db.ref('users/' + user.uid).on('value', (snapshot) => {
                let data = snapshot.val() || { coins: 0 };
                document.getElementById('displayCoins').innerText = data.coins || 0;
                currentCoins = data.coins || 0;
            });
            await loadExamData();
        } catch (e) { console.error(e); } 
        finally { hideLoading(); }
      } else { window.location.href = "index.html"; }
    });

    function hideLoading() {
        document.getElementById('loadingOverlay').style.display = 'none'; 
        document.getElementById('mainContent').style.opacity = '1';
    }
    window.addEventListener('load', () => { setTimeout(hideLoading, 2500); });

    async function loadExamData() {
        try {
            let res = await fetch(SHEET_API_URL);
            let masterData = await res.json();
            
            // Setup Giao diện theo Type
            if (examType === 'entry') {
                document.getElementById('examTypeDisplay').innerText = "PLACEMENT TEST";
                document.getElementById('badgeDisplay').innerText = "ENTRY TEST";
                document.getElementById('badgeDisplay').className = "inline-block bg-amber-100 text-amber-700 font-black px-4 py-1.5 rounded-full text-sm uppercase mb-4 tracking-wider";
                document.getElementById('examTitle').innerText = "Unlock " + targetLevel.replace('_', ' ').toUpperCase();
                document.getElementById('examSubtitle').innerText = "Score 70% or higher to unlock this level.";
            } else {
                document.getElementById('examTypeDisplay').innerText = "FINAL EXAM";
                document.getElementById('badgeDisplay').innerText = "REWARD EXAM";
                document.getElementById('examTitle').innerText = "Earn Coins";
                document.getElementById('examSubtitle').innerText = "Answer correctly to earn coins for the Game Arena.";
            }

            if (masterData && masterData.exam && masterData.exam[targetLevel] && masterData.exam[targetLevel][examType]) {
                examData = masterData.exam[targetLevel][examType];
                renderQuestions();
            } else {
                document.getElementById('questionsArea').innerHTML = `
                    <div class="text-center py-10">
                        <i class="fa-solid fa-file-circle-xmark text-6xl text-slate-300 mb-4"></i>
                        <p class="text-slate-500 font-bold">This exam is currently being updated. Please check back later.</p>
                    </div>`;
            }
        } catch (e) { console.error("Lỗi tải Exam API:", e); }
    }

    function renderQuestions() {
        const qArea = document.getElementById('questionsArea');
        if (examData.length === 0) return;
        
        qArea.innerHTML = '';
        examData.forEach((q, index) => {
            let optionsHtml = '';
            q.options.forEach((opt, oIndex) => {
                if(opt) {
                    optionsHtml += `
                        <label class="option-label block relative w-full mb-3">
                            <input type="radio" name="q_${index}" value="${oIndex}" class="option-input peer sr-only">
                            <div class="option-content w-full bg-slate-50 border-2 border-slate-200 rounded-xl p-4 flex items-center hover:bg-slate-100">
                                <div class="custom-radio w-6 h-6 rounded-full border-2 border-slate-300 mr-4 flex-shrink-0 flex items-center justify-center">
                                    <i class="fa-solid fa-check text-white text-xs opacity-0 peer-checked:opacity-100 transition"></i>
                                </div>
                                <span class="text-slate-700 font-bold">${opt}</span>
                            </div>
                        </label>
                    `;
                }
            });

            qArea.innerHTML += `
                <div class="question-block bg-white border-2 border-slate-100 p-6 sm:p-8 rounded-2xl shadow-sm" id="question_box_${index}">
                    <h3 class="text-xl font-black text-slate-800 mb-6"><span class="text-emerald-500 mr-2">Q${index + 1}.</span> ${q.q}</h3>
                    <div class="options-group">
                        ${optionsHtml}
                    </div>
                </div>
            `;
        });

        document.getElementById('btnSubmitExam').classList.remove('hidden');
    }

    function submitExam() {
        let score = 0;
        let total = examData.length;
        
        examData.forEach((q, index) => {
            let selected = document.querySelector(`input[name="q_${index}"]:checked`);
            let qBox = document.getElementById(`question_box_${index}`);
            
            // Xóa UI cũ
            qBox.querySelectorAll('.option-content').forEach(el => {
                el.classList.remove('bg-rose-50', 'border-rose-300', 'bg-emerald-50', 'border-emerald-300', 'text-emerald-700', 'text-rose-700');
            });

            if (selected) {
                let sVal = parseInt(selected.value);
                if (sVal === q.ans) {
                    score++;
                }
            }
        });

        let percentage = Math.round((score / total) * 100);
        
        // Cập nhật giao diện Modal
        document.getElementById('scoreAchieved').innerText = score;
        document.getElementById('scoreTotal').innerText = total;
        
        const header = document.getElementById('resultHeader');
        const percentageDisplay = document.getElementById('percentageDisplay');
        const rewardBox = document.getElementById('rewardBox');
        
        // THEO LOGIC: THI ENTRY (VƯỢT CẤP) HAY THI LẤY XU?
        if (examType === 'entry') {
            if (percentage >= 70) {
                // PASS VƯỢT CẤP
                percentageDisplay.className = "font-black text-xl mt-2 text-emerald-500";
                percentageDisplay.innerText = `${percentage}% - PASSED!`;
                header.innerHTML = `<i class="fa-solid fa-unlock-keyhole text-6xl text-emerald-500 mb-4"></i><h3 class="text-3xl font-black text-slate-800">Level Unlocked!</h3>`;
                rewardBox.innerHTML = `<p class="font-bold text-slate-500">You have successfully unlocked <span class="text-emerald-500 font-black">${targetLevel.replace('_', ' ').toUpperCase()}</span>.</p>`;
                
                // MỞ KHÓA FIREBASE
                db.ref(`users/${currentUser.uid}/unlocked_levels/${targetLevel}`).set(true);
                confetti({ particleCount: 150, spread: 80, origin: { y: 0.5 } });
            } else {
                // FAIL
                percentageDisplay.className = "font-black text-xl mt-2 text-rose-500";
                percentageDisplay.innerText = `${percentage}% - FAILED`;
                header.innerHTML = `<i class="fa-solid fa-lock text-6xl text-rose-400 mb-4"></i><h3 class="text-3xl font-black text-slate-800">Keep Trying</h3>`;
                rewardBox.innerHTML = `<p class="font-bold text-slate-500">You need at least 70% to unlock this level. Review your basics and try again!</p>`;
            }
        } else {
            // LOGIC THI LẤY XU (GENERAL EXAM)
            let earnedCoins = score * 10; // Mỗi câu đúng 10 xu
            percentageDisplay.className = "font-black text-xl mt-2 text-amber-500";
            percentageDisplay.innerText = `Accuracy: ${percentage}%`;
            
            if (score > 0) {
                header.innerHTML = `<i class="fa-solid fa-sack-dollar text-6xl text-amber-400 mb-4"></i><h3 class="text-3xl font-black text-slate-800">Great Job!</h3>`;
                rewardBox.innerHTML = `
                    <div class="bg-amber-50 border-2 border-amber-200 rounded-xl p-4 inline-block px-8">
                        <p class="text-sm font-bold text-amber-700 uppercase tracking-widest mb-1">Reward</p>
                        <p class="text-3xl font-black text-amber-500">+${earnedCoins} <i class="fa-solid fa-coins text-xl"></i></p>
                    </div>`;
                
                // CỘNG XU VÀO FIREBASE
                db.ref(`users/${currentUser.uid}`).update({ coins: currentCoins + earnedCoins });
                confetti({ particleCount: 150, spread: 80, origin: { y: 0.5 } });
            } else {
                header.innerHTML = `<i class="fa-solid fa-face-frown-open text-6xl text-slate-400 mb-4"></i><h3 class="text-3xl font-black text-slate-800">No Coins Earned</h3>`;
                rewardBox.innerHTML = `<p class="font-bold text-slate-500">You need correct answers to earn coins. Keep practicing!</p>`;
            }
        }

        document.getElementById('resultModal').classList.remove('hidden');
        document.getElementById('resultModal').classList.add('flex');
    }
  </script>
</body>
</html>
