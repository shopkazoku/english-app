<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exam Center - Study Daily</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    body { font-family: 'Nunito', sans-serif; background: #f8fafc; }
    .custom-scroll::-webkit-scrollbar { width: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 8px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
  </style>
</head>
<body class="h-[100dvh] w-full flex flex-col bg-[url('https://www.transparenttextures.com/patterns/diagmonds-light.png')] relative" id="mainBody">

  <!-- HEADER -->
  <header class="bg-white border-b-2 border-indigo-100 p-3 sm:p-4 flex justify-between items-center shadow-sm z-50 shrink-0">
    <div class="flex items-center space-x-3">
      <button onclick="window.history.back()" class="w-10 h-10 bg-slate-100 hover:bg-slate-200 rounded-xl flex items-center justify-center text-slate-600 transition shadow-sm border border-slate-200" title="Back">
          <i class="fa-solid fa-arrow-left"></i>
      </button>
      <div class="flex flex-col">
        <h1 class="font-black text-lg sm:text-xl text-indigo-900 leading-tight">Exam Center</h1>
        <span id="examSubtitle" class="mt-0.5 text-rose-500 font-bold text-[10px] sm:text-xs uppercase">Official Test</span>
      </div>
    </div>
    <div class="flex items-center bg-amber-50 px-4 py-2 rounded-xl border border-amber-200 shadow-sm">
        <i class="fa-solid fa-coins text-amber-500 mr-2 text-lg"></i><span id="displayCoins" class="font-black text-amber-700">...</span>
    </div>
  </header>

  <!-- LOADING OVERLAY -->
  <div id="loadingOverlay" class="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-white transition-opacity duration-500">
      <i class="fa-solid fa-file-signature fa-bounce text-5xl text-rose-500 mb-4"></i>
      <p class="font-black text-slate-500 animate-pulse text-sm">Generating Your Exam...</p>
  </div>

  <!-- NỘI DUNG ĐỀ THI -->
  <main class="flex-1 w-full max-w-3xl mx-auto p-4 sm:p-8 overflow-y-auto custom-scroll flex flex-col relative opacity-0 transition-opacity duration-500" id="mainContent">
      
      <div class="bg-white rounded-3xl shadow-xl border border-slate-100 p-6 sm:p-10 mb-10">
          <div class="text-center border-b-2 border-dashed border-slate-200 pb-6 mb-8">
              <i class="fa-solid fa-graduation-cap text-5xl text-indigo-600 mb-4"></i>
              <h2 id="examTitle" class="text-3xl font-black text-slate-800 uppercase tracking-wide">Loading Exam...</h2>
              <p class="text-slate-500 font-bold mt-2">Read the questions carefully and select the best answer.</p>
          </div>

          <!-- Danh sách câu hỏi thi -->
          <div id="examContainer" class="space-y-8">
              <!-- JS tự động vẽ câu hỏi -->
          </div>

          <div id="resultContainer" class="mt-10 hidden text-center p-8 rounded-2xl border-4 border-dashed border-rose-200 bg-rose-50 transform transition-all scale-95">
              <h3 id="resultText" class="text-4xl font-black text-rose-600 mb-2"></h3>
              <p id="resultSubtext" class="text-rose-500 font-bold text-lg"></p>
          </div>

          <button id="submitBtn" onclick="submitExam()" class="mt-10 w-full py-5 bg-gradient-to-r from-rose-500 to-pink-600 text-white rounded-2xl font-black text-xl shadow-lg hover:shadow-xl hover:-translate-y-1 transform transition flex justify-center items-center">
              <i class="fa-solid fa-check-double mr-2"></i> SUBMIT EXAM
          </button>
      </div>
  </main>

  <script>
    // ==========================================
    // CẤU HÌNH HỆ THỐNG
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyD8EXAmo1IlRCnQ_EFXorlKDrtrJmx8J1M",
      authDomain: "roundup-ai-academy.firebaseapp.com",
      projectId: "roundup-ai-academy",
      storageBucket: "roundup-ai-academy.firebasestorage.app",
      messagingSenderId: "723976989630",
      appId: "1:723976989630:web:45f3de91269e70f604e7ef"
    };
    
    const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbwtm-mJCRvAiXcbLI_dWEnzDGbqw1sWeBQqISC614dsvuiGkzyx6j-z5RS6jNx0xaX27w/exec";

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth(); 
    const db = firebase.database();
    
    let currentCoins = 0;
    let examData = [];
    
    // Bắt tham số URL để biết đang thi loại gì (Ví dụ: exam.html?level=starter&type=midterm)
    const urlParams = new URLSearchParams(window.location.search);
    let targetLevel = urlParams.get('level') || 'starter';
    let examType = urlParams.get('type') || 'entry'; // entry, midterm, final

    // ==========================================
    // KHỞI ĐỘNG HỆ THỐNG & TẢI ĐỀ THI
    // ==========================================
    auth.onAuthStateChanged((user) => {
      if (user) {
        db.ref('users/' + user.uid).once('value').then(async (snapshot) => {
            let data = snapshot.val() || { coins: 0 };
            currentCoins = data.coins || 0;
            document.getElementById('displayCoins').innerText = currentCoins;
            
            // Render Tiêu đề
            let displayType = examType === 'entry' ? "Entry Test" : (examType === 'midterm' ? "Midterm Exam" : "Final Exam");
            document.getElementById('examTitle').innerText = `${targetLevel.replace('_', ' ')} - ${displayType}`;

            await loadExamFromGoogleSheets();

            setTimeout(() => { 
                document.getElementById('loadingOverlay').style.display = 'none'; 
                document.getElementById('mainContent').style.opacity = '1'; 
            }, 500);
        });
      } else { window.location.href = "index.html"; }
    });

    async function loadExamFromGoogleSheets() {
        const container = document.getElementById('examContainer');
        const submitBtn = document.getElementById('submitBtn');
        
        try {
            let res = await fetch(SHEET_API_URL);
            let masterData = await res.json();
            
            if (masterData && masterData.exam && masterData.exam[targetLevel] && masterData.exam[targetLevel][examType]) {
                examData = masterData.exam[targetLevel][examType];
                renderExam();
            } else {
                examData = [];
                submitBtn.classList.add('hidden');
                container.innerHTML = `
                    <div class="bg-slate-50 p-10 rounded-3xl text-center border-2 border-dashed border-slate-200">
                        <i class="fa-solid fa-box-open text-6xl text-slate-300 mb-4"></i>
                        <p class="text-slate-600 font-black text-xl">Exam Not Found</p>
                        <p class="text-slate-400 mt-2">The ${examType} for ${targetLevel} is not available yet.</p>
                    </div>`;
            }
        } catch (e) {
            console.error("Lỗi tải đề thi:", e);
            container.innerHTML = `<p class="text-rose-500 font-bold text-center">Cannot connect to Exam Server.</p>`;
        }
    }

    function renderExam() {
        const container = document.getElementById('examContainer');
        container.innerHTML = '';
        
        examData.forEach((item, index) => {
            let optionsHtml = '';
            item.options.forEach((opt, optIdx) => {
                if(opt) { 
                    optionsHtml += `
                        <label class="flex items-center space-x-4 p-4 border-2 border-slate-100 rounded-xl cursor-pointer hover:bg-rose-50 hover:border-rose-200 transition group bg-white shadow-sm">
                            <input type="radio" name="q${index}" value="${optIdx + 1}" class="form-radio h-6 w-6 text-rose-500">
                            <span class="text-slate-700 font-bold text-lg group-hover:text-rose-700">${opt}</span>
                        </label>
                    `;
                }
            });
            
            container.innerHTML += `
                <div class="p-6 sm:p-8 bg-slate-50 rounded-2xl border border-slate-200 shadow-sm relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-2 h-full bg-rose-400"></div>
                    <p class="font-black text-xl mb-6 text-slate-800"><span class="text-rose-500">Q${index + 1}:</span> ${item.q}</p>
                    <div class="grid grid-cols-1 gap-4">
                        ${optionsHtml}
                    </div>
                    <p id="exp-q${index}" class="mt-6 hidden text-base font-bold bg-rose-100 text-rose-600 p-4 rounded-xl border border-rose-200"></p>
                </div>
            `;
        });
    }

    // ==========================================
    // CHẤM ĐIỂM, THƯỞNG COIN & VOICE AI
    // ==========================================
    function getFemaleVoice() {
        let voices = window.speechSynthesis.getVoices();
        return voices.find(v => v.lang.startsWith('en') && (v.name.includes('Zira') || v.name.includes('Samantha') || v.name.includes('Victoria') || v.name.includes('Google US English'))) || voices.find(v => v.lang.startsWith('en'));
    }

    if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = function() { window.speechSynthesis.getVoices(); };
    }

    function speakTeacherVoice(scorePercent) {
        let speech = new SpeechSynthesisUtterance();
        speech.lang = 'en-US'; speech.pitch = 1.3; speech.rate = 1.0;
        let femaleVoice = getFemaleVoice();
        if (femaleVoice) speech.voice = femaleVoice;
        
        if (scorePercent >= 90) speech.text = `Outstanding performance! You passed the exam with flying colors!`;
        else if (scorePercent >= 50) speech.text = `Good job! You passed the exam, but keep reviewing your materials.`;
        else speech.text = `You didn't pass this time. Please check your mistakes and try again.`;
        
        window.speechSynthesis.speak(speech);
    }

    function submitExam() {
        // Khóa nút nộp bài để tránh click đúp
        document.getElementById('submitBtn').disabled = true;
        document.getElementById('submitBtn').classList.add('opacity-50', 'cursor-not-allowed');

        let correctCount = 0;
        
        examData.forEach((item, index) => {
            const selected = document.querySelector(`input[name="q${index}"]:checked`);
            const expEl = document.getElementById(`exp-q${index}`);
            
            // Khóa lựa chọn sau khi nộp
            document.querySelectorAll(`input[name="q${index}"]`).forEach(radio => radio.disabled = true);
            
            if (selected && parseInt(selected.value) === item.ans) {
                correctCount++;
                // Có thể làm highlight đáp án đúng ở đây nếu muốn
            } else {
                expEl.innerHTML = `<i class="fa-solid fa-circle-xmark mr-2"></i> <strong>Incorrect!</strong> ${item.exp}`;
                expEl.classList.remove('hidden');
            }
        });

        const total = examData.length;
        const scorePercent = total > 0 ? Math.round((correctCount / total) * 100) : 0;
        
        let resultText = ""; 
        let subText = "";
        let rewardCoins = 0;
        
        const resBox = document.getElementById('resultContainer');
        
        if (scorePercent >= 90) { 
            resultText = `${scorePercent}% - EXCELLENT!`; 
            rewardCoins = 500;
            subText = `Congratulations! You earned +${rewardCoins} Coins.`;
            resBox.className = "mt-10 text-center p-8 rounded-2xl border-4 border-dashed border-emerald-300 bg-emerald-50 transform transition-all scale-100";
            document.getElementById('resultText').className = "text-4xl font-black text-emerald-600 mb-2";
            document.getElementById('resultSubtext').className = "text-emerald-500 font-bold text-lg";
            triggerConfetti();
        }
        else if (scorePercent >= 50) { 
            resultText = `${scorePercent}% - PASSED!`; 
            rewardCoins = 200;
            subText = `Good effort! You earned +${rewardCoins} Coins.`;
            resBox.className = "mt-10 text-center p-8 rounded-2xl border-4 border-dashed border-amber-300 bg-amber-50 transform transition-all scale-100";
            document.getElementById('resultText').className = "text-4xl font-black text-amber-600 mb-2";
            document.getElementById('resultSubtext').className = "text-amber-500 font-bold text-lg";
            triggerConfetti();
        }
        else { 
            resultText = `${scorePercent}% - FAILED`; 
            subText = "Please review the lessons and try again.";
            resBox.className = "mt-10 text-center p-8 rounded-2xl border-4 border-dashed border-rose-300 bg-rose-50 transform transition-all scale-100";
            document.getElementById('resultText').className = "text-4xl font-black text-rose-600 mb-2";
            document.getElementById('resultSubtext').className = "text-rose-500 font-bold text-lg";
        }

        document.getElementById('resultText').innerText = resultText;
        document.getElementById('resultSubtext').innerText = subText;
        resBox.classList.remove('hidden');

        // Cập nhật xu vào Firebase nếu pass
        if (rewardCoins > 0 && auth.currentUser) {
            let newCoins = currentCoins + rewardCoins;
            db.ref('users/' + auth.currentUser.uid).update({ coins: newCoins })
              .then(() => {
                  document.getElementById('displayCoins').innerText = newCoins;
                  // Hiệu ứng update xu
                  document.getElementById('displayCoins').classList.add('text-emerald-500', 'scale-125');
                  setTimeout(() => document.getElementById('displayCoins').classList.remove('text-emerald-500', 'scale-125'), 1000);
              });
        }

        speakTeacherVoice(scorePercent);
    }

    function triggerConfetti() {
        var duration = 3 * 1000;
        var end = Date.now() + duration;
        (function frame() {
            confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#f43f5e', '#10b981', '#f59e0b'] });
            confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#f43f5e', '#10b981', '#f59e0b'] });
            if (Date.now() < end) requestAnimationFrame(frame);
        }());
    }
  </script>
</body>
</html>
