<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Study Daily</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
  
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    body { font-family: 'Nunito', sans-serif; background: #f8fafc; }
    .custom-scroll::-webkit-scrollbar { width: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 8px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
    .level-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .level-card:hover { transform: translateY(-4px); }
    
    .spin-slow { animation: spin 4s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    /* Hiệu ứng chọn Avatar */
    .avatar-option { transition: all 0.2s; cursor: pointer; }
    .avatar-option:hover { transform: scale(1.1); }
    .avatar-selected { border-color: #6366f1 !important; transform: scale(1.1); box-shadow: 0 4px 6px -1px rgba(99, 102, 241, 0.5); }
  </style>
</head>
<body class="h-[100dvh] w-full flex flex-col bg-[url('https://www.transparenttextures.com/patterns/diagmonds-light.png')] relative" id="mainBody">

  <!-- MUSIC PLAYER NỔI -->
  <div class="fixed bottom-6 right-6 z-50">
      <button id="musicToggleBtn" onclick="toggleMusic()" class="w-14 h-14 bg-white/90 backdrop-blur-sm text-indigo-500 rounded-full shadow-2xl border-2 border-indigo-100 flex items-center justify-center text-xl hover:scale-110 hover:text-indigo-700 transition relative">
          <i id="musicIcon" class="fa-solid fa-music"></i>
          <span id="musicOffSlash" class="absolute inset-0 flex items-center justify-center text-rose-500 text-3xl font-light transform -rotate-45 hidden">\</span>
      </button>
      <audio id="bgMusic" loop>
          <source src="https://cdn.pixabay.com/audio/2022/05/27/audio_1808fbf07a.mp3" type="audio/mpeg">
      </audio>
  </div>

  <!-- HEADER -->
  <header class="bg-indigo-600 text-white p-4 sm:p-6 flex justify-between items-center shadow-lg z-50 shrink-0">
    <div class="flex items-center space-x-4">
      
      <!-- AVATAR PROFILE -->
      <div onclick="openAvatarModal()" class="w-14 h-14 bg-indigo-200 rounded-full flex items-center justify-center shadow-inner border-2 border-white/50 cursor-pointer overflow-hidden group relative" title="Change Avatar">
          <img id="userAvatarImg" src="https://api.dicebear.com/7.x/adventurer/svg?seed=Felix" alt="Avatar" class="w-full h-full object-cover group-hover:scale-110 transition duration-300 bg-white">
          <div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition">
              <i class="fa-solid fa-pen text-white text-sm"></i>
          </div>
      </div>

      <div class="flex flex-col">
        <h1 class="font-black text-xl sm:text-2xl leading-tight">My Dashboard</h1>
        <span id="userEmailDisplay" class="mt-0.5 text-indigo-200 font-bold text-xs truncate max-w-[150px] sm:max-w-xs">Loading...</span>
      </div>
    </div>
    
    <div class="flex items-center gap-3 sm:gap-4">
        <div class="flex items-center bg-white/10 px-3 sm:px-4 py-2 rounded-xl border border-white/20 shadow-sm backdrop-blur-sm">
            <i class="fa-solid fa-coins text-amber-300 mr-2 text-lg sm:text-xl fa-spin-hover"></i>
            <span id="displayCoins" class="font-black text-white text-lg sm:text-xl">0</span>
        </div>
        <button onclick="handleLogout()" class="w-10 h-10 bg-rose-500 hover:bg-rose-600 rounded-xl flex items-center justify-center text-white transition shadow-sm border border-rose-400" title="Logout">
            <i class="fa-solid fa-right-from-bracket"></i>
        </button>
    </div>
  </header>

  <div id="loadingOverlay" class="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-slate-900/80 backdrop-blur-sm transition-opacity duration-500 text-white">
      <i class="fa-solid fa-rocket fa-bounce text-6xl text-indigo-400 mb-6"></i>
      <p class="font-black animate-pulse text-lg tracking-widest uppercase">Initializing Profile...</p>
  </div>

  <main class="flex-1 w-full max-w-5xl mx-auto p-4 sm:p-8 overflow-y-auto custom-scroll flex flex-col opacity-0 transition-opacity duration-500" id="mainContent">
      <div class="grid grid-cols-2 gap-4 sm:gap-6 mb-10">
          <div onclick="window.location.href='arena.html'" class="bg-gradient-to-br from-amber-400 to-orange-500 rounded-3xl p-6 text-white shadow-lg cursor-pointer hover:shadow-xl hover:-translate-y-1 transition transform relative overflow-hidden group">
              <div class="absolute -right-6 -bottom-6 opacity-20 group-hover:scale-110 transition duration-500"><i class="fa-solid fa-gamepad text-9xl"></i></div>
              <h3 class="font-black text-2xl sm:text-3xl mb-1 relative z-10">Game Arena</h3>
              <p class="font-bold text-amber-100 text-sm relative z-10">Play & Earn Coins</p>
          </div>
          <div onclick="window.location.href='exam.html?level=general&type=exam'" class="bg-gradient-to-br from-emerald-400 to-teal-500 rounded-3xl p-6 text-white shadow-lg cursor-pointer hover:shadow-xl hover:-translate-y-1 transition transform relative overflow-hidden group">
              <div class="absolute -right-6 -bottom-6 opacity-20 group-hover:scale-110 transition duration-500"><i class="fa-solid fa-file-signature text-9xl"></i></div>
              <h3 class="font-black text-2xl sm:text-3xl mb-1 relative z-10">Exam Center</h3>
              <p class="font-bold text-emerald-100 text-sm relative z-10">Test Your Limits</p>
          </div>
      </div>

      <div class="mb-6 flex justify-between items-end border-b-2 border-slate-200 pb-4">
          <div>
              <h2 class="text-2xl sm:text-3xl font-black text-slate-800">Learning Roadmap</h2>
              <p class="text-slate-500 font-bold mt-1">Unlock higher levels by passing their Entry Tests.</p>
          </div>
      </div>

      <div id="roadmapContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 pb-20">
          <!-- JS Render -->
      </div>
  </main>

  <!-- AVATAR STUDIO MODAL -->
  <div id="avatarModal" class="fixed inset-0 z-[9999] bg-slate-900/80 backdrop-blur-sm hidden flex-col items-center justify-center p-4">
      <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden transform transition-all scale-100">
          <div class="bg-indigo-600 p-4 flex justify-between items-center text-white">
              <h3 class="font-black text-xl flex items-center"><i class="fa-solid fa-user-astronaut mr-2"></i> Avatar Studio</h3>
              <button onclick="closeAvatarModal()" class="w-8 h-8 flex items-center justify-center bg-indigo-700 rounded-full hover:bg-rose-500 transition"><i class="fa-solid fa-xmark"></i></button>
          </div>
          
          <div class="p-6">
              <p class="text-sm font-bold text-slate-500 uppercase tracking-widest mb-4 text-center">Choose an Avatar</p>
              
              <!-- CÁC AVATAR MẶC ĐỊNH TỪ DICEBEAR -->
              <div class="grid grid-cols-4 gap-4 mb-8">
                  <div onclick="selectPresetAvatar('https://api.dicebear.com/7.x/adventurer/svg?seed=Felix')" class="avatar-option bg-indigo-50 border-4 border-transparent rounded-2xl overflow-hidden aspect-square">
                      <img src="https://api.dicebear.com/7.x/adventurer/svg?seed=Felix" class="w-full h-full object-cover">
                  </div>
                  <div onclick="selectPresetAvatar('https://api.dicebear.com/7.x/adventurer/svg?seed=Aneka')" class="avatar-option bg-emerald-50 border-4 border-transparent rounded-2xl overflow-hidden aspect-square">
                      <img src="https://api.dicebear.com/7.x/adventurer/svg?seed=Aneka" class="w-full h-full object-cover">
                  </div>
                  <div onclick="selectPresetAvatar('https://api.dicebear.com/7.x/adventurer/svg?seed=Mimi')" class="avatar-option bg-rose-50 border-4 border-transparent rounded-2xl overflow-hidden aspect-square">
                      <img src="https://api.dicebear.com/7.x/adventurer/svg?seed=Mimi" class="w-full h-full object-cover">
                  </div>
                  <div onclick="selectPresetAvatar('https://api.dicebear.com/7.x/adventurer/svg?seed=Jack')" class="avatar-option bg-amber-50 border-4 border-transparent rounded-2xl overflow-hidden aspect-square">
                      <img src="https://api.dicebear.com/7.x/adventurer/svg?seed=Jack" class="w-full h-full object-cover">
                  </div>
              </div>

              <p class="text-sm font-bold text-slate-500 uppercase tracking-widest mb-2 text-center">Or Paste Custom Image Link</p>
              <div class="relative mb-6">
                  <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400"><i class="fa-solid fa-link"></i></div>
                  <input type="url" id="customAvatarUrl" placeholder="https://example.com/my-avatar.jpg" class="w-full pl-10 pr-4 py-3 bg-slate-50 border-2 border-slate-200 rounded-xl focus:bg-white focus:border-indigo-500 focus:outline-none font-bold text-slate-700 transition">
              </div>

              <button onclick="saveAvatar()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-black py-4 rounded-xl shadow-lg hover:-translate-y-1 transition transform flex items-center justify-center gap-2">
                  SAVE PROFILE <i class="fa-solid fa-floppy-disk"></i>
              </button>
          </div>
      </div>
  </div>

  <script>
    // 1. CÔNG TẮC BẢO HIỂM
    function hideLoading() {
        const overlay = document.getElementById('loadingOverlay');
        const content = document.getElementById('mainContent');
        if(overlay) overlay.style.display = 'none';
        if(content) content.style.opacity = '1';
    }
    setTimeout(hideLoading, 2000);

    // 2. NHẠC NỀN LOFI TƯƠNG TỰ INDEX
    const bgMusic = document.getElementById('bgMusic');
    const musicIcon = document.getElementById('musicIcon');
    const musicOffSlash = document.getElementById('musicOffSlash');
    let hasInteracted = false; let isMusicPlaying = false;

    function attemptPlayMusic() {
        if (!hasInteracted) {
            bgMusic.volume = 0.5;
            let playPromise = bgMusic.play();
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    hasInteracted = true; isMusicPlaying = true;
                    musicIcon.classList.add('spin-slow'); musicIcon.classList.replace('fa-music', 'fa-compact-disc'); musicOffSlash.classList.add('hidden');
                }).catch(error => { console.log("Trình duyệt chặn Autoplay."); });
            }
        }
    }
    document.addEventListener('keydown', attemptPlayMusic, { once: true });
    document.addEventListener('click', attemptPlayMusic, { once: true });

    function toggleMusic() {
        if (isMusicPlaying) {
            bgMusic.pause(); isMusicPlaying = false;
            musicIcon.classList.remove('spin-slow'); musicIcon.classList.replace('fa-compact-disc', 'fa-music'); musicOffSlash.classList.remove('hidden');
        } else {
            bgMusic.play(); isMusicPlaying = true;
            musicIcon.classList.add('spin-slow'); musicIcon.classList.replace('fa-music', 'fa-compact-disc'); musicOffSlash.classList.add('hidden'); hasInteracted = true;
        }
    }

    const firebaseConfig = {
      apiKey: "AIzaSyD8EXAmo1IlRCnQ_EFXorlKDrtrJmx8J1M",
      authDomain: "roundup-ai-academy.firebaseapp.com",
      projectId: "roundup-ai-academy",
      storageBucket: "roundup-ai-academy.firebasestorage.app",
      messagingSenderId: "723976989630",
      appId: "1:723976989630:web:45f3de91269e70f604e7ef"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth(); 
    const db = firebase.database();
    
    let currentUser = null;
    let selectedAvatarUrl = "";
    
    const SYSTEM_LEVELS = [
        { id: 'starter', name: 'Starter', icon: 'fa-seedling', desc: 'Beginner foundations' },
        { id: 'level_1', name: 'Level 1', icon: 'fa-leaf', desc: 'Basic communication' },
        { id: 'level_2', name: 'Level 2', icon: 'fa-tree', desc: 'Intermediate skills' },
        { id: 'level_3', name: 'Level 3', icon: 'fa-mountain', desc: 'Advanced proficiency' },
        { id: 'level_4', name: 'Level 4', icon: 'fa-crown', desc: 'Expert mastery' },
        { id: 'level_5', name: 'Level 5', icon: 'fa-gem', desc: 'Elite fluency' },
        { id: 'level_6', name: 'Level 6', icon: 'fa-star', desc: 'Native-like intuition' }
    ];

    auth.onAuthStateChanged((user) => {
      if (user) {
        currentUser = user;
        document.getElementById('userEmailDisplay').innerText = user.email;

        db.ref('users/' + user.uid).on('value', (snapshot) => {
            let data = snapshot.val() || {};
            
            let unlocked = data.unlocked_levels || {};
            unlocked['starter'] = true;

            document.getElementById('displayCoins').innerText = data.coins || 0;
            
            // Cập nhật Avatar từ Firebase
            if(data.avatar) {
                document.getElementById('userAvatarImg').src = data.avatar;
                selectedAvatarUrl = data.avatar;
            }

            renderRoadmap(unlocked);
            hideLoading();
        });
      } else { window.location.href = "index.html"; }
    });

    // ==========================================
    // LOGIC AVATAR STUDIO
    // ==========================================
    function openAvatarModal() {
        document.getElementById('avatarModal').classList.remove('hidden');
        document.getElementById('avatarModal').classList.add('flex');
        
        // Reset CSS selection
        document.querySelectorAll('.avatar-option').forEach(el => el.classList.remove('avatar-selected'));
    }

    function closeAvatarModal() {
        document.getElementById('avatarModal').classList.add('hidden');
        document.getElementById('avatarModal').classList.remove('flex');
    }

    function selectPresetAvatar(url) {
        selectedAvatarUrl = url;
        document.getElementById('customAvatarUrl').value = ""; // Xóa link custom nếu có
        
        // Cập nhật viền cho Avatar được chọn
        document.querySelectorAll('.avatar-option').forEach(el => {
            if(el.querySelector('img').src === url) el.classList.add('avatar-selected');
            else el.classList.remove('avatar-selected');
        });
    }

    function saveAvatar() {
        let customInput = document.getElementById('customAvatarUrl').value.trim();
        let finalUrl = customInput !== "" ? customInput : selectedAvatarUrl;

        if (finalUrl === "") { alert("Please select an avatar or provide a custom URL."); return; }

        // Lưu trực tiếp lên Firebase
        db.ref('users/' + currentUser.uid).update({ avatar: finalUrl }).then(() => {
            document.getElementById('userAvatarImg').src = finalUrl;
            closeAvatarModal();
        }).catch(err => alert("Error saving profile: " + err.message));
    }

    // ==========================================
    // ROADMAP & ĐIỀU HƯỚNG
    // ==========================================
    function renderRoadmap(unlockedLevelsObj) {
        const container = document.getElementById('roadmapContainer');
        container.innerHTML = '';

        SYSTEM_LEVELS.forEach((levelDef) => {
            let isUnlocked = !!unlockedLevelsObj[levelDef.id];
            
            let cardHtml = `
                <div class="level-card bg-white rounded-3xl p-6 border-2 ${isUnlocked ? 'border-indigo-100 shadow-lg' : 'border-slate-100 shadow-sm opacity-80'} flex flex-col relative overflow-hidden">
                    ${isUnlocked ? `<div class="absolute -right-4 -top-4 w-24 h-24 bg-indigo-50 rounded-full z-0"></div>` : `<div class="absolute -right-4 -top-4 w-24 h-24 bg-slate-50 rounded-full z-0"></div>`}
                    <div class="relative z-10 flex items-center justify-between mb-4">
                        <div class="w-14 h-14 rounded-2xl flex items-center justify-center text-2xl ${isUnlocked ? 'bg-indigo-100 text-indigo-600' : 'bg-slate-100 text-slate-400'}"><i class="fa-solid ${levelDef.icon}"></i></div>
                        ${isUnlocked ? `<span class="bg-emerald-100 text-emerald-600 font-black px-3 py-1 rounded-lg text-xs uppercase tracking-wider"><i class="fa-solid fa-unlock mr-1"></i> Unlocked</span>` : `<span class="bg-slate-100 text-slate-500 font-black px-3 py-1 rounded-lg text-xs uppercase tracking-wider"><i class="fa-solid fa-lock mr-1"></i> Locked</span>`}
                    </div>
                    <h3 class="text-2xl font-black ${isUnlocked ? 'text-slate-800' : 'text-slate-500'} relative z-10 mb-1">${levelDef.name}</h3>
                    <p class="text-slate-400 font-bold text-sm relative z-10 flex-1 mb-6">${levelDef.desc}</p>
                    <div class="relative z-10 mt-auto">
                        ${isUnlocked ? `<button onclick="enterClassroom('${levelDef.id}')" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-black py-3 rounded-xl shadow-md transition flex justify-center items-center gap-2">Enter Classroom <i class="fa-solid fa-arrow-right"></i></button>` : `<button onclick="takeEntryTest('${levelDef.id}', '${levelDef.name}')" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-black py-3 rounded-xl shadow-md transition flex justify-center items-center gap-2">Take Entry Test <i class="fa-solid fa-key"></i></button>`}
                    </div>
                </div>
            `;
            container.innerHTML += cardHtml;
        });
    }

    function enterClassroom(levelId) {
        db.ref('users/' + currentUser.uid).update({ current_level: levelId }).then(() => { window.location.href = `classroom.html?level=${levelId}`; });
    }

    function takeEntryTest(levelId, levelName) {
        if(confirm(`Bạn có muốn làm bài Entry Test để mở khóa ${levelName} không?\n(Bạn cần vượt qua bài thi này để chứng minh năng lực).`)) { window.location.href = `exam.html?level=${levelId}&type=entry`; }
    }

    function handleLogout() {
        if(confirm("Are you sure you want to logout?")) { auth.signOut().then(() => { window.location.href = "index.html"; }); }
    }
  </script>
</body>
</html>
