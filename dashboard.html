<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Study Daily</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
  
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    body { font-family: 'Nunito', sans-serif; background: #f8fafc; }
    .custom-scroll::-webkit-scrollbar { width: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 8px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
    
    .level-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .level-card:hover { transform: translateY(-4px); }
  </style>
</head>
<body class="h-[100dvh] w-full flex flex-col bg-[url('https://www.transparenttextures.com/patterns/diagmonds-light.png')] relative" id="mainBody">

  <!-- HEADER TỔNG QUAN -->
  <header class="bg-indigo-600 text-white p-4 sm:p-6 flex justify-between items-center shadow-lg z-50 shrink-0">
    <div class="flex items-center space-x-4">
      <div class="w-12 h-12 bg-white/20 rounded-full flex items-center justify-center text-2xl font-black shadow-inner border border-white/30">
          <i class="fa-solid fa-user-astronaut"></i>
      </div>
      <div class="flex flex-col">
        <h1 class="font-black text-xl sm:text-2xl leading-tight">My Dashboard</h1>
        <span id="userEmailDisplay" class="mt-0.5 text-indigo-200 font-bold text-xs">Loading...</span>
      </div>
    </div>
    
    <div class="flex items-center gap-4">
        <!-- Ví Xu -->
        <div class="flex items-center bg-white/10 px-4 py-2 rounded-xl border border-white/20 shadow-sm backdrop-blur-sm">
            <i class="fa-solid fa-coins text-amber-300 mr-2 text-xl fa-spin-hover"></i>
            <span id="displayCoins" class="font-black text-white text-xl">...</span>
        </div>
        <!-- Nút Đăng xuất -->
        <button onclick="handleLogout()" class="w-10 h-10 bg-rose-500 hover:bg-rose-600 rounded-xl flex items-center justify-center text-white transition shadow-sm border border-rose-400" title="Logout">
            <i class="fa-solid fa-right-from-bracket"></i>
        </button>
    </div>
  </header>

  <!-- LOADING OVERLAY -->
  <div id="loadingOverlay" class="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-slate-900/80 backdrop-blur-sm transition-opacity duration-500 text-white">
      <i class="fa-solid fa-rocket fa-bounce text-6xl text-indigo-400 mb-6"></i>
      <p class="font-black animate-pulse text-lg tracking-widest uppercase">Initializing Profile...</p>
  </div>

  <main class="flex-1 w-full max-w-5xl mx-auto p-4 sm:p-8 overflow-y-auto custom-scroll flex flex-col opacity-0 transition-opacity duration-500" id="mainContent">
      
      <!-- LỐI TẮT NHANH (QUICK ACCESS) -->
      <div class="grid grid-cols-2 gap-4 sm:gap-6 mb-10">
          <div onclick="window.location.href='arena.html'" class="bg-gradient-to-br from-amber-400 to-orange-500 rounded-3xl p-6 text-white shadow-lg cursor-pointer hover:shadow-xl hover:-translate-y-1 transition transform relative overflow-hidden group">
              <div class="absolute -right-6 -bottom-6 opacity-20 group-hover:scale-110 transition duration-500"><i class="fa-solid fa-gamepad text-9xl"></i></div>
              <h3 class="font-black text-2xl sm:text-3xl mb-1 relative z-10">Game Arena</h3>
              <p class="font-bold text-amber-100 text-sm relative z-10">Play & Earn Coins</p>
          </div>
          <div onclick="window.location.href='exam.html?level=general&type=exam'" class="bg-gradient-to-br from-emerald-400 to-teal-500 rounded-3xl p-6 text-white shadow-lg cursor-pointer hover:shadow-xl hover:-translate-y-1 transition transform relative overflow-hidden group">
              <div class="absolute -right-6 -bottom-6 opacity-20 group-hover:scale-110 transition duration-500"><i class="fa-solid fa-file-signature text-9xl"></i></div>
              <h3 class="font-black text-2xl sm:text-3xl mb-1 relative z-10">Exam Center</h3>
              <p class="font-bold text-emerald-100 text-sm relative z-10">Test Your Limits</p>
          </div>
      </div>

      <div class="mb-6 flex justify-between items-end border-b-2 border-slate-200 pb-4">
          <div>
              <h2 class="text-2xl sm:text-3xl font-black text-slate-800">Learning Roadmap</h2>
              <p class="text-slate-500 font-bold mt-1">Unlock higher levels by passing their Entry Tests.</p>
          </div>
      </div>

      <!-- BẢN ĐỒ LỘ TRÌNH (TỰ ĐỘNG SINH RA BỞI JS) -->
      <div id="roadmapContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 pb-20">
          <!-- Các khối Level sẽ được nhúng vào đây -->
      </div>
  </main>

  <script>
    // ==========================================
    // CẤU HÌNH HỆ THỐNG
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyD8EXAmo1IlRCnQ_EFXorlKDrtrJmx8J1M",
      authDomain: "roundup-ai-academy.firebaseapp.com",
      projectId: "roundup-ai-academy",
      storageBucket: "roundup-ai-academy.firebasestorage.app",
      messagingSenderId: "723976989630",
      appId: "1:723976989630:web:45f3de91269e70f604e7ef"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth(); 
    const db = firebase.database();
    
    let currentUser = null;
    
    const SYSTEM_LEVELS = [
        { id: 'starter', name: 'Starter', icon: 'fa-seedling', desc: 'Beginner foundations' },
        { id: 'level_1', name: 'Level 1', icon: 'fa-leaf', desc: 'Basic communication' },
        { id: 'level_2', name: 'Level 2', icon: 'fa-tree', desc: 'Intermediate skills' },
        { id: 'level_3', name: 'Level 3', icon: 'fa-mountain', desc: 'Advanced proficiency' },
        { id: 'level_4', name: 'Level 4', icon: 'fa-crown', desc: 'Expert mastery' },
        { id: 'level_5', name: 'Level 5', icon: 'fa-gem', desc: 'Elite fluency' },
        { id: 'level_6', name: 'Level 6', icon: 'fa-star', desc: 'Native-like intuition' }
    ];

    // ==========================================
    // KHỞI ĐỘNG VÀ BỌC THÉP HỆ THỐNG
    // ==========================================
    auth.onAuthStateChanged((user) => {
      if (user) {
        currentUser = user;
        document.getElementById('userEmailDisplay').innerText = user.email;

        try {
            db.ref('users/' + user.uid).on('value', (snapshot) => {
                let data = snapshot.val() || {};
                
                let unlocked = data.unlocked_levels || {};
                if (!unlocked['starter']) {
                    unlocked['starter'] = true;
                    db.ref('users/' + user.uid + '/unlocked_levels/starter').set(true);
                }

                document.getElementById('displayCoins').innerText = data.coins || 0;
                renderRoadmap(unlocked);
                hideLoading();
            });
        } catch (e) {
            console.error("Firebase Database Error:", e);
        }
      } else { 
        window.location.href = "index.html"; 
      }
    });

    // Hàm ẩn Loading
    function hideLoading() {
        const overlay = document.getElementById('loadingOverlay');
        const content = document.getElementById('mainContent');
        if(overlay) overlay.style.display = 'none';
        if(content) content.style.opacity = '1';
    }

    // CÔNG TẮC BẢO HIỂM: Tự động tắt Loading sau 2.5s 
    window.addEventListener('load', () => { setTimeout(hideLoading, 2500); });

    // ==========================================
    // THUẬT TOÁN VẼ BẢN ĐỒ LỘ TRÌNH (ROADMAP)
    // ==========================================
